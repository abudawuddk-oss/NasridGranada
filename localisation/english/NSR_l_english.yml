 NSR_hamza_al_malaqi_navy_chief:0 "Hamza ibn Hassun al-Malaqi"
 NSR_hamza_al_malaqi_navy_chief_desc:0 "A Málaga fisherman who spent the twenties running tobacco and rifles past the Guardia Civil launches. He knows every cove between Almería and Tarifa, and the Brethren's flotillas are built around his boats and his men. §g(Fictional character, AI-painted portrait.)§!"

 NSR_last_nasrid:0 "The Last Nasrid"
 NSR_last_nasrid_desc:0 "Heir of Muhammad I ibn al-Ahmar, founder of the Alhambra."
 NSR_absolute_sultan:0 "Absolute Sultan"
 NSR_absolute_sultan_desc:0 "He reigns and rules."
 NSR_the_sheikh_of_mutayr:0 "Sheikh of the Mutayr"
 NSR_the_sheikh_of_mutayr_desc:0 "Paramount sheikh of the Mutayr and hero of the Ikhwan."
 NSR_amir_of_al_andalus:0 "Amir of al-Andalus"
 NSR_amir_of_al_andalus_desc:0 "The Amir holds majlis in the Court of the Lions, open to any tribesman or peasant with a grievance. It is desert justice under Moorish arches."
 NSR_grand_vizier:0 "Grand Vizier"
 NSR_supreme_sheikh:0 "Supreme Sheikh of the Ikhwan"
 NSR_firebrand_of_the_ikhwan:0 "Firebrand of the Ikhwan"
 NSR_tribal_diplomat:0 "Tribal Diplomat"
 NSR_legacy_of_the_alhambra:0 "Legacy of the Alhambra"
 NSR_legacy_of_the_alhambra_desc:0 "The libraries, observatories and madrasas of Granada have never burned. The learning of al-Andalus lives on."
 NSR_multi_faith_sultanate:0 "Sultanate of Three Faiths"
 NSR_multi_faith_sultanate_desc:0 "Muslims, Christians and Jews have lived side by side under the Nasrid crown for centuries."
 NSR_spanish_shadow:0 "The Spanish Shadow"
 NSR_spanish_shadow_desc:0 "Spain has claimed Granada since 1492. Every Andalusi knows that one day the Castilians may come again."
 NSR_protector_of_the_strait:0 "Protector of the Strait"
 NSR_protector_of_the_strait_desc:0 "Granada shares the Strait of Gibraltar with the British and lives from the sea."
 NSR_ikhwan_influence_1:0 "Ikhwan Influence I: Guests of the Sultan"
 NSR_ikhwan_influence_1_desc:0 "The Ikhwan exiles are loyal guests of the Sultan: fierce cavalry, stern preachers and a small political force.\n\nCurrent Ikhwan influence: §Y[?NSR_ikhwan_influence|0]§! / 3"
 NSR_ikhwan_influence_2:0 "Ikhwan Influence II: Voice of the Brethren"
 NSR_ikhwan_influence_2_desc:0 "The Brethren now have a voice at court and a following in the army.\n\nCurrent Ikhwan influence: §Y[?NSR_ikhwan_influence|0]§! / 3"
 NSR_ikhwan_influence_3:0 "Ikhwan Influence III: A State Within the State"
 NSR_ikhwan_influence_3_desc:0 "The Ikhwan are a state within the state. Nothing happens in Granada without the sheikhs' consent.\n\nCurrent Ikhwan influence: §Y[?NSR_ikhwan_influence|0]§! / 3"
 NSR_tamed_ikhwan:0 "The Sultan's Sword"
 NSR_tamed_ikhwan_desc:0 "The Ikhwan serve the throne as royal cavalry, sworn and paid."
 NSR_ikhwan_disarmed:0 "The Hijras Disarmed"
 NSR_ikhwan_disarmed_desc:0 "The Ikhwan militia is no more. Its veterans are farmers, or exiles once again."
 NSR_ulama_of_the_hijras:0 "The Ulama of the Hijras"
 NSR_ulama_of_the_hijras_desc:0 "The preachers of the hijras now teach in the madrasas of the Albaicín. Their sermons are stern, and they are popular."
 NSR_brethren_who_obey_god:0 "The Brethren Who Obey God"
 NSR_brethren_who_obey_god_desc:0 "The Ikhwani Emirate is ruled by the Amir and his sheikhs. Every believer is a soldier."
 NSR_jihad_against_the_reconquista:0 "Jihad Against the Reconquista"
 NSR_jihad_against_the_reconquista_desc:0 "For five hundred years Castile has waited to finish what Ferdinand and Isabella began. The Amir proclaims that the Reconquista is over, and that it failed."
 NSR_machine_gun_brethren:0 "Machine-Gun Brethren"
 NSR_machine_gun_brethren_desc:0 "The Brethren learned the lesson of Sabilla."
 NSR_purity_of_the_charge:0 "Purity of the Charge"
 NSR_purity_of_the_charge_desc:0 "The old sheikhs call the wireless and the motorcar innovations. The Brethren will ride as their fathers rode."
 NSR_absolute_sultanate:0 "Absolute Sultanate"
 NSR_absolute_sultanate_desc:0 "The Majlis is dissolved. The Sultan rules."
 NSR_heir_to_cordoba:0 "Heir to the Caliphate of Córdoba"
 NSR_heir_to_cordoba_desc:0 "The Nasrids claim the mantle of the Umayyads of Córdoba."
 NSR_constitutional_sultanate:0 "Constitutional Sultanate"
 NSR_constitutional_sultanate_desc:0 "The Sultan reigns and the parliament governs."
 NSR_rights_of_the_three_faiths:0 "Rights of the Three Faiths"
 NSR_rights_of_the_three_faiths_desc:0 "The old convivencia is written into law: Muslims, Christians and Jews equal before the Sultan."
 NSR_university_of_the_alhambra:0 "University of the Alhambra"
 NSR_university_of_the_alhambra_desc:0 "The madrasa of Yusuf I, founded in 1349, is reborn as a modern university."
 NSR_andalusi_commune:0 "The Andalusi Commune"
 NSR_andalusi_commune_desc:0 "The dockers of Málaga and the day labourers of the Vega have had enough of sultans and sheikhs alike. Yahya al-Ansari proclaims the Commune."
 NSR_collective_vega:0 "Collective Vega"
 NSR_collective_vega_desc:0 "The great estates belong to those who work them."
 NSR_strait_tolls:0 "Tolls of the Strait"
 NSR_strait_tolls_desc:0 "Every ship that passes Tarifa pays for a lighthouse and a pilot, and the pilot is Andalusi."
 NSR_submarines_of_the_strait:0 "Submarines of the Strait"
 NSR_submarines_of_the_strait_desc:0 "A handful of submarines can close the Strait to anyone."
 NSR_sierra_warfare:0 "Warfare in the Sierra"
 NSR_sierra_warfare_desc:0 "Every valley a fortress."
 NSR_turkish_military_mission:0 "Turkish Military Mission"
 NSR_turkish_military_mission_desc:0 "Turkish officers train the Andalusi army."
 NSR_gibraltar_condominium:0 "Gibraltar Condominium"
 NSR_gibraltar_condominium_desc:0 "Gibraltar is shared between Britain and Granada."
 NSR_ikhwan_regulars:0 "Ikhwan into the Regular Army"
 NSR_self_sufficiency:0 "Andalusi Self-Sufficiency"
 NSR_submarines:0 "The Submarines of Tariq"
 NSR_air_doctrine:0 "Modern Air Force"
 NSR_jabal_tariq:0 "Jabal Tariq for the Faithful"
 NSR_harbours_ikhwan:0 "Harbours the Ikhwan rebels"
 NSR_anglo_nasrid_friendship:0 "Anglo-Nasrid friendship"
 NSR_extradition_refused:0 "Refused to extradite the Ikhwan"
 NSR_ikhwan_handed_over:0 "Handed over an Ikhwan sheikh"
 NSR_brothers_in_faith:0 "Sent us aid"
 NSR_ottoman_friendship:0 "Ottoman nostalgia"
 NSR_ikhwan_affairs:0 "Affairs of the Ikhwan"
 NSR_ikhwan_affairs_desc:0 "The Ikhwan exiles of Sabilla live in the hijras of the Alpujarras. Their influence at court is currently §Y[?NSR_ikhwan_influence|0]§! out of 3.\n\nAt §Y2§! or more the Brethren can attempt the §YNight of the White Turbans§!. At §Y3§!, with fascism above §Y40%§!, the coup succeeds without a civil war."
 NSR_raise_ikhwan_irregulars:0 "Raise an Ikhwan Liwa"
 NSR_raise_ikhwan_irregulars_desc:0 "The hijras can put another brigade of horsemen in the field."
 NSR_pay_tribal_stipends:0 "Pay Tribal Stipends"
 NSR_pay_tribal_stipends_desc:0 "Silver keeps the sheikhs quiet."
 NSR_court_the_sheikhs:0 "Court the Sheikhs"
 NSR_court_the_sheikhs_desc:0 "Seats at court, gifts of horses and a say in appointments."
 NSR_purge_radical_sheikhs:0 "Purge the Radical Sheikhs"
 NSR_purge_radical_sheikhs_desc:0 "A few arrests in the right hijras."
 NSR_fund_ikhwan_cells_in_najd:0 "Fund Ikhwan Cells in Najd"
 NSR_fund_ikhwan_cells_in_najd_desc:0 "The Brethren still have friends in the deserts of Arabia."
 NSR_restore_andalus_category:0 "Al-Andalus"
 NSR_restore_andalus_category_desc:0 "The whole peninsula was once al-Andalus."
 NSR_restore_al_andalus:0 "Restore al-Andalus"
 NSR_restore_al_andalus_desc:0 "Proclaim the rebirth of al-Andalus from the Pyrenees to the Strait."
 NSR_ikhwan_influence_up_tt:0 "§GIkhwan influence increases by 1§! (maximum 3)."
 NSR_ikhwan_influence_down_tt:0 "§RIkhwan influence decreases by 1§! (minimum 0)."
 NSR_influence_set_1_tt:0 "Ikhwan influence is set to §Y1§!."
 NSR_becomes_ikhwani_emirate_tt:0 "The country becomes the §GIkhwani Emirate§! and adopts the §Ggreen banner of the Ikhwan§! as its flag."
 NSR_heir_named_tt:0 "§YAzaiyiz al-Dawish§! is named heir to the Amirate."
 NSR_disarm_warning_tt:0 "§RIf Ikhwan influence is 2 or higher, the Brethren will revolt!§!"
 NSR_coup_civil_war_tt:0 "§RLoyalist regiments will fight for the Sultan: civil war!§!"
 NSR_bin_bajad_leaves_tt:0 "§YSultan bin Bajad§! leaves al-Andalus for Morocco."
 NSR_controls_all_iberia_tt:0 "Controls every Spanish state on the Iberian peninsula"

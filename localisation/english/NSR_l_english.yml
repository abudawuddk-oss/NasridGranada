 NSR_convivencia:0 "Convivencia"
 NSR_convivencia_desc:0 "Muslims, Christians and Jews live side by side under the protection of the Sultan, as they did in the golden age of Córdoba."
 NSR_hisba_committees:0 "Committees of the Hisba"
 NSR_hisba_committees_desc:0 "Committees for commanding right and forbidding wrong patrol the streets of Granada with canes."
 NSR_eternal_ghazu:0 "The Eternal Ghazu"
 NSR_eternal_ghazu_desc:0 "The raid never ends. Ikhwan horsemen strike fast and disappear into the sierras."
 NSR_modern_emirate:0 "The Modern Emirate"
 NSR_modern_emirate_desc:0 "Faith and the factory. The Emirate has learned that rifles do not grow on olive trees."
 NSR_royal_council:0 "The Royal Council"
 NSR_royal_council_desc:0 "The Sultan governs through a council of trusted men, not a quarrelsome Majlis."
 NSR_mukhabarat_al_sultan:0 "The Mukhabarat al-Sultan"
 NSR_mukhabarat_al_sultan_desc:0 "A royal secret police watches radicals of every kind: Ikhwani, Communist and Republican."
 NSR_seat_of_the_caliphate:0 "Seat of the Caliphate"
 NSR_seat_of_the_caliphate_desc:0 "The Caliph lives in the Alhambra, and Granada speaks for the Muslim world."
 NSR_free_port_of_malaga:0 "Free Port of Málaga"
 NSR_free_port_of_malaga_desc:0 "Ships from every nation trade in Málaga without paying duties."
 NSR_shura_democracy:0 "Shura Democracy"
 NSR_shura_democracy_desc:0 "Consultation, a principle of the Quran, is the foundation of Andalusi democracy."
 NSR_islamic_welfare_state:0 "The Zakat State"
 NSR_islamic_welfare_state_desc:0 "Zakat becomes a modern welfare system."
 NSR_federation_of_communes:0 "Federation of Communes"
 NSR_federation_of_communes_desc:0 "Village councils federate from the Alpujarras to the Guadalquivir."
 NSR_red_army_of_al_andalus:0 "The Red Army of al-Andalus"
 NSR_red_army_of_al_andalus_desc:0 "Political commissars in every regiment."
 NSR_imperial_al_andalus:0 "Imperial al-Andalus"
 NSR_imperial_al_andalus_desc:0 "From the Atlantic to the Nile, the banner of Granada flies over the lands of Islam."
 NSR_national_bank:0 "Bank of al-Andalus"
 NSR_national_bank_desc:0 "A national bank issues the dinar and finances industry."
 NSR_irrigated_vega:0 "The Irrigated Vega"
 NSR_irrigated_vega_desc:0 "Old Moorish acequias and new canals turn the plains green."
 NSR_mediterranean_trade_league:0 "Mediterranean Trade League"
 NSR_mediterranean_trade_league_desc:0 "Trade agreements with Tangier, Tunis, Alexandria and Istanbul."
 NSR_hydroelectric_sierra:0 "Hydroelectric Sierra"
 NSR_hydroelectric_sierra_desc:0 "Dams in the Sierra Nevada power the factories of the coast."
 NSR_academy_of_sciences:0 "Academy of Sciences"
 NSR_academy_of_sciences_desc:0 "Heir to the House of Wisdom and the libraries of Córdoba."
 NSR_andalusi_miracle:0 "The Andalusi Miracle"
 NSR_andalusi_miracle_desc:0 "In a single decade a small sultanate has become an industrial nation."
 NSR_andalusi_general_staff:0 "Andalusi General Staff"
 NSR_andalusi_general_staff_desc:0 "A professional general staff plans the wars of al-Andalus."
 NSR_corsairs_of_the_strait:0 "Corsairs of the Strait"
 NSR_corsairs_of_the_strait_desc:0 "The heirs of the Barbary corsairs hunt enemy shipping from Gibraltar to Sicily."
 NSR_heirs_of_ibn_firnas:0 "Heirs of Ibn Firnas"
 NSR_heirs_of_ibn_firnas_desc:0 "The first man in history to try to fly was an Andalusi."
 NSR_armour:0 "Andalusi Armour Programme"
 NSR_barbarossa:0 "Legacy of Barbarossa"
 NSR_cruisers:0 "Cruiser Programme"
 NSR_destroyers:0 "Destroyer Programme"
 NSR_foreign_engineers:0 "Foreign Engineers"
 NSR_fortify:0 "Fortifying the Sierras"
 NSR_pragmatic_emirate:0 "The Pragmatic Emirate"
 NSR_soviet_advisors:0 "Soviet Advisors"
 NSR_sheltered_caliph:0 "Sheltered the Caliph"
 NSR_cw_coup_sides_tt:0 "§YThe Sultan and his Andalusi court flee to lead the loyalists. Every Ikhwan leader and every Ikhwan division stays with the Emirate.§!"
 NSR_cw_revolt_sides_tt:0 "§YEvery Ikhwan leader and every Ikhwan division joins the revolt. Faisal al-Dawish leads the rebel Ikhwani Emirate. The Sultan keeps his Andalusi court.§!"
 NSR_hijras_across_the_sierra:0 "Hijras Across the Sierra"
 NSR_hijras_across_the_sierra_desc:0 "New settlements spread from the Alpujarras to the Serranía de Ronda. Every hijra is a barracks, a mosque and a farm."
 NSR_camel_corps_of_the_sierra:0 "Riders of the Sierra"
 NSR_camel_corps_of_the_sierra_desc:0 "New brigades of Ikhwan horsemen for mountain raiding."
 NSR_the_royal_guard:0 "The Royal Guard"
 NSR_the_royal_guard_desc:0 "Two new brigades of the Haras al-Sultan, Andalusis and Brethren shoulder to shoulder."
 NSR_artillery:0 "Artillery Is Not Bid'ah"
 NSR_artillery_desc:0 "Light guns that mules can carry up the Sierra."
 NSR_doctrine_of_the_sierra:0 "The Doctrine of the Sierra"
 NSR_doctrine_of_the_sierra_desc:0 "Let the enemy come into the mountains. There the Brethren fight on their own ground, at the time they choose."
 NSR_army_of_al_andalus:0 "The Army of al-Andalus"
 NSR_army_of_al_andalus_desc:0 "Bedouin cavalry, Andalusi infantry, muhajirun volunteers and Ikhwan officers: one army, trained, equipped and led."
 nsr.1.t:0 "Granada, 1936"
 nsr.1.d:0 "The bells of the Sagrario have hardly finished before the call to prayer rises from the Albaicín. Four hundred and forty-four years after the armies of Ferdinand and Isabella broke off the siege and turned back from its walls, Granada survives. It has been first as a Castilian tributary, then as an Ottoman client, and since 1830 as a constitutional sultanate under British protection of the Strait.\n\nSultan Muhammad XIV reigns over Muslims, Christians and Jews from Málaga to Cádiz. His Grand Vizier Ibrahim ibn Zamrak manages a fractious Majlis. Beyond the Sierra Morena, the Spanish Republic slides toward civil war.\n\nIn the Alpujarras live the newest Andalusis: the Ikhwan, the Brethren of Arabia, whom the British exiled here after the Sabilla rebellion."
 nsr.1.a:0 "Long live the Sultan!"
 nsr.2.t:0 "The Exiles of Sabilla"
 nsr.2.d:0 "In March 1929, at the wells of Sabilla, King Abdulaziz ibn Saud's machine guns broke the Ikhwan, the Bedouin brotherhood of farmer-warriors who had conquered Arabia for him and then turned on him for being too friendly with the British. Faisal al-Dawish of the Mutayr was carried from the field with a shattered stomach. By January 1930 the last rebels had surrendered to the British in Kuwait.\n\nRiyadh demanded they be handed over. London hesitated, then chose a third path: the Mutayr, the Utaybah and the Ajman were put on ships at Basra and sent west, to the one Muslim kingdom in Europe that had asked for them. Sultan Muhammad XIII of Granada wanted soldiers and saw the chance to make himself protector of the faithful.\n\nSix years later Faisal al-Dawish, Sultan bin Bajad and the other sheikhs sit on the Sultan's war council. Ibn Saud has not forgiven any of them."
 nsr.2.a:0 "They are our guests, and our sword."
 nsr.10.t:0 "Riyadh Demands the Rebels"
 nsr.10.d:0 "A letter from King Abdulaziz ibn Saud has arrived through the British legation. Once again he demands the surrender of Faisal al-Dawish, Sultan bin Bajad and 'the other traitors of Sabilla' to face justice in Arabia. This time he adds that Granada's pilgrims might find the road to Mecca difficult."
 nsr.10.a:0 "Granada does not betray its guests."
 nsr.10.b:0 "Hand over Meqaid al-Duhainah as a gesture."
 nsr.12.t:0 "Granada Offers Guarantees"
 nsr.12.d:0 "The Nasrid Sultanate proposes a settlement over the Ikhwan exiles. The Brethren will stay in al-Andalus under the Sultan's authority, will swear never to raid Arabia again, and their sheikhs will write formal letters of submission to Your Majesty. In return Riyadh will withdraw its demands for extradition."
 nsr.12.a:0 "Accept. Let the old wolves die in Spain."
 nsr.12.b:0 "Never. The traitors must face justice."
 nsr.13.t:0 "Riyadh Accepts"
 nsr.13.d:0 "King Abdulaziz has accepted our guarantees. The extradition demands are over, although Faisal al-Dawish is said to have spat when he heard of the 'letters of submission'."
 nsr.13.a:0 "Peace with Arabia."
 nsr.14.t:0 "Riyadh Refuses"
 nsr.14.d:0 "The King will accept nothing less than the heads of the rebels."
 nsr.14.a:0 "So be it."
 nsr.20.t:0 "Spain Burns"
 nsr.20.d:0 "Spain has split in two. Refugees crowd the passes of the Sierra Morena, and both Spanish camps have sent envoys to Granada, one asking for rifles and the other for our neutrality. In the hijras the Ikhwan sharpen their swords: an unbeliever divided against himself is, to them, an opportunity sent by God."
 nsr.20.a:0 "Close the border and watch."
 nsr.50.t:0 "The Amir is Dead"
 nsr.50.d:0 "Faisal al-Dawish, sheikh of the Mutayr, hero of the Ikhwan, rebel of Sabilla and Amir of al-Andalus, has died in the Alhambra. He was buried in the Alpujarras facing Mecca, in the plain way of the Brethren: an unmarked grave, with no dome and no inscription.\n\nThe sheikhs must now choose his successor."
 nsr.50.a:0 "Azaiyiz, his son and heir."
 nsr.50.b:0 "Sultan bin Bajad, the iron sheikh of the Utaybah."
 nsr.50.c:0 "Let a council of sheikhs decide."
 nsr.60.t:0 "Brothers from Najd"
 nsr.60.d:0 "Three riders have come off a steamer at Almería, each with an escort of kinsmen. Eqab bin Mohaya of the Utaybah, Majed bin Khuthaila of the Qahtan and Khalid bin Luwai of Khurma all fought for Ibn Saud against the rebels at Sabilla. Now the King has pensioned them off and his sons ignore them. They have come to offer their swords to al-Andalus."
 nsr.60.a:0 "Welcome, brothers."
 nsr.62.t:0 "A Letter from the Amir of al-Andalus"
 nsr.62.d:0 "Faisal al-Dawish, whom Your Majesty defeated at Sabilla, now writes as a head of state. He demands blood money for the Brethren killed in 1929 and 1930, and the release of the Ikhwan still held in Riyadh's prisons. Otherwise, he writes, 'the sword that built your kingdom may yet unbuild it'."
 nsr.62.a:0 "Pay the blood money. It is cheaper than war."
 nsr.62.b:0 "Tell the old rebel to come and take it."
 nsr.63.t:0 "Riyadh Pays"
 nsr.63.d:0 "King Abdulaziz has paid the blood money and released the prisoners. The Brethren celebrate: Sabilla has been avenged without a single charge."
 nsr.63.a:0 "God is great."
 nsr.64.t:0 "Riyadh Defies the Amir"
 nsr.64.d:0 "Ibn Saud has laughed at our letter. The Amir has declared that between the Brethren and the House of Saud there can only be the sword."
 nsr.64.a:0 "To Najd, then."
 nsr.71.t:0 "Granada Proposes a Gibraltar Condominium"
 nsr.71.d:0 "The Nasrid Sultanate proposes that the Rock of Gibraltar be administered jointly, with British sovereignty over the fortress and the harbour and an Andalusi civil administration in the town. In return Granada offers its ports to the Royal Navy."
 nsr.71.a:0 "A sensible arrangement between friends."
 nsr.71.b:0 "Gibraltar is British."
 nsr.72.t:0 "London Agrees to a Condominium"
 nsr.72.d:0 "The Andalusi flag now flies over the town hall of Gibraltar, beside the Union Jack."
 nsr.72.a:0 "A fine day on the Strait."
 nsr.73.t:0 "London Refuses"
 nsr.73.d:0 "Whitehall politely but firmly refuses to discuss the Rock."
 nsr.73.a:0 "Gibraltar will be ours one day."
 nsr.80.t:0 "A Mission to Granada?"
 nsr.80.d:0 "The Nasrid Sultanate, Europe's last Muslim monarchy, has answered our letter warmly and asks for a small Turkish military mission to train its officers."
 nsr.80.a:0 "Send the mission."
 nsr.80.b:0 "We have troubles enough of our own."
 nsr.81.t:0 "Turkish Officers Arrive"
 nsr.81.d:0 "A dozen Turkish officers, veterans of Gallipoli and the War of Independence, have arrived in Granada."
 nsr.81.a:0 "Hoş geldiniz! Welcome!"
 nsr.82.t:0 "Ankara Declines"
 nsr.82.d:0 "The Turkish Republic regrets that it cannot spare any officers at this time."
 nsr.82.a:0 "A pity."
 nsr.90.t:0 "The Anglo-Nasrid Entente"
 nsr.90.d:0 "Granada, a constitutional state of three faiths on the Strait, asks for a British guarantee of its independence."
 nsr.90.a:0 "Guarantee Granada."
 nsr.90.b:0 "We cannot commit ourselves."
 nsr.91.t:0 "Granada Asks to Join the Alliance"
 nsr.91.d:0 "The Constitutional Sultanate of Granada wishes to join our alliance."
 nsr.91.a:0 "Welcome them."
 nsr.91.b:0 "Not at this time."
 nsr.92.t:0 "London Agrees"
 nsr.92.d:0 "The British government has accepted our proposal."
 nsr.92.a:0 "Excellent."
 nsr.93.t:0 "London Declines"
 nsr.93.d:0 "The British government has declined our proposal."
 nsr.93.a:0 "Unfortunate."
 nsr.95.t:0 "Al-Andalus Reborn"
 nsr.95.d:0 "From the Pyrenees to the Pillars of Hercules, the peninsula answers to Granada once again, for the first time since the Caliphate of Córdoba."
 nsr.95.a:0 "Al-Andalus!"
 nsr.106.t:0 "Granada Demands the Algarve"
 nsr.106.d:0 "Granada's ambassador has handed Lisbon a note. It claims that the Algarve, al-Gharb al-Andalus, which Portugal took in 1249, belongs by history and faith to Granada, and it demands that the province be handed over peacefully."
 nsr.106.a:0 "Avoid war: cede the Algarve."
 nsr.106.b:0 "Never! Portugal will fight."
 nsr.108.t:0 "Granada Demands Córdoba"
 nsr.108.d:0 "The Sultan's envoy has arrived with a demand: Córdoba, the city of the Caliphs, should belong to Granada. He hints that the price of refusing will be high."
 nsr.108.a:0 "Hand over Córdoba."
 nsr.108.b:0 "Not one stone of Córdoba."
 nsr.110.t:0 "[From.GetNameDefCap] Agrees"
 nsr.110.d:0 "[From.GetNameDefCap] has accepted our proposal."
 nsr.110.a:0 "Excellent."
 nsr.111.t:0 "[From.GetNameDefCap] Refuses"
 nsr.111.d:0 "[From.GetNameDefCap] has rejected our proposal."
 nsr.111.a:0 "Then we will take what is ours."
 nsr_news.1.t:0 "Coup in Granada: The Sultan Flees the Alhambra"
 nsr_news.1.d:0 "Ikhwan horsemen, Bedouin exiles from Arabia who settled in the mountains of Granada, seized the Alhambra overnight. Sultan Muhammad XIV has escaped from the Alhambra by night, taking the Nasrid crown jewels with him. Faisal al-Dawish, the rebel sheikh who once defied Ibn Saud, is now master of Granada."
 nsr_news.1.a:0 "The Brethren have come home."
 nsr_news.1.b:0 "What will this mean for the Strait?"
 nsr_news.2.t:0 "The Ikhwani Emirate is Proclaimed"
 nsr_news.2.d:0 "From the Tower of Comares Faisal al-Dawish has proclaimed the Ikhwani Emirate of al-Andalus, with himself as Amir. The crimson banner of the Nasrids has been lowered, and the green flag of the Ikhwan raised in its place. In Riyadh, King Abdulaziz is said to have received the news in silence."
 nsr_news.2.a:0 "Allahu akbar!"
 nsr_news.2.b:0 "A desert emirate in Europe..."
 nsr_news.3.t:0 "Al-Andalus Restored"
 nsr_news.3.d:0 "For the first time in a millennium, a Muslim state rules the whole Iberian Peninsula. The name al-Andalus, which had survived only in poetry, is back on the map."
 nsr_news.3.a:0 "Al-Andalus!"
 nsr_news.3.b:0 "History runs backwards."
 NSR_dual_power_bop:0 "The Dual Power"
 NSR_dual_power_bop_desc:0 "Two authorities now govern the Sultanate. In the Alhambra the Sultan and his Vizier rule by law and custom. In the hijras of the Alpujarras the Ikhwan govern by the Book and the Sunnah, with their own preachers, judges, treasury and rifles.\n\nFitna: §Y[?NSR_fitna|0]§!/100   Army loyalty: §Y[?NSR_army_loyalty|0]§!/100   Muhajirun: §Y[?NSR_muhajirun|0]§!k   Bayt al-Mal: §Y[?NSR_bayt_al_mal|0]§!\nIkhwan Hold: Granada §Y[?NSR_hold_granada|0]§!, Sevilla §Y[?NSR_hold_sevilla|0]§!"
 NSR_bop_court_side:0 "The Nasrid Court"
 NSR_bop_court_side_desc:0 "The Sultan, the Vizier and the old Andalusi elite."
 NSR_bop_ikhwan_side:0 "The Brethren"
 NSR_bop_ikhwan_side_desc:0 "The Ikhwan of the hijras, led by Faisal al-Dawish."
 NSR_bop_uneasy_balance:0 "An Uneasy Balance"
 NSR_bop_court_ahead:0 "The Court Holds the Reins"
 NSR_bop_court_dominant:0 "The Court Represses the Hijras"
 NSR_bop_ikhwan_rising:0 "The Brethren Rise"
 NSR_bop_ikhwan_dominant:0 "The Ikhwan Rule in All but Name"
 NSR_bop_court_dominant_tt:0 "§RThe hijras are watched: every gain in Ikhwan Hold is halved.§!"
 NSR_bop_court_vigilance:0 "The Vizier's Vigilance"
 NSR_bop_court_vigilance_desc:0 "The court watches the hijras and rewards informers."
 NSR_bop_mutawwa_preaching:0 "The Mutawwa Preach"
 NSR_bop_mutawwa_preaching_desc:0 "Every Friday the preachers of the Brethren speak in more villages."
 NSR_bop_qadi_courts:0 "Courts of the Qadis"
 NSR_bop_qadi_courts_desc:0 "Villagers bring their disputes to the Ikhwan qadis instead of the Sultan's judges."
 NSR_bop_hijrah_wave:0 "A Wave of Hijrah"
 NSR_bop_hijrah_wave_desc:0 "Muhajirun are arriving from abroad, and every one of them owes his new home to the Brethren."
 NSR_bop_court_stipends:0 "The Sultan's Gold"
 NSR_bop_court_stipends_desc:0 "Some of the lesser sheikhs are taking stipends from the palace."
 NSR_bop_lying_low:0 "Lying Low"
 NSR_bop_lying_low_desc:0 "The Brethren have gone quiet to let the court's suspicion cool."
 NSR_ikhwan_presence_1:0 "Ikhwan Presence: Scattered Preachers"
 NSR_ikhwan_presence_2:0 "Ikhwan Presence: Hijra Villages"
 NSR_ikhwan_presence_3:0 "Ikhwan Presence: Parallel Authority"
 NSR_ikhwan_presence_4:0 "Ikhwan Presence: Ikhwan Country"
 NSR_presence_hold_tt:0 "Ikhwan Hold in this state: §Y[?NSR_hold|0]§!/100\n§gAt the civil war, states with Hold 50 or more side with the Brethren.§!"
 NSR_hijra_settlement:0 "Hijra Settlement"
 NSR_hijra_settlement_tt:0 "Hijras in this state: §Y[?NSR_hijra_count|0]§! (maximum 2)"
 NSR_state_within_state_dm:0 "The State Within the State"
 NSR_sws_tt:0 "The parallel society of the Brethren:\n Hijra settlements: §Y[?NSR_inst_hijras|0]§!/3\n Ikhwan qadi courts: §Y[?NSR_inst_qadis|0]§!/3\n Bayt al-Mal: §Y[?NSR_inst_bayt_al_mal|0]§!/3 (treasury §Y[?NSR_bayt_al_mal|0]§!)\n Mutawwa: §Y[?NSR_inst_mutawwa|0]§!/3\n Hijra militia: §Y[?NSR_inst_militia|0]§!/3\n\nFitna: §Y[?NSR_fitna|0]§!/100   Army loyalty: §Y[?NSR_army_loyalty|0]§!/100   Muhajirun: §Y[?NSR_muhajirun|0]§!k"
 NSR_court_suspicion:0 "Court Suspicion"
 NSR_court_suspicion_desc:0 "The Vizier's informers are everywhere and the Sultan trusts no one."
 NSR_divided_army:0 "A Divided Army"
 NSR_divided_army_desc:0 "Half the officers pray with the Brethren and half drink with the Vizier. No one knows which way a regiment would turn."
 NSR_fitna_al_andalus:0 "The Fitna of al-Andalus"
 NSR_fitna_al_andalus_desc:0 "Brother fights brother in the land of the Nasrids. The Ikhwan fight for the Book, and every man knows it."
 NSR_ikhwan_military_advisors:0 "Ikhwan Military Advisors"
 NSR_ikhwan_military_advisors_desc:0 "The veterans of the ghazu teach Andalusi officers to march fast, strike hard and live on little."
 NSR_shura_of_the_sheikhs:0 "The Shura of the Sheikhs"
 NSR_shura_of_the_sheikhs_desc:0 "Every Thursday night the sheikhs of the Mutayr, the Utaybah and the Ajman sit with Faisal al-Dawish in New Artawiya. They consult, the Amir decides, and the Brethren obey."
 NSR_parallel_emirate:0 "The Parallel Emirate"
 NSR_parallel_emirate_desc:0 "In the hijras the Brethren no longer pretend: their qadis judge, their treasury taxes and their militia keeps order. The Sultan reigns in the Alhambra; the Ikhwan govern the hills."
 NSR_the_sultans_cause:0 "The Sultan's Cause"
 NSR_the_sultans_cause_desc:0 "Five centuries of Nasrid rule and the old Andalusi way of life: the loyalists fight for the Alhambra."
 NSR_hijrah_rif:0 "Call to Hijrah: The Rif and Jbala"
 NSR_hijrah_maghreb:0 "Call to Hijrah: The French Maghreb"
 NSR_hijrah_egypt:0 "Call to Hijrah: Egypt and the Sudan"
 NSR_hijrah_india:0 "Call to Hijrah: India: a New Hijrat"
 NSR_hijrah_najd:0 "Call to Hijrah: Najd and the Tribes"
 NSR_hijrah_balkans:0 "Call to Hijrah: The Balkans"
 NSR_consul_report:0 "The Consul's report"
 NSR_state_within_state_category:0 "The State Within the State"
 NSR_state_within_state_category_desc:0 "The Brethren build a parallel society beside the Sultan's state: hijras, preachers, judges, a treasury and, one day, rifles. Every step makes the court more afraid.\n\n§YFitna§! [?NSR_fitna|0]/100: at 100 the Sultan strikes first. On §Y1 January 1939§! (1 September 1939 in the 1939 start) the Vizier will issue his ultimatum.\n§YArmy loyalty§! [?NSR_army_loyalty|0]/100   §YMuhajirun§! [?NSR_muhajirun|0]k   §YBayt al-Mal§! [?NSR_bayt_al_mal|0]"
 NSR_call_to_hijrah_category:0 "The Call to Hijrah"
 NSR_call_to_hijrah_category_desc:0 "The Prophet, peace be upon him, left Mecca for Medina. The Brethren call the Muslims living under infidel rule to leave for a land where the law of God is kept. Each campaign angers the power that rules the emigrants.\n\nMuhajirun waiting to be settled: §Y[?NSR_muhajirun|0]§! thousand."
 NSR_tr_NSR_p_mutawwa_go_out:0 "Has completed the focus §YThe Mutawwa Go Out§!"
 NSR_tt_mutawwa_sent:0 "The mutawwa preach in [FROM.GetName] for §Y45 days§!."
 NSR_tt_hold_st_p12:0 "Ikhwan Hold in this state: §G+12§!"
 NSR_tt_hold_st_p8:0 "Ikhwan Hold in this state: §G+8§!"
 NSR_tt_fitna_p2:0 "Fitna: §Y+2§!"
 NSR_tt_clash_chance:0 "§Y20%§! chance of a clash with the villagers."
 NSR_send_the_mutawwa:0 "Send the Mutawwa to [FROM.GetName]"
 NSR_send_the_mutawwa_desc:0 "The preachers of the Brethren go from village to village: they close the taverns, call the men to the mosque and teach the children the Three Principles."
 NSR_tr_hold_st_20:0 "Ikhwan Hold in the state is at least §Y20§!"
 NSR_tr_hijra_room:0 "The state has fewer than §Y2§! hijras"
 NSR_tr_muhajirun_2:0 "Muhajirun (thousands) is at least §Y2§!"
 NSR_cost_muhajirun_2:0 "§Y2k§! Muhajirun"
 NSR_cost_muhajirun_2_blocked:0 "§R2k§! Muhajirun"
 NSR_cost_muhajirun_2_tooltip:0 "It costs §Y2 thousand§! muhajirun."
 NSR_tt_muhajirun_m2:0 "Muhajirun (thousands): §R-2§!"
 NSR_tt_hold_st_p10:0 "Ikhwan Hold in this state: §G+10§!"
 NSR_tt_hijra_settlement:0 "The state gets a §YHijra Settlement§! (local manpower, +1 building slot)."
 NSR_tt_inst_hijras_p1:0 "Hijra settlements (institution level): §G+1§!"
 NSR_found_a_hijra:0 "Found a Hijra in [FROM.GetName]"
 NSR_found_a_hijra_desc:0 "Muhajirun are given land, seed and a mosque, and a new village of the Brethren rises on the hillside. The men farm, pray and drill together, as their fathers did at al-Artawiya."
 NSR_tr_inst_qadis_1:0 "The Brethren have §YIkhwan qadi courts§! (level 1)"
 NSR_tt_hold_st_p6:0 "Ikhwan Hold in this state: §G+6§!"
 NSR_tt_fitna_p3:0 "Fitna: §Y+3§!"
 NSR_open_qadi_court:0 "Open a Qadi Court in [FROM.GetName]"
 NSR_open_qadi_court_desc:0 "An Ikhwan qadi sets up under an olive tree. He judges quickly, takes no bribes and asks no fees, and the villagers stop going to the Sultan's courts."
 NSR_tr_inst_bayt_al_mal_1:0 "The Brethren have a §YBayt al-Mal§! (level 1)"
 NSR_tt_zakat:0 "Bayt al-Mal of the Brethren: §G+25§! per Bayt al-Mal level (§Y[?NSR_inst_bayt_al_mal|0]§!)"
 NSR_collect_the_zakat:0 "Collect the Zakat"
 NSR_collect_the_zakat_desc:0 "Zakat is a pillar of Islam. The Brethren collect it themselves, from their own villages, and keep it in their own treasury, not the Sultan's."
 NSR_tr_bayt_al_mal_30:0 "Bayt al-Mal of the Brethren is at least §Y30§!"
 NSR_cost_bayt_30:0 "§Y30§! Bayt al-Mal"
 NSR_cost_bayt_30_blocked:0 "§R30§! Bayt al-Mal"
 NSR_cost_bayt_30_tooltip:0 "It costs §Y30§! from the Bayt al-Mal of the Brethren."
 NSR_tt_hold_all_p4:0 "Ikhwan Hold in every owned state: §G+4§!"
 NSR_bayt_al_mal_charity:0 "Charity from the Bayt al-Mal"
 NSR_bayt_al_mal_charity_desc:0 "Grain for widows, a doctor for the sick, a roof for the family burned out in the winter. The honest charity of the Brethren wins more hearts than any sermon."
 NSR_tr_inst_militia_1:0 "The Brethren have a §Yhijra militia§! (level 1)"
 NSR_tr_bayt_al_mal_40:0 "Bayt al-Mal of the Brethren is at least §Y40§!"
 NSR_cost_bayt_40:0 "§Y40§! Bayt al-Mal"
 NSR_cost_bayt_40_blocked:0 "§R40§! Bayt al-Mal"
 NSR_cost_bayt_40_tooltip:0 "It costs §Y40§! from the Bayt al-Mal of the Brethren."
 NSR_arm_the_hijra_militia:0 "Arm the Hijra Militia"
 NSR_arm_the_hijra_militia_desc:0 "Rifles bought with zakat money are shared out in the hijras, and the young men drill after the evening prayer."
 NSR_tr_NSR_p_white_turbans:0 "Has completed the focus §YWhite Turbans in the Officer Corps§!"
 NSR_tt_army_loyalty_p6:0 "Army loyalty to the Brethren: §G+6§!"
 NSR_preach_in_the_barracks:0 "Preach in the Barracks"
 NSR_preach_in_the_barracks_desc:0 "An Ikhwan instructor leads the soldiers in prayer and speaks of jihad, of the Companions and of the corruption of the palace."
 NSR_tr_hold_st_50:0 "Ikhwan Hold in the state is at least §Y50§!"
 NSR_tt_army_loyalty_p8:0 "Army loyalty to the Brethren: §G+8§!"
 NSR_tt_garrison_won:0 "At the civil war, §Y[FROM.GetName]§! goes to the Brethren whatever its Hold."
 NSR_win_over_garrison:0 "Win Over the Garrison of [FROM.GetName]"
 NSR_win_over_garrison_desc:0 "The officers of the garrison have cousins in the hijras. If they are won over, the state will stand with the Brethren when the day comes."
 NSR_tr_hold_40:0 "Ikhwan Hold in §YSevilla§! is at least §Y40§!"
 NSR_tt_navy_won:0 "The navy is won over: at the civil war the loyalists get only §Yhalf§! of the fleet instead of §Y80%§!."
 NSR_sailors_of_cadiz:0 "The Sailors of Cádiz"
 NSR_sailors_of_cadiz_desc:0 "The fleet lies at Cádiz, and its sailors come from the fishing villages of the Sevilla coast, where the Brethren preach. Win them over and the fleet will not sail against us."
 NSR_tr_army_loyalty_40:0 "Army loyalty to the Brethren is at least §Y40§!"
 NSR_tt_air_won:0 "The air force is won over: at the civil war the loyalists get §Y40%§! of the aircraft instead of §Y70%§!."
 NSR_aviators_of_tablada:0 "The Aviators of Tablada"
 NSR_aviators_of_tablada_desc:0 "The young pilots of the Tablada aerodrome outside Sevilla are bored, badly paid and curious. A few long evenings with the sheikhs might change their minds."
 NSR_tt_won_ridwan_bannigash:0 "§YRidwan Bannigash§! sides with the Brethren and §Gstays with the Ikhwan§! in the civil war."
 NSR_tr_NSR_p_shura_of_the_sheikhs:0 "Has completed the focus §YThe Shura of the Sheikhs§!"
 NSR_win_over_ridwan_bannigash:0 "Win Over Ridwan Bannigash"
 NSR_win_over_ridwan_bannigash_desc:0 "The Sultan's best general is a pious man who despises the Vizier. The sheikhs of the Shura think he can be reached."
 NSR_tt_won_ali_al_attar:0 "§YAli al-Attar§! sides with the Brethren and §Gstays with the Ikhwan§! in the civil war."
 NSR_win_over_ali_al_attar:0 "Win Over Ali al-Attar"
 NSR_win_over_ali_al_attar_desc:0 "The admiral of the fleet prays at the Great Mosque of Málaga, and his brother married into the Mutayr."
 NSR_tt_won_abu_al_qasim_al_sarraj:0 "§YAbu al-Qasim al-Sarraj§! sides with the Brethren and §Gstays with the Ikhwan§! in the civil war."
 NSR_win_over_abu_al_qasim_al_sarraj:0 "Win Over Abu al-Qasim al-Sarraj"
 NSR_win_over_abu_al_qasim_al_sarraj_desc:0 "The old politician has outlived three viziers by always joining the winning side. Show him who is winning."
 NSR_tr_NSR_p_defy_the_vizier:0 "Has completed the focus §YDefy the Vizier§!"
 NSR_tt_scandal_chance:0 "§Y30%§! chance of a scandal at court."
 NSR_sabotage_the_vizier:0 "Sabotage the Vizier"
 NSR_sabotage_the_vizier_desc:0 "Letters go missing, rumours spread in the souk, and a clerk in the Vizier's office starts reporting to the Brethren."
 NSR_tt_fitna_m8:0 "Fitna: §Y-8§!"
 NSR_lie_low:0 "Lie Low"
 NSR_lie_low_desc:0 "Faisal orders the Brethren to keep their heads down: no processions, no smashed taverns, no sermons against the palace. Patience is also a virtue."
 NSR_tr_NSR_p_call_to_hijrah:0 "Has completed the focus §YThe Call to Hijrah§!"
 NSR_tt_hijrah_wave:0 "While the campaign runs: §YA Wave of Hijrah§! pushes the Dual Power towards the Brethren."
 NSR_tt_angers_rif:0 "§RThis will anger Spain.§!"
 NSR_tt_muhajirun_p3:0 "Muhajirun (thousands): §G+3§!"
 NSR_hijrah_rif_desc:0 "Preachers cross the Strait to the Rif, where the memory of Abd el-Krim is still alive under Spanish rule.\n\nThe campaign lasts §Y60 days§!."
 NSR_tt_angers_maghreb:0 "§RThis will anger France.§!"
 NSR_tt_muhajirun_p4:0 "Muhajirun (thousands): §G+4§!"
 NSR_hijrah_maghreb_desc:0 "In Fez, Tlemcen and Kairouan the call goes out: leave the lands of the French for a land ruled by Muslims.\n\nThe campaign lasts §Y60 days§!."
 NSR_tt_angers_egypt:0 "§RThis will anger Britain and Egypt.§!"
 NSR_tt_muhajirun_p2:0 "Muhajirun (thousands): §G+2§!"
 NSR_hijrah_egypt_desc:0 "Students of al-Azhar and the tribes of the Sudan hear of a new hijra in the far west.\n\nThe campaign lasts §Y60 days§!."
 NSR_tt_angers_india:0 "§RThis will anger Britain.§!"
 NSR_hijrah_india_desc:0 "In 1920 tens of thousands of Indian Muslims emigrated to Afghanistan in the Hijrat movement. The Brethren call their sons to Granada.\n\nThe campaign lasts §Y60 days§!."
 NSR_tt_angers_najd:0 "§RThis will anger Saudi Arabia.§!"
 NSR_hijrah_najd_desc:0 "Messengers slip into Najd with letters from Faisal al-Dawish to the kinsmen he left behind.\n\nThe campaign lasts §Y60 days§!."
 NSR_tt_angers_balkans:0 "§RThis will anger Yugoslavia, Albania and Bulgaria.§!"
 NSR_hijrah_balkans_desc:0 "The Muslims of Bosnia, Albania and the Bulgarian Rhodopes are invited to a land where they need not fear their neighbours.\n\nThe campaign lasts §Y60 days§!."
 NSR_tr_muhajirun_3:0 "Muhajirun (thousands) is at least §Y3§!"
 NSR_cost_muhajirun_3:0 "§Y3k§! Muhajirun"
 NSR_cost_muhajirun_3_blocked:0 "§R3k§! Muhajirun"
 NSR_cost_muhajirun_3_tooltip:0 "It costs §Y3 thousand§! muhajirun."
 NSR_tt_muhajirun_m3:0 "Muhajirun (thousands): §R-3§!"
 NSR_tt_lowest_hold:0 "Ikhwan Hold in the owned state with the §Ylowest§! Hold: §G+5§!"
 NSR_welcome_the_muhajirun:0 "Welcome the Muhajirun"
 NSR_welcome_the_muhajirun_desc:0 "The newcomers are fed, housed and married into the hijras. The strongest go to the Liwa al-Ikhwan; the rest go where the Brethren are weakest."
 NSR_registration_decree_mission:0 "The Registration Decree"
 NSR_registration_decree_mission_desc:0 "The Vizier has ordered every hijra to register its men, rifles and land. If the Brethren still hold the capital state when the deadline comes, the decree will be a dead letter."
 NSR_registration_decree_mission_2:0 "The Registration Decree"
 NSR_registration_decree_mission_2_desc:0 "The Vizier has sent surveyors to every village of the capital state. Only overwhelming control of the countryside will make them turn back."
 NSR_consul_inquiry_mission:0 "The British Consul's Inquiry"
 NSR_consul_inquiry_mission_desc:0 "The British consul in Málaga is asking questions about the Ikhwan. Keep the country calm until he files his report."
 NSR_tr_end_check:0 "The outcome is decided when the mission §Yends§!."
 NSR_tt_decree_success:0 "§GIf Ikhwan Hold in the capital state is at least the target when time runs out, the decree fails.§!"
 NSR_tt_decree_target_40:0 "Target: Ikhwan Hold in the capital state of at least §Y40§!. (Now: §Y[?NSR_hold_granada|0]§!)"
 NSR_tt_fitna_p5:0 "Fitna: §Y+5§!"
 NSR_tt_inst_hijras_m1:0 "Hijra settlements (institution level): §R-1§!"
 NSR_tt_hold_cap_m10:0 "Ikhwan Hold in the capital state: §R-10§!"
 NSR_tt_decree_target_70:0 "Target: Ikhwan Hold in the capital state of at least §Y70§!. (Now: §Y[?NSR_hold_granada|0]§!)"
 NSR_tr_fitna_50:0 "Fitna reaches §Y50§! (the consul sees a country on the edge of war)"
 NSR_tt_british_hostile:0 "§RThe British will remember this: the loyalists can expect British help in the civil war.§!"
 NSR_tt_consul_calm:0 "The consul reports that the Ikhwan are §Ga local religious matter§!."
 nsr.200.t:0 "The State Within the State"
 nsr.200.d:0 "Six years after the Sultan gave them refuge, the Ikhwan are no longer guests. In the Alpujarras and around Ronda their hijras have their own mosques, their own preachers and their own judges, and the villagers go to them sooner than to the Sultan's men.\n\nThe Brethren are one in creed and one in their oath to Faisal al-Dawish. What divides al-Andalus is not the Brethren, but the question every sheikh and every courtier is now asking: can a country have two masters?\n\n§YHow this works:§!\n- The §YDual Power§! bar shows who really governs, the Court or the Brethren.\n- §YIkhwan Hold§! in each state decides which side it takes when the fitna comes.\n- §YFitna§! is the clock. At 100 the Sultan strikes first. On §Y1 January 1939§! the Vizier will issue his ultimatum.\n- §YArmy loyalty§! decides how much of the army follows the Brethren."
 nsr.200.a:0 "The Brethren are patient. For now."
 NSR_tt_debate_follows:0 "The ulama of the Brethren will debate the Maliki qadis at the §YGreat Mosque of Granada§!."
 NSR_tt_hold_all_m5:0 "Ikhwan Hold in every owned state: §R-5§!"
 nsr.202.t:0 "The Maliki Qadis Object"
 nsr.202.d:0 "The Maliki qadis of Granada have issued a fatwa against the \"Najdi judges\" of the hijras. The Andalusis have followed the school of Imam Malik for a thousand years, they say, and no Bedouin from Najd will teach them their religion.\n\nThe fatwa is read in every mosque of the Sultanate on Friday."
 nsr.202.a:0 "Answer them in a public debate at the Great Mosque."
 nsr.202.b:0 "Our qadis judge by the Book and the Sunnah. Let the villagers choose."
 nsr.202.c:0 "Ignore them."
 NSR_tt_hold_st_p5:0 "Ikhwan Hold in this state: §G+5§!"
 NSR_tt_hold_st_m3:0 "Ikhwan Hold in this state: §R-3§!"
 NSR_tt_hold_st_p2:0 "Ikhwan Hold in this state: §G+2§!"
 nsr.205.t:0 "Clash in [NSR_clash_state.GetName]"
 nsr.205.d:0 "The mutawwa smashed the wine jars of a tavern in [NSR_clash_state.GetName] and whipped two men who were drinking. That night the villagers came out with sticks and drove the preachers out of the square. The Sultan's gendarmes arrived in the morning, too late and on the wrong side."
 nsr.205.a:0 "The mutawwa did their duty. Stand by them."
 nsr.205.b:0 "Send compensation and a quieter preacher."
 nsr.205.c:0 "Let an Ikhwan qadi judge the matter."
 NSR_tt_fitna_m5:0 "Fitna: §Y-5§!"
 nsr.211.t:0 "The Vizier's Registration Decree"
 nsr.211.d:0 "The Vizier Ibrahim ibn Zamrak has issued a decree: every hijra must register its men, its rifles and its land with the Sultan's governors within three months. \"There is one state in al-Andalus,\" he told the Majlis, \"and it sits in the Alhambra.\"\n\nFaisal al-Dawish read the decree, folded it, and said nothing."
 nsr.211.a:0 "Let his clerks try to count us."
 nsr.211.b:0 "Register. There will be other days."
 NSR_tt_bayt_p40:0 "Bayt al-Mal of the Brethren: §G+40§!"
 NSR_tt_stipends_90:0 "The Sultan's Gold lasts §Y90 days§!."
 NSR_tt_fitna_p8:0 "Fitna: §Y+8§!"
 nsr.212.t:0 "The Sultan's Stipends"
 nsr.212.d:0 "The palace has begun paying monthly stipends to some of the lesser sheikhs of the Mutayr and the Ajman: gold for their \"services to the Sultanate\". Two of them have come to Faisal to ask what they should do."
 nsr.212.a:0 "Refuse the gold. We do not sell our religion."
 nsr.212.b:0 "Take it quietly. The Bayt al-Mal can use it."
 nsr.212.c:0 "Expose the bribes in every mosque."
 nsr.213.t:0 "The British Consul's Inquiry"
 nsr.213.d:0 "The British consul in Málaga has asked the Vizier, and then Faisal al-Dawish himself, for an account of the \"armed religious colonies\" in the Alpujarras. London remembers the Ikhwan raids on Iraq and Kuwait, and it was London that sent them here."
 nsr.213.a:0 "Receive him with coffee and courtesy."
 nsr.213.b:0 "The affairs of Muslims are no business of the English."
 NSR_tt_fitna_p10:0 "Fitna: §Y+10§!"
 NSR_tt_hold_cap_p8:0 "Ikhwan Hold in the capital state: §G+8§!"
 NSR_tt_fitna_p15:0 "Fitna: §Y+15§!"
 nsr.214.t:0 "Arrest of a Preacher"
 nsr.214.d:0 "Gendarmes have arrested an Ikhwan preacher in the market of Órgiva for \"disturbing the peace\": he told the shopkeepers that selling tobacco is a sin. He sits in the Sultan's prison in Granada and the hijras are boiling."
 nsr.214.a:0 "Protest in front of the prison."
 nsr.214.b:0 "Petition the Sultan for his release."
 nsr.214.c:0 "Break him out."
 NSR_tt_army_loyalty_m10:0 "Army loyalty to the Brethren: §R-10§!"
 nsr.215.t:0 "Transfer of the Officers"
 nsr.215.d:0 "The Ministry of War has ordered a dozen officers known to pray with the Brethren to be transferred to the coastal batteries of Cádiz, far from the hijras and far from their men."
 nsr.215.a:0 "Use our friends at court to cancel the orders."
 nsr.215.b:0 "Let them go. They will preach in Cádiz too."
 nsr.225.t:0 "Scandal at Court"
 nsr.225.d:0 "Letters taken from the Vizier's office show that he took money from Spanish landowners to settle a water dispute in the Vega. The Brethren have copies."
 nsr.225.a:0 "Read them aloud after the Friday prayer."
 nsr.225.b:0 "Keep them. A frightened Vizier is a useful Vizier."
 nsr.230.t:0 "A State Within a State"
 nsr.230.d:0 "Foreign newspapers have started to call the Alpujarras \"the Emirate\". The Sultan's writ ends where the hijras begin: the tax collectors do not go there, the gendarmes ask permission, and the villagers settle their disputes before the Ikhwan qadis.\n\nIn the Alhambra, the Vizier is said to have told the Sultan that there is no longer any peaceful way out."
 nsr.230.a:0 "The court is a shell. Everyone knows it."
 NSR_tt_struck_first:0 "§RThe loyalists are better prepared: more equipment, and the fleet stays royalist.§!"
 NSR_tt_civil_war_starts:0 "§RThe Andalusi Civil War begins!§! States with Ikhwan Hold below 50 go to the loyalists. The Ikhwan divisions and every Ikhwan leader stay with us."
 nsr.250.t:0 "The Sultan Strikes First"
 nsr.250.d:0 "Before dawn, the Guard of the Sultan and the gendarmerie moved against the hijras. The Vizier had convinced Muhammad XIV that waiting any longer meant losing everything. Riders reached Faisal al-Dawish an hour before the soldiers did.\n\nThe fitna has come, and it has come on the court's terms."
 nsr.250.a:0 "To arms, Brethren!"
 nsr.251.t:0 "The Vizier's Ultimatum"
 nsr.251.d:0 "The Vizier has sent his ultimatum to the hijras: hand over every rifle, dissolve the qadi courts and the Bayt al-Mal, and send Faisal al-Dawish to the Sultan to answer for his \"sedition\". The Brethren have until the evening prayer.\n\nThere is only one answer the Ikhwan have ever given to such a demand."
 nsr.251.a:0 "We will answer him at dawn."
 nsr.260.t:0 "The Muhajirun Arrive"
 nsr.260.d:0 "Another wave of emigrants has reached Málaga and Almería: families with bundles, young men with nothing, old scholars with trunks of books. The Brethren meet them at the docks with bread and dates and lead them up into the mountains."
 nsr.260.a:0 "Welcome, brothers."
 NSR_tt_hold_granada_p10:0 "Ikhwan Hold in Granada: §G+10§!"
 NSR_tt_inst_mutawwa_p1:0 "Mutawwa (institution level): §G+1§!"
 NSR_tt_unlock_mutawwa:0 "Unlocks the decision §YSend the Mutawwa to [state]§!."
 NSR_tt_unlock_hijrah:0 "Unlocks the §YGreat Hijrah§! decisions, including §YSettle Muhajirun in [state]§!, the Emirate's way of making conquered land its own."
 NSR_tt_inst_qadis_p1:0 "Ikhwan qadi courts (institution level): §G+1§!"
 NSR_tt_unlock_qadi:0 "Unlocks the decision §YOpen a Qadi Court in [state]§!."
 NSR_tt_inst_bayt_al_mal_p1:0 "Bayt al-Mal (institution level): §G+1§!"
 NSR_tt_bayt_al_mal_p50:0 "Bayt al-Mal of the Brethren: §G+50§!"
 NSR_tt_unlock_zakat:0 "Unlocks decision: §YCollect the Zakat§!"
 NSR_tt_army_loyalty_p5:0 "Army loyalty to the Brethren: §G+5§!"
 NSR_tt_faisal_advisor:0 "§YFaisal al-Dawish§! and the other Ikhwan sheikhs can be appointed as §Yadvisors§!."
 NSR_tt_army_loyalty_p15:0 "Army loyalty to the Brethren: §G+15§!"
 NSR_tt_unlock_barracks:0 "Unlocks §YPreach in the Barracks§!, §YWin Over the Garrison of [state]§!, §YThe Sailors of Cádiz§! and §YThe Aviators of Tablada§!."
 NSR_tt_inst_militia_p1:0 "Hijra militia (institution level): §G+1§!"
 NSR_tt_liwa_counted:0 "A new §YLiwa al-Ikhwan§! is formed. It will fight for the Brethren if war comes."
 NSR_tt_unlock_militia:0 "Unlocks the decision §YArm the Hijra Militia§!."
 NSR_tt_bajad_theorist:0 "§YSultan bin Bajad§! can be appointed as §Ytheorist§!."
 NSR_tt_no_handover:0 "The court can no longer hand any of the Brethren over to Riyadh."
 NSR_tt_petition:0 "The Sultan will §Yconcede§!, §Yrefuse§! or §Ystall§!. The stronger the Brethren, the more likely he is to give way."
 NSR_tt_hold_all_p5:0 "Ikhwan Hold in every owned state: §G+5§!"
 NSR_tt_unlock_sabotage:0 "Unlocks the decision §YSabotage the Vizier§!."
 NSR_tt_unlock_winover:0 "Unlocks the decisions to win over §YRidwan Bannigash§!, §YAli al-Attar§! and §YAbu al-Qasim al-Sarraj§!."
 NSR_tr_hold_cap_50:0 "Ikhwan Hold in the capital state is at least §Y50§!"
 NSR_tt_civil_war_focus:0 "§RThe Andalusi Civil War begins!§!\nStates with Ikhwan Hold of 50 or more, and states whose garrison was won over, stay with the Brethren. The rest go to the Sultan. Army loyalty decides how much of the army follows us; the navy and air force stay royalist unless they were won over.\nEvery Ikhwan leader and every Liwa al-Ikhwan fights for the Brethren, and §YFaisal al-Dawish§! leads the Ikhwani side."
 NSR_tr_fitna_60:0 "Fitna is at least §Y60§!"
 NSR_p_exiles_of_sabilla:0 "The Exiles of Sabilla"
 NSR_p_exiles_of_sabilla_desc:0 "In the spring of 1930 British steamers put the survivors of Sabilla ashore at Almería and Cádiz: the Mutayr, the Utaybah and the Ajman, with their families, their camels and their rifles. Six years later they are no longer guests. The question is what they will become, and what they will make of al-Andalus."
 NSR_p_new_artawiya:0 "Al-Artawiya al-Jadida"
 NSR_p_new_artawiya_desc:0 "In 1913 the first Ikhwan settled at al-Artawiya in Najd: they sold their camels, built mud houses around a mosque and became farmer-warriors. New Artawiya, above Órgiva, was built the same way. Now it must become the model for every hijra in al-Andalus: terraces, wells, a school for the Quran and a place for the rifles."
 NSR_p_mutawwa_go_out:0 "The Mutawwa Go Out"
 NSR_p_mutawwa_go_out_desc:0 "The mutawwa, the volunteers who command right and forbid wrong, leave the hijras for the villages of the Vega and the Alpujarras. They teach the prayer, close the taverns, and preach tawhid against the saints' tombs and amulets of Andalusi folk religion."
 NSR_p_call_to_hijrah:0 "The Call to Hijrah"
 NSR_p_call_to_hijrah_desc:0 "Hijrah, emigration for the sake of God, is how the Prophet built the first Muslim community at Medina, and how the Ikhwan built theirs in Najd. Letters go out from New Artawiya to the Rif, the Maghreb, Egypt, India and the Balkans: come to a land where the law of God is kept."
 NSR_p_courts_of_the_qadis:0 "Courts of the Qadis"
 NSR_p_courts_of_the_qadis_desc:0 "The Sultan's courts are slow, expensive and full of lawyers. An Ikhwan qadi judges in a morning, by the Book and the Sunnah, and takes nothing. The villagers have noticed. So have the Maliki qadis of Granada."
 NSR_p_bayt_al_mal:0 "The Bayt al-Mal of the Brethren"
 NSR_p_bayt_al_mal_desc:0 "Zakat, the alms that are a pillar of Islam, will no longer pass through the Sultan's treasury. The Brethren collect it themselves and spend it themselves: on widows, on seed, on the newly arrived muhajirun, and one day on rifles."
 NSR_p_ikhwan_instructors:0 "Ikhwan Instructors"
 NSR_p_ikhwan_instructors_desc:0 "The Sultan wanted the Brethren for their swords. Faisal al-Dawish gives him their teachers instead: veterans of the ghazu who drill the Andalusi cavalry in the long ride and the sudden charge, and who lead the soldiers in prayer when the drill is over."
 NSR_p_white_turbans:0 "White Turbans in the Officer Corps"
 NSR_p_white_turbans_desc:0 "In Najd the white turban marked a man of the Brethren. In Granada young lieutenants have started to wear it under their caps. Their colonels pretend not to see."
 NSR_p_arm_the_hijras:0 "Arm the Hijras"
 NSR_p_arm_the_hijras_desc:0 "Every man of the hijra is a farmer and a soldier: that was the rule at al-Artawiya and it is the rule in the Alpujarras. The Bayt al-Mal buys rifles, and the militia drills after the evening prayer."
 NSR_p_oath_of_artawiya:0 "The Oath of Artawiya"
 NSR_p_oath_of_artawiya_desc:0 "At New Artawiya the sheikhs of the Mutayr, the Utaybah and the Ajman renew their bay'ah, their oath of allegiance, to Faisal al-Dawish: to hear and obey in hardship and in ease. They swore it once in Najd. They swear it again in al-Andalus."
 NSR_p_the_spanish_fire:0 "The Infidels Burn Each Other"
 NSR_p_the_spanish_fire_desc:0 "Beyond the Sierra Morena the Spaniards are killing each other. Refugees and deserters come south, and Moroccan Regulares fight in Spanish uniforms for a Spanish general. The sheikhs ask what this means for the Muslims, and for al-Andalus."
 NSR_p_refuse_the_king:0 "No Surrender to Riyadh"
 NSR_p_refuse_the_king_desc:0 "King Abdulaziz still demands the men of Sabilla. The Brethren make their answer known in every mosque of al-Andalus: no Muslim will be handed over to the king who brought the English into Arabia, and any minister who tries will answer to the hijras."
 NSR_p_petition_to_the_sultan:0 "The Petition of the Sheikhs"
 NSR_p_petition_to_the_sultan_desc:0 "The sheikhs put their demands to the Sultan in writing: close the taverns of Granada, dismiss the Christian and English advisers, and remove the Vizier who has called the Brethren a state within the state. They sign it with their seals, and they send a copy to every mosque."
 NSR_p_defy_the_vizier:0 "Defy the Vizier"
 NSR_p_defy_the_vizier_desc:0 "The Vizier's orders no longer reach the hijras. His gendarmes are turned back at the edge of every settlement, politely but firmly, and his tax collectors go home empty-handed."
 NSR_p_shura_of_the_sheikhs:0 "The Shura of the Sheikhs"
 NSR_p_shura_of_the_sheikhs_desc:0 "\"And consult them in the matter\" (Quran 3:159). The sheikhs now meet every week in council under Faisal al-Dawish. They consult, the Amir decides, and all obey. It is a shadow government in all but name."
 NSR_p_the_parallel_emirate:0 "The Parallel Emirate"
 NSR_p_the_parallel_emirate_desc:0 "The Brethren stop pretending. In the hijras and the villages around them, the Ikhwan qadis judge, the Bayt al-Mal taxes, the mutawwa keep order and the militia stands guard. Foreign newspapers call it \"the Emirate\". So, quietly, do the Brethren."
 NSR_p_night_of_the_white_turbans:0 "The Night of the White Turbans"
 NSR_p_night_of_the_white_turbans_desc:0 "At the first call to prayer the white-turbaned officers will open the gates of the Alhambra, and the Liwa al-Ikhwan will ride down from the Alpujarras. There is no way back from this night."
 NSR_sultan_stalls_mission:0 "The Sultan Stalls"
 NSR_sultan_stalls_mission_desc:0 "The Sultan has neither accepted nor rejected the petition. If the Brethren are clearly the stronger party when his time runs out, he will give way. If not, he will refuse."
 NSR_tt_stall_goal:0 "The Sultan gives way if the Dual Power is at least §Y0.3§! towards the Brethren when the mission ends. Otherwise he refuses."
 NSR_tt_hold_cap_p4:0 "Ikhwan Hold in the capital state: §G+4§!"
 NSR_tt_hold_cap_p6:0 "Ikhwan Hold in the capital state: §G+6§!"
 nsr.201.t:0 "A Qadi in the Vega"
 nsr.201.d:0 "Two Muslim farmers of Santa Fe have fought for eleven years in the Sultan's courts over a well. Last week they took the case to the Ikhwan qadi at the edge of the Vega. He heard both men, read the deeds, divided the water by days of the week, and refused the gift they offered him. The story is told in every café in Granada."
 nsr.201.a:0 "Justice without fees is the best sermon."
 nsr.201.b:0 "Send more qadis into the Vega."
 NSR_tt_hold_cap_p3:0 "Ikhwan Hold in the capital state: §G+3§!"
 NSR_tt_fitna_m3:0 "Fitna: §Y-3§!"
 nsr.203.t:0 "The Debate at the Great Mosque"
 nsr.203.d:0 "The courtyard of the Great Mosque of Granada is full. On one side sit the Maliki qadis in their robes, with the books of Imam Malik and a thousand years of Andalusi scholarship. On the other sit the ulama of the Brethren, with the Quran, the collections of hadith and the Three Principles of Muhammad ibn Abd al-Wahhab. The question is simple and ancient: may a Muslim seek the intercession of the saints at their tombs?"
 nsr.203.a:0 "Argue from the Book and the Sunnah alone."
 nsr.203.b:0 "Seek common ground: the Maliki imams also taught tawhid."
 NSR_tt_hold_all_p3:0 "Ikhwan Hold in every owned state: §G+3§!"
 nsr.204.t:0 "The Grand Mufti's Ruling"
 nsr.204.d:0 "The Grand Mufti of Granada has given his ruling on the debate. The Ikhwan qadis may judge among the people of the hijras who ask for them, he says, but they have no authority outside the hijras, and the courts of the Sultanate will follow the school of Malik as they always have. It is a compromise, and it satisfies no one completely."
 nsr.204.a:0 "Accept it. Our courts will grow by their justice."
 nsr.204.b:0 "Our qadis judge wherever the believers ask them to."
 NSR_tt_hold_sev_m3:0 "Ikhwan Hold in Sevilla: §R-3§!"
 NSR_tt_hold_sev_p5:0 "Ikhwan Hold in Sevilla: §G+5§!"
 NSR_tt_fitna_p6:0 "Fitna: §Y+6§!"
 NSR_tt_hold_sev_p3:0 "Ikhwan Hold in Sevilla: §G+3§!"
 NSR_tt_fitna_m2:0 "Fitna: §Y-2§!"
 nsr.206.t:0 "The Ronda Wedding"
 nsr.206.d:0 "A year ago mutawwa broke the lutes and drums at a wedding in Ronda, and the riot that followed made the Brethren famous. This year the families of Ronda have announced another wedding, with the loudest band in the Serranía. Everyone is waiting to see what the Ikhwan will do."
 nsr.206.a:0 "Let them have their music. We will not be provoked."
 nsr.206.b:0 "Send the mutawwa again."
 nsr.206.c:0 "Faisal sends the couple a gift and a Quran."
 NSR_tt_bayt_al_mal_m20:0 "Bayt al-Mal of the Brethren: §R-20§!"
 nsr.207.t:0 "Tobacco Burned in Órgiva"
 nsr.207.d:0 "The mutawwa of Órgiva have burned the stock of the tobacco shop in the market: forty kilos of the Sultan's monopoly tobacco. To the Brethren smoking is forbidden; to the Treasury it is a tenth of its revenue. The shopkeeper wants compensation and the Vizier wants arrests."
 nsr.207.a:0 "Pay the shopkeeper from the Bayt al-Mal."
 nsr.207.b:0 "Tobacco is forbidden. The Sultan should thank us."
 NSR_tt_muhajirun_p1:0 "Muhajirun (thousands): §G+1§!"
 nsr.208.t:0 "The First Muhajirun from the Rif"
 nsr.208.d:0 "A fishing boat from Alhucemas has landed at Almería with sixty men, women and children. The men fought with Abd el-Krim against Spain and France until 1926, and they have lived under Spanish officers ever since. They ask for the Brethren by name."
 nsr.208.a:0 "Settle them in the hijras."
 nsr.208.b:0 "Veterans of the Rif War belong in the Liwa al-Ikhwan."
 NSR_tt_hold_cap_p5:0 "Ikhwan Hold in the capital state: §G+5§!"
 nsr.209.t:0 "A Famous Convert"
 nsr.209.d:0 "Hasan al-Qaysi, the most celebrated poet of Granada, whose verses about wine and gardens are sung in every café, has burned his manuscripts and gone to live in New Artawiya. \"I wrote about paradise for thirty years,\" he told a journalist, \"and never once thought about how to reach it.\""
 nsr.209.a:0 "Let him write for the Brethren."
 nsr.209.b:0 "Let him live quietly in the hijra. His example is enough."
 NSR_tt_bayt_al_mal_p30:0 "Bayt al-Mal of the Brethren: §G+30§!"
 NSR_tt_bayt_al_mal_p10:0 "Bayt al-Mal of the Brethren: §G+10§!"
 nsr.210.t:0 "The Zakat Collectors"
 nsr.210.d:0 "The farmers of the Vega complain that they now pay twice: the Sultan's taxes to the governor, and zakat to the collectors of the Brethren. Most of them pay both. Some are asking why they should pay the Sultan at all."
 nsr.210.a:0 "Zakat is owed to God. Collect it."
 nsr.210.b:0 "Take nothing from the poor this year."
 nsr.216.t:0 "The Moroccan Regulares"
 nsr.216.d:0 "Thousands of Moroccan Regulares, Muslims from the Rif and the Jbala, are fighting in the Spanish war for General Franco, who once fought against their fathers. Refugees and deserters are crossing into al-Andalus. The sheikhs ask what the Brethren should do while the unbelievers burn each other."
 nsr.216.a:0 "Preach to the Regulares: leave the infidel's war for the hijra."
 nsr.216.b:0 "Stay aloof. This is not our war."
 nsr.216.c:0 "Sell horses to both sides."
 nsr.217.t:0 "Letters from Najd"
 nsr.217.d:0 "A pilgrim returning from Mecca has brought letters from the Mutayr who stayed in Najd. King Abdulaziz has settled them in his own villages, they write, taxes them, and sends his motorcars to watch them. Some ask if there is room in al-Andalus."
 nsr.217.a:0 "There is always room for our brothers."
 nsr.217.b:0 "Tell them to be patient. Their time will come."
 NSR_tt_bayt_al_mal_m30:0 "Bayt al-Mal of the Brethren: §R-30§!"
 nsr.218.t:0 "The Hijra Grows Crowded"
 nsr.218.d:0 "The hijras of the Alpujarras are full, and the muhajirun keep coming. The Brethren have begun to terrace the hillsides above Lanjarón, but the Christian villagers of Lanjarón say the water of those slopes has been theirs since before the Reconquista stopped at Granada's walls."
 nsr.218.a:0 "Buy the land from the Bayt al-Mal."
 nsr.218.b:0 "Let the Sultan's qadi decide."
 nsr.218.c:0 "Terrace the slopes anyway. We are many."
 nsr.219.t:0 "The Jewish Merchants of Málaga"
 nsr.219.d:0 "A delegation of Jewish merchants from Málaga has come, very carefully, to New Artawiya. Their families have lived under the Nasrids for seven hundred years. They have heard the preachers, and they ask Faisal al-Dawish one question: what would become of them under the Brethren?"
 nsr.219.a:0 "Give them a letter of aman: the dhimma protects their lives, property and worship."
 nsr.219.b:0 "Send them away without an answer."
 nsr.220.t:0 "The Sheikhs Take Counsel"
 nsr.220.d:0 "The Shura met late into the night at New Artawiya. The Brethren are one in their creed and one in their oath; the question before them was only one of time. Dhaydan bin Hithlain counselled patience: build the hijras, fill the Bayt al-Mal, win the garrisons, and let the court exhaust itself. Sultan bin Bajad counselled action: every month of waiting gives the Vizier time to prepare. Faisal al-Dawish listened to both, as the Amir must, and then he decided."
 nsr.220.a:0 "\"We build first. When the day comes, it will be ours.\" (Dhaydan's counsel)"
 nsr.220.b:0 "\"The court is weak now. We press it now.\" (Sultan bin Bajad's counsel)"
 nsr.220.c:0 "\"Both are right, each in its season.\""
 NSR_tt_hold_cap_p2:0 "Ikhwan Hold in the capital state: §G+2§!"
 nsr.221.t:0 "A Car for the Sheikh?"
 nsr.221.d:0 "A merchant of Málaga has presented Faisal al-Dawish with a Hispano-Suiza motor car. In Najd the Ikhwan called such things the work of sorcerers, and it was motorcars and machine guns that broke them at Sabilla. The Amir has asked the ulama of the Brethren for a ruling, and the hijras wait for their answer."
 nsr.221.a:0 "The ulama rule: a tool is not a religion. Remember Sabilla."
 nsr.221.b:0 "The ulama counsel caution. The car goes back to Málaga."
 nsr.240.t:0 "The Sultan Concedes"
 nsr.240.d:0 "Muhammad XIV has given way. The taverns near the mosques will close, two English advisers are going home, and the Vizier has been \"advised to rest\". The Brethren have shown who governs the streets of al-Andalus, and the court has shown that it can be made to bend."
 nsr.240.a:0 "Praise be to God."
 nsr.241.t:0 "The Sultan Refuses"
 nsr.241.d:0 "The Sultan has returned the petition unanswered, with a note in the Vizier's hand: \"The Sultanate does not take instructions from its guests.\" The seals of the sheikhs have been insulted, and every hijra knows it."
 nsr.241.a:0 "Then he has made his choice."
 nsr.242.t:0 "The Sultan Stalls"
 nsr.242.d:0 "The Sultan has received the petition, thanked the sheikhs for their concern and promised to \"study their proposals with the care they deserve\". His ministers are counting the Brethren's rifles and the army's loyalty before they answer."
 nsr.242.a:0 "We will wait, and grow stronger."
 NSR_ikhwan_active_tt:0 "The Brethren teach in the army (§YIkhwan Instructors§!), or the Fitna has begun"
 NSR_bajad_theorist_ready_tt:0 "The sheikhs have sworn §YThe Oath of Artawiya§!, or the Fitna has begun"
 NSR_march_on_sevilla:0 "The March on Sevilla"
 NSR_march_on_sevilla_desc:0 "The Liwa al-Ikhwan ride for the Guadalquivir. Speed is everything: the Sultan must not be given time to dig in."
 NSR_war_in_the_sierras:0 "War in the Sierras"
 NSR_war_in_the_sierras_desc:0 "The Brethren know every goat track of the Alpujarras and the Serranía de Ronda. The Sultan's columns do not."
 NSR_ghazu_strike_and_vanish:0 "Ghazu: Strike and Vanish"
 NSR_ghazu_strike_and_vanish_desc:0 "The old Bedouin raid, the ghazu, taught in the olive groves of al-Andalus: strike at dawn, take what matters, and be gone before the enemy can answer."
 NSR_amirate_of_faisal:0 "The Amir of al-Andalus"
 NSR_amirate_of_faisal_desc:0 "The Brethren have given their bay'ah to the Amir. He consults the Shura, he decides, and all obey."
 NSR_hijras_weary:0 "The Hijras Are Weary"
 NSR_hijras_weary_desc:0 "Too many men are away with the banners and too few are left for the terraces. The harvest is late and the widows are many. This will last until the Shura turns to Tamkin again."
 NSR_gibraltar_supply_line:0 "The Gibraltar Supply Line"
 NSR_gibraltar_supply_line_desc:0 "British merchants in Gibraltar sell the Sultan whatever he can pay for."
 NSR_three_faiths_volunteers:0 "Volunteers of the Three Faiths"
 NSR_three_faiths_volunteers_desc:0 "Muslims, Christians and Jews who fear the Brethren have enlisted under the crimson banner of the Nasrids."
 NSR_mutiny_at_cadiz:0 "Mutiny at Cádiz"
 NSR_mutiny_at_cadiz_desc:0 "Half the crews of the Sultan's fleet refused to sail, and some went over to the Brethren."
 NSR_shura_bop:0 "The Shura of the Brethren"
 NSR_shura_bop_desc:0 "The Brethren are one in creed and one in their oath to the Amir. The Shura does not divide them; it decides what comes first. §YTamkin§! means firmly establishing the state: settle, teach, build and secure. §YJihad§! means carrying the banner beyond the Sierra: mobilise, campaign and expand. The sheikhs give their counsel, the Amir decides, and all obey."
 NSR_bop_tamkin:0 "Tamkin"
 NSR_bop_jihad:0 "Jihad"
 NSR_bop_amir_consults:0 "The Amir Consults"
 NSR_bop_tamkin_leaning:0 "Tamkin First"
 NSR_bop_tamkin_dominant:0 "The Emirate Takes Root"
 NSR_bop_jihad_leaning:0 "The Banners Are Raised"
 NSR_bop_jihad_dominant:0 "The Banner Beyond the Sierra"
 NSR_shura_category:0 "The Shura of the Brethren"
 NSR_shura_category_desc:0 "Every week the sheikhs meet in council under the Amir. They consult, he decides, and all obey. These decisions shift the Emirate's priority between §YTamkin§! and §YJihad§!."
 NSR_tt_shura_center:0 "The Shura moves §Y0.1§! towards the centre."
 NSR_convene_the_shura:0 "Convene the Shura"
 NSR_convene_the_shura_desc:0 "The sheikhs gather at the Alhambra. Every voice is heard before the Amir decides."
 NSR_counsel_of_dhaydan:0 "The Counsel of Dhaydan"
 NSR_counsel_of_dhaydan_desc:0 "Dhaydan bin Hithlain of the Ajman speaks for patience: build the hijras, teach the people, secure what God has given."
 NSR_counsel_of_bin_bajad:0 "The Counsel of Sultan bin Bajad"
 NSR_counsel_of_bin_bajad_desc:0 "Sultan bin Bajad of the Utaybah speaks for the banner: the Brethren were not made to sit still while the enemies of tawhid gather strength."
 NSR_tour_the_hijras:0 "Tour the Hijras"
 NSR_tour_the_hijras_desc:0 "The Amir rides through the settlements of the Alpujarras, hears complaints and settles disputes himself."
 NSR_tr_bayt_al_mal_20:0 "Bayt al-Mal of the Brethren is at least §Y20§!"
 NSR_gifts_to_the_tribes:0 "Gifts to the Tribes"
 NSR_gifts_to_the_tribes_desc:0 "Horses, rifles and silver from the Bayt al-Mal for the sheikhs of the Mutayr, the Utaybah and the Ajman."
 NSR_sermon_on_jihad:0 "A Sermon on Jihad"
 NSR_sermon_on_jihad_desc:0 "In every mosque of the Emirate the Friday sermon speaks of striving in the path of God."
 NSR_sermon_on_patience:0 "A Sermon on Patience (Sabr)"
 NSR_sermon_on_patience_desc:0 "\"O you who believe, seek help through patience and prayer\" (Quran 2:153). The preachers speak of sabr, patient perseverance."
 NSR_l_rally_the_loyal_regiments:0 "Rally the Loyal Regiments"
 NSR_l_rally_the_loyal_regiments_desc:0 "The Sultan calls on every regiment that still wears the crimson to gather at Sevilla."
 NSR_l_appeal_to_london:0 "An Appeal to London"
 NSR_l_appeal_to_london_desc:0 "The Sultan writes to King George: the oldest friend of Britain in the western Mediterranean asks for help against the men of Sabilla."
 NSR_l_gibraltar_supply_line:0 "The Gibraltar Supply Line"
 NSR_l_gibraltar_supply_line_desc:0 "Rifles and ammunition bought in Gibraltar come up the road to Sevilla."
 NSR_l_hold_sevilla:0 "Hold Sevilla"
 NSR_l_hold_sevilla_desc:0 "Sevilla must not fall. Its walls held against the Castilians for a century; they will hold against the Brethren."
 NSR_l_defend_cadiz:0 "Defend Cádiz"
 NSR_l_defend_cadiz_desc:0 "The port of Cádiz is the Sultan's door to the sea and to his friends abroad."
 NSR_l_fleet_stays_loyal:0 "The Fleet Stays Loyal"
 NSR_l_fleet_stays_loyal_desc:0 "The admirals have sworn their oath to the Sultan again, on the deck of the flagship."
 NSR_l_volunteers_of_the_three_faiths:0 "Volunteers of the Three Faiths"
 NSR_l_volunteers_of_the_three_faiths_desc:0 "Muslims who love the Nasrid court, Christians of the Vega and Jews of Málaga enlist side by side."
 NSR_l_restoration:0 "Restoration"
 NSR_l_restoration_desc:0 "The Sultan has returned to the Alhambra. The Nasrid dynasty endures, as it has for seven centuries."
 NSR_tt_cw_summary:0 "§YThe Ikhwani tree replaces the pre-war tree.§!\nEvery Ikhwan leader and every Liwa al-Ikhwan fights for us. §YFaisal al-Dawish§! leads the Brethren.\nThe Sultan leads the loyalists with his Andalusi court, except the men we won over.\nThe §YShura of the Brethren§! now decides the Emirate's priority: §YTamkin§! or §YJihad§!."
 nsr.300.t:0 "The Night of the White Turbans"
 nsr.300.d:0 "At the first call to prayer the gates of the Alhambra opened from the inside. White-turbaned officers stood aside as the Liwa al-Ikhwan rode up the Cuesta de Gomérez, and by sunrise the green banner of the Brethren flew over the Tower of Comares.\n\nBut the Sultan was not in his palace. Loyal regiments are gathering in the west under the crimson banner of the Nasrids, and al-Andalus is at war with itself. The Brethren call it the Fitna, the trial, and they intend to end it quickly."
 nsr.300.a:0 "Allahu akbar! To the Guadalquivir!"
 nsr.301.t:0 "The Sultan Escapes the Alhambra"
 nsr.301.d:0 "Muhammad XIV left the Alhambra an hour before the gates opened, through the old Gate of the Seven Floors that the Nasrids have kept sealed since 1492. A motor car was waiting on the Loja road. By noon he was in Sevilla, proclaiming the Brethren rebels against their protector."
 nsr.301.a:0 "Let him go. God will judge between us."
 nsr.301.b:0 "Ride after him!"
 NSR_tt_london_backs:0 "The loyalists receive §Y1500§! rifles and §YThe Gibraltar Supply Line§!."
 nsr.302.t:0 "London Watches"
 nsr.302.d:0 "Civil war has broken out in the Nasrid Sultanate, a few miles from Gibraltar. The Sultan's envoys ask for help against the Ikhwan, the same Bedouin rebels we deported from Kuwait in 1930. The Brethren, for their part, promise that Gibraltar will not be touched if London stays out."
 nsr.302.a:0 "Non-intervention. The Rock is what matters."
 nsr.302.b:0 "Support the Sultan quietly: rifles through Gibraltar."
 nsr.303.t:0 "War in al-Andalus"
 nsr.303.d:0 "In the south the Nasrid Sultanate has collapsed into civil war between the Sultan and the Ikhwan, the Bedouin exiles from Arabia. The Nasrids have been a thorn in Spain's side since 1492. Some officers say this is the moment to settle old accounts; others say Spain has troubles enough of its own."
 nsr.303.a:0 "Spain will not intervene."
 nsr.303.b:0 "Press our historic claim on Sevilla."
 NSR_tt_cadiz_mutiny:0 "The loyalist fleet suffers §RMutiny at Cádiz§!."
 nsr.304.t:0 "The Fleet at Cádiz"
 nsr.304.d:0 "Emissaries of the Brethren have slipped into Cádiz to speak to the sailors of the Sultan's fleet. Many of them are Andalusi boys from the villages where the mutawwa preach, and the hijras have fed their families for years."
 nsr.304.a:0 "The crews come over to the Brethren!"
 nsr.304.b:0 "Only a few sailors listen."
 nsr.305.t:0 "The Sultan Flees"
 nsr.305.d:0 "There was no battle. When the Liwa al-Ikhwan rode into Granada, the Sultan's guard stacked its rifles in the Court of the Myrtles and went home. Muhammad XIV left for Gibraltar that same night aboard a British destroyer. Seven centuries of Nasrid rule ended without a shot."
 nsr.305.a:0 "Praise be to God, who spared the blood of the Muslims."
 NSR_tt_muhajirun_divs:0 "Two divisions of §YMuhajirun Volunteers§! are raised at the capital."
 nsr.306.t:0 "Muhajirun Volunteers Land at Málaga"
 nsr.306.d:0 "Ships from Tangier, Oran and Alexandria have landed hundreds of young men at Málaga. They have heard that the Brethren are fighting for the law of God in al-Andalus, and they have come to join them."
 nsr.306.a:0 "Form them into regiments."
 nsr.306.b:0 "Send them to the hijras. The harvest must be brought in."
 NSR_tt_loy_ws:0 "Loyalist war support: §G-10%§!"
 NSR_tt_loy_mp:0 "The loyalists lose §Y3000§! manpower; §Y2000§! men come over to us."
 nsr.307.t:0 "Letters to the Garrisons"
 nsr.307.d:0 "The sheikhs have written to every garrison that still obeys the Sultan: the Brethren have no quarrel with Muslim soldiers, and any man who lays down his rifle may go home in peace."
 nsr.307.a:0 "Write to the officers."
 nsr.307.b:0 "Write to the soldiers."
 nsr.308.t:0 "The Question of the Prisoners"
 nsr.308.d:0 "Thousands of the Sultan's soldiers are in the hands of the Brethren. They are Muslims, Christians and Jews of al-Andalus, and one day they will be the Emirate's subjects. The sheikhs must decide what becomes of them."
 nsr.308.a:0 "Release them on parole."
 nsr.308.b:0 "Exchange them for our own men."
 nsr.308.c:0 "Hold them in the hijras and teach them tawhid."
 nsr.309.t:0 "The Flight of the Sultan"
 nsr.309.d:0 "Muhammad XIV is cornered in the old town of Cádiz with a few hundred of his guard. The British consul has asked the Brethren to let him leave with his family. The sheikhs agree that no Muslim ruler's blood will be shed; the only question is where he may go."
 nsr.309.a:0 "To Gibraltar, under British protection."
 nsr.309.b:0 "To London. Far away is best."
 nsr.309.c:0 "To Tangier, among Muslims, where we can watch him."
 nsr.310.t:0 "The End of the Fitna"
 nsr.310.d:0 "The last loyalist garrison has surrendered. From the Guadalquivir to the Alpujarras al-Andalus belongs to the Brethren. The Fitna is over, and the work of building begins."
 nsr.310.a:0 "Praise be to God, Lord of the Worlds."
 nsr.311.t:0 "London Stays Out"
 nsr.311.d:0 "The British government has declared its non-intervention in the Andalusi civil war. The garrison of Gibraltar has been reinforced and ordered to remain strictly neutral."
 nsr.311.a:0 "Good. Gibraltar will not be touched."
 nsr.312.t:0 "London Backs the Sultan"
 nsr.312.d:0 "Crates of British rifles are reaching Sevilla by way of Gibraltar. London denies everything."
 nsr.312.a:0 "The English again, as at Sabilla."
 nsr.313.t:0 "Spain Stays Out"
 nsr.313.d:0 "The Spanish government has announced that it will not interfere in the internal affairs of the Nasrid Sultanate."
 nsr.313.a:0 "One enemy at a time."
 nsr.314.t:0 "Spain Claims Sevilla"
 nsr.314.d:0 "The Spanish government has revived its claim to Sevilla, \"lost to Spain since the Granada war\". It has not moved troops. Yet."
 nsr.314.a:0 "Let them come."
 nsr_emirate.1.t:0 "The Frontier Tests Us"
 nsr_emirate.1.d:0 "While the Emirate builds, its neighbours watch. This week foreign patrols crossed the frontier twice and withdrew before the Brethren could answer. They are testing whether the Emirate still has teeth."
 nsr_emirate.1.a:0 "Reinforce the frontier."
 nsr_emirate.1.b:0 "Answer with patience; they will not dare more."
 nsr_emirate.2.t:0 "The Hijras Are Weary"
 nsr_emirate.2.d:0 "The banners have been raised too long. The terraces of the Alpujarras stand half-harvested, and in every hijra there are widows and empty houses. The sheikhs report this to the Amir without complaint; they ask only that he know it."
 nsr_emirate.2.a:0 "We will rest when the work is done."
 nsr_emirate.2.b:0 "Let the men go home for the harvest."
 nsr_news.10.t:0 "Civil War in al-Andalus"
 nsr_news.10.d:0 "The Nasrid Sultanate of Granada, the last Muslim kingdom in Europe, is at war with itself. The Ikhwan, the Bedouin exiles from Arabia to whom the Sultan gave asylum in 1930, have seized the Alhambra, and Sultan Muhammad XIV has raised his standard at Sevilla. Faisal al-Dawish, who once defied Ibn Saud, now fights for al-Andalus."
 nsr_news.10.a:0 "The Fitna has begun."
 nsr_news.10.b:0 "Long live the Sultan!"
 nsr_news.10.c:0 "Another war in Iberia."
 nsr_news.11.t:0 "The Brethren Victorious"
 nsr_news.11.d:0 "The Andalusi civil war is over. The last of the Sultan's regiments have surrendered, and Faisal al-Dawish rules from the Alhambra. The Ikhwan, broken at Sabilla in 1929, have won a country of their own at the other end of the Mediterranean."
 nsr_news.11.a:0 "Allahu akbar!"
 nsr_news.11.b:0 "What will they do next?"
 nsr_news.12.t:0 "The Sultan Restored"
 nsr_news.12.d:0 "Sultan Muhammad XIV has returned to the Alhambra. The Ikhwan rising is crushed and its surviving sheikhs have fled into the mountains or across the Strait. The Nasrid dynasty endures."
 nsr_news.12.a:0 "The Nasrids endure."

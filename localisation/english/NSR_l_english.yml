 NSR_umar_farhat_army_chief:0 "Umar Farhat al-Qurtubi"
 NSR_umar_farhat_army_chief_desc:0 "A captain of the royal army, born in the Cordoban quarter of Granada, who went over to the Brethren with his whole company when the Sultan ordered them to fire on the Alpujarras. He studied the defeat at Sabilla more closely than any man alive and never stops lecturing about maps, rifles, railways and supply. In the Shura he speaks for tamkin. §g(Fictional character, AI-painted portrait.)§!"

 NSR_tr_weak_447:0 "The owner of §YAlexandria§! is at war, has capitulated or is not a Great Power (or we already hold it)"
 NSR_tt_najd_vol_focus:0 "The Ikhwan of Najd receive §Y2000§! infantry equipment and §Y5000§! men."
 NSR_tr_hasa_friendly:0 "§YDammam (al-Hasa)§! is held by us or by our subject"
 NSR_tr_weak_656:0 "The owner of §YKuwait§! is at war, has capitulated or is not a Great Power (or we already hold it)"
 NSR_tt_brethren_offer:0 "The rulers of Najd are invited to accept the Amir as their protector (they become our §Ysubject§! if they agree)."
 NSR_tr_nejd_friendly:0 "§YNejd§! is held by us or by our subject"
 NSR_tr_weak_291:0 "The owner of §YIraq§! is at war, has capitulated or is not a Great Power (or we already hold it)"
 NSR_tt_hejaz_subject:0 "Our Najdi brothers hold the Holy Cities in the name of the Amir: stability §G+5%§!, political power §G+100§!."
 NSR_tr_hejaz_open:0 "The Second Ikhwan Revolt has won, or Saudi Arabia is at war"
 NSR_tr_hejaz_ours:0 "§YMadinah§! is held by us or by our subject"
 NSR_e_morning_of_the_white_turbans:0 "The Morning of the White Turbans"
 NSR_e_morning_of_the_white_turbans_desc:0 "The green banner flies over the Alhambra. Now the Brethren must win the war they have started."
 NSR_e_mobilise_the_hijras:0 "Mobilise the Hijras"
 NSR_e_mobilise_the_hijras_desc:0 "Every man of the hijras who can ride takes down his rifle. A new Liwa al-Ikhwan forms at the capital."
 NSR_e_war_in_the_sierras:0 "The War in the Sierras"
 NSR_e_war_in_the_sierras_desc:0 "The Brethren fight where they are strongest: in the mountains, on the goat tracks, at night."
 NSR_e_ghazu_strike_and_vanish:0 "Ghazu: Strike and Vanish"
 NSR_e_ghazu_strike_and_vanish_desc:0 "The raid of the desert, the ghazu, becomes the doctrine of the Emirate's cavalry."
 NSR_e_muhajirun_volunteers:0 "Muhajirun Volunteers"
 NSR_e_muhajirun_volunteers_desc:0 "Young Muslims from across the Mediterranean are coming to fight for the Brethren."
 NSR_e_secure_the_alhambra:0 "Secure the Alhambra"
 NSR_e_secure_the_alhambra_desc:0 "The red fortress on the Sabika hill must never change hands again."
 NSR_e_march_on_sevilla:0 "The March on Sevilla"
 NSR_e_march_on_sevilla_desc:0 "The Sultan is in Sevilla. The Liwa al-Ikhwan ride west along the Guadalquivir before he can dig in."
 NSR_e_fleet_at_cadiz:0 "The Fleet at Cádiz"
 NSR_e_fleet_at_cadiz_desc:0 "The Sultan's ships lie at Cádiz, and their crews are Andalusi villagers."
 NSR_e_letters_to_the_garrisons:0 "Letters to the Garrisons"
 NSR_e_letters_to_the_garrisons_desc:0 "The sheikhs write to the soldiers of the Sultan: the Brethren have no quarrel with Muslim soldiers."
 NSR_e_fatwa_against_the_court:0 "The Fatwa Against the Court"
 NSR_e_fatwa_against_the_court_desc:0 "The ulama of the Brethren rule that the court, which allied itself with the enemies of tawhid, has lost its claim to obedience."
 NSR_e_amnesty_for_the_soldiers:0 "Amnesty for the Sultan's Soldiers"
 NSR_e_amnesty_for_the_soldiers_desc:0 "Any soldier of the Sultan who lays down his arms is forgiven, his property safe and his family protected."
 NSR_e_warn_off_london:0 "Warn Off London"
 NSR_e_warn_off_london_desc:0 "A message to the British consul: Gibraltar will not be touched, provided London stays out of the Fitna."
 NSR_e_word_to_the_spaniards:0 "A Word to the Spaniards"
 NSR_e_word_to_the_spaniards_desc:0 "Envoys go north over the Sierra Morena: the Brethren seek no quarrel with Spain while the Fitna lasts."
 NSR_e_flight_of_the_sultan:0 "The Flight of the Sultan"
 NSR_e_flight_of_the_sultan_desc:0 "The Sultan's cause is lost. What remains is to decide where the last Nasrid will live out his days."
 NSR_e_end_of_the_fitna:0 "The End of the Fitna"
 NSR_e_end_of_the_fitna_desc:0 "The war is over. The Brethren put away their banners and take up their ploughs."
 NSR_e_mend_the_vega:0 "Mend the Vega"
 NSR_e_mend_the_vega_desc:0 "The canals, roads and bridges broken in the Fitna are repaired by the men of the hijras."
 NSR_e_cleanse_the_diwan:0 "Cleanse the Diwan"
 NSR_e_cleanse_the_diwan_desc:0 "The officials who served the court for bribes and favours are dismissed. Men of the Brethren take their desks."
 NSR_e_question_of_the_prisoners:0 "The Question of the Prisoners"
 NSR_e_question_of_the_prisoners_desc:0 "Thousands of the Sultan's soldiers are in the hands of the Brethren. They must be dealt with justly."
 NSR_e_nasrid_treasury:0 "The Nasrid Treasury"
 NSR_e_nasrid_treasury_desc:0 "The vaults of the Alhambra are opened. What the Sultan did not take with him now belongs to the Bayt al-Mal of the Emirate."
 NSR_e_bayah_of_granada:0 "The Bay'ah of Granada"
 NSR_e_bayah_of_granada_desc:0 "The ulama, the notables and the guilds of Granada give their oath of allegiance, the bay'ah, to the Amir."
 NSR_e_proclaim_the_ikhwani_emirate:0 "Proclaim the Ikhwani Emirate"
 NSR_e_proclaim_the_ikhwani_emirate_desc:0 "From the Tower of Comares the Amir proclaims the Ikhwani Emirate of al-Andalus. The crimson banner of the Nasrids comes down, and the green flag of the Brethren goes up."
 NSR_e_amir_of_al_andalus:0 "Amir of al-Andalus"
 NSR_e_amir_of_al_andalus_desc:0 "The Amir is not a king. He rules by the Book, consults the Shura and answers to God. But in al-Andalus, no one now doubts who rules."
 NSR_e_majlis_of_the_sheikhs:0 "The Majlis of the Sheikhs"
 NSR_e_majlis_of_the_sheikhs_desc:0 "The sheikhs of the tribes and the emirs of the hijras sit together in council under the Amir."
 NSR_e_diwan_of_the_amir:0 "The Diwan of the Amir"
 NSR_e_diwan_of_the_amir_desc:0 "The Amir needs a chancery. Scribes are found among the Andalusi clerks who stayed and the few literate Brethren."
 NSR_e_white_turban_guard:0 "The White Turban Guard"
 NSR_e_white_turban_guard_desc:0 "The men who opened the gates of the Alhambra become the Amir's own guard."
 NSR_e_voice_of_the_hijras:0 "The Voice of the Hijras"
 NSR_e_voice_of_the_hijras_desc:0 "The preachers who once spoke against the court now speak for the Emirate."
 NSR_e_imarates_of_al_andalus:0 "The Imarates of al-Andalus"
 NSR_e_imarates_of_al_andalus_desc:0 "Each province gets an emir who answers to the Amir, as Ibn Saud governed the Hasa and the Hijaz through his amirs."
 NSR_e_bayah_of_the_officials:0 "The Bay'ah of the Officials"
 NSR_e_bayah_of_the_officials_desc:0 "Every official of the Emirate, from the governor of Málaga to the clerk of the smallest customs post, gives his oath to the Amir."
 NSR_e_tribes_settled_for_good:0 "The Tribes Settled for Good"
 NSR_e_tribes_settled_for_good_desc:0 "The Mutayr, the Utaybah and the Ajman will not return to the desert. Their tents are folded for the last time; al-Andalus is home."
 NSR_e_andalusis_in_the_brotherhood:0 "Andalusis in the Brotherhood"
 NSR_e_andalusis_in_the_brotherhood_desc:0 "The Brethren were Bedouin. Now Andalusi farmers, craftsmen and students ask to join them, and are welcomed as brothers."
 NSR_e_eyes_of_the_amir:0 "The Eyes of the Amir"
 NSR_e_eyes_of_the_amir_desc:0 "Dhaydan bin Hithlain builds the Amir a network of informers. Those who plotted for the Sultan will be found."
 NSR_e_heir_of_the_mutayr:0 "Heir of the Mutayr"
 NSR_e_heir_of_the_mutayr_desc:0 "Who will follow Faisal al-Dawish? The Shura will give its bay'ah, but the Amir's wish will weigh heavily."
 NSR_e_mudejar_villages:0 "The Mudéjar Villages"
 NSR_e_mudejar_villages_desc:0 "North of the frontier, Muslim villages have lived under Spanish rule since the fifteenth century. The Emirate sends them letters, Qurans and an open invitation."
 NSR_e_shura_decides:0 "The Shura Decides"
 NSR_e_shura_decides_desc:0 "The Shura meets in full to weigh the Emirate's priorities: Tamkin, firmly establishing the state, or Jihad, the banner beyond the Sierra. Both are duties. The question is the order."
 NSR_e_tamkin_before_all:0 "Tamkin Before All"
 NSR_e_tamkin_before_all_desc:0 "\"Those who, if We establish them in the land, establish prayer and give zakat\" (Quran 22:41). First the land must be firmly theirs."
 NSR_e_dhaydans_counsel:0 "Dhaydan's Counsel on the Diwan"
 NSR_e_dhaydans_counsel_desc:0 "Dhaydan bin Hithlain, sheikh of the Ajman, has seen how Ibn Saud's court works. He tells the Amir what to copy and what to avoid."
 NSR_e_fatwa_on_treaties:0 "The Fatwa on Treaties"
 NSR_e_fatwa_on_treaties_desc:0 "The ulama rule that treaties with non-Muslim powers are lawful when they serve the Muslims, as the ulama of Najd ruled for Ibn Saud and the British."
 NSR_e_revenue_beyond_zakat:0 "Revenue Beyond Zakat"
 NSR_e_revenue_beyond_zakat_desc:0 "Zakat alone cannot pay for a state. The ulama allow the customs of the ports, the rents of confiscated lands and the fifth of the spoils."
 NSR_e_diwan_that_works:0 "A Diwan That Works"
 NSR_e_diwan_that_works_desc:0 "Ledgers balanced, salaries paid, letters answered within the week."
 NSR_e_envoys_of_the_emirate:0 "Envoys of the Emirate"
 NSR_e_envoys_of_the_emirate_desc:0 "The Emirate sends its first ambassadors abroad."
 NSR_e_codify_the_sharia:0 "Codify the Sharia"
 NSR_e_codify_the_sharia_desc:0 "A single printed code for every court, on the model of the Ottoman Majalla."
 NSR_e_keep_the_andalusi_clerks:0 "Keep the Andalusi Clerks"
 NSR_e_keep_the_andalusi_clerks_desc:0 "The clerks who served the Sultan know the tax rolls and the land registers. Those who give their bay'ah keep their desks."
 NSR_e_muslim_technicians:0 "Muslim Technicians from Cairo and Lahore"
 NSR_e_muslim_technicians_desc:0 "Engineers, doctors and surveyors are recruited from the Muslim world, with good salaries and a house in Granada."
 NSR_e_emirate_for_all_believers:0 "An Emirate for All Believers"
 NSR_e_emirate_for_all_believers_desc:0 "Any Muslim who gives his bay'ah is a full subject of the Emirate: Bedouin, Andalusi, Moroccan or Indian."
 NSR_e_house_of_al_dawish:0 "The House of al-Dawish"
 NSR_e_house_of_al_dawish_desc:0 "The Mutayr have led the Brethren since al-Artawiyah. The family of al-Dawish will lead the Emirate, with the Shura's consent."
 NSR_e_granaries_and_garrisons:0 "Granaries and Garrisons"
 NSR_e_granaries_and_garrisons_desc:0 "Every town of the Emirate gets a granary for the lean years and a walled garrison for the bad ones."
 NSR_e_emirate_firmly_established:0 "The Emirate Firmly Established"
 NSR_e_emirate_firmly_established_desc:0 "The Ikhwani Emirate is a state among states. Ibn Saud said the Brethren could only destroy. They have built."
 NSR_e_banner_raised:0 "The Banner Raised"
 NSR_e_banner_raised_desc:0 "\"Fight in the path of God those who fight you, but do not transgress\" (Quran 2:190). The Spaniards have not forgotten Granada, and neither have the Brethren."
 NSR_e_bin_bajad_commander:0 "Sultan bin Bajad, Commander of the Ghazu"
 NSR_e_bin_bajad_commander_desc:0 "The sheikh of the Utaybah, who led the Brethren into Taif and Mecca, commands the Emirate's raiding columns."
 NSR_e_ministry_of_war:0 "A Ministry of War"
 NSR_e_ministry_of_war_desc:0 "The Brethren fought without a general staff in Najd, and lost at Sabilla. They will not make that mistake twice."
 NSR_e_hijras_as_barracks:0 "The Hijras as Barracks"
 NSR_e_hijras_as_barracks_desc:0 "As at al-Artawiyah, every settlement is also a garrison. The farmers drill after the dawn prayer."
 NSR_e_jaysh_al_ikhwan_joined:0 "Jaysh al-Ikhwan Joined to the Army"
 NSR_e_jaysh_al_ikhwan_joined_desc:0 "The tribal levies of the Brethren and the regiments of the old army become one army under one command."
 NSR_e_mobilisation_of_believers:0 "Mobilisation of the Believers"
 NSR_e_mobilisation_of_believers_desc:0 "Every Muslim man of fighting age is registered at his mosque."
 NSR_e_every_muhajir_a_mujahid:0 "Every Muhajir a Mujahid"
 NSR_e_every_muhajir_a_mujahid_desc:0 "The muhajirun came for the Sharia. Those of age will also defend it."
 NSR_e_mutawwa_with_the_army:0 "The Mutawwa with the Army"
 NSR_e_mutawwa_with_the_army_desc:0 "Religious instructors march with every battalion."
 NSR_e_war_chest:0 "The War Chest of the Bayt al-Mal"
 NSR_e_war_chest_desc:0 "The Bayt al-Mal buys machine tools, and the Brethren build an arsenal in the Vega."
 NSR_e_guardians_of_the_frontier:0 "Guardians of the Frontier"
 NSR_e_guardians_of_the_frontier_desc:0 "The passes of the Sierra Morena and the road to Córdoba are watched day and night."
 NSR_e_no_peace_with_the_reconquista:0 "No Peace with the Reconquista"
 NSR_e_no_peace_with_the_reconquista_desc:0 "Castile took Córdoba, Sevilla and Toledo. The Brethren will not sign away a single mosque of al-Andalus."
 NSR_e_eternal_jihad:0 "The Brethren Who Obey God"
 NSR_e_eternal_jihad_desc:0 "The old name of the movement, Ikhwan man ta'a Allah, becomes the oath of every soldier of the Emirate."
 NSR_e_banner_unfurled:0 "The Banner Unfurled"
 NSR_e_banner_unfurled_desc:0 "The Shura has decided, the Amir has ordered and the hijras have sent their sons. The Brethren are ready."
 NSR_e_amir_consults:0 "The Amir Consults"
 NSR_e_amir_consults_desc:0 "\"And consult them in the matter; and when you have decided, rely on God\" (Quran 3:159). The Amir holds the Shura in balance, and its decisions are his."
 NSR_e_one_brotherhood:0 "One Brotherhood, One Banner"
 NSR_e_one_brotherhood_desc:0 "Tamkin and Jihad are two hands of one body. The Brethren who were broken at Sabilla are whole again."
 NSR_e_establish_tawhid:0 "Establish Tawhid"
 NSR_e_establish_tawhid_desc:0 "There is no god but God. Worship, supplication, vows and sacrifice belong to Him alone. This is the whole of the Brethren's creed."
 NSR_e_council_of_the_ulama:0 "The Council of the Ulama"
 NSR_e_council_of_the_ulama_desc:0 "The ulama of the Brethren and those Andalusi scholars who accept the creed form one council, whose fatwas bind the Emirate."
 NSR_e_one_friday_sermon:0 "One Friday Sermon"
 NSR_e_one_friday_sermon_desc:0 "Every minbar of the Emirate receives the same sermon each week."
 NSR_e_kitab_al_tawhid:0 "Kitab al-Tawhid in Every Hijra"
 NSR_e_kitab_al_tawhid_desc:0 "Muhammad ibn Abd al-Wahhab's Book of Monotheism is printed in Granada and read aloud in every settlement."
 NSR_e_dar_al_ifta:0 "Dar al-Ifta of Granada"
 NSR_e_dar_al_ifta_desc:0 "A house of fatwas for the whole Emirate. Its rulings bind every qadi, which raises the question of the Maliki qadis."
 NSR_e_mosques_for_the_hijras:0 "Mosques for the Hijras"
 NSR_e_mosques_for_the_hijras_desc:0 "Every new settlement is built around its mosque, as at al-Artawiyah."
 NSR_e_imams_appointed:0 "Imams Appointed by the Council"
 NSR_e_imams_appointed_desc:0 "No man leads the prayer in a mosque of the Emirate without the Council's licence."
 NSR_e_three_fundamentals:0 "The Three Fundamentals in the Kuttabs"
 NSR_e_three_fundamentals_desc:0 "Every child learns the three questions of the grave: Who is your Lord? What is your religion? Who is your Prophet?"
 NSR_e_remove_shirk:0 "Remove Shirk"
 NSR_e_remove_shirk_desc:0 "The decree of the Amir: nothing is to be worshipped, invoked or venerated beside God. Buildings that serve that purpose will come down. No one is to be harmed."
 NSR_e_the_qubbas_come_down:0 "The Qubbas Come Down"
 NSR_e_the_qubbas_come_down_desc:0 "The domed tombs of the saints are the first to go, beginning with those in the Vega of Granada."
 NSR_e_end_veneration_of_saints:0 "An End to the Veneration of Saints"
 NSR_e_end_veneration_of_saints_desc:0 "The saints were pious men. Asking them for help after their deaths is what the Brethren came to end."
 NSR_e_against_amulets:0 "Against Amulets and Talismans"
 NSR_e_against_amulets_desc:0 "Charms against the evil eye are collected and burnt in the squares. The preachers explain the Prophet's words: \"Whoever hangs up an amulet has committed shirk.\""
 NSR_e_no_mawlid:0 "No Mawlid"
 NSR_e_no_mawlid_desc:0 "The Prophet's birthday was not celebrated by his companions. The Council rules that the festival is an innovation."
 NSR_e_suppress_the_sufi_orders:0 "Suppress the Sufi Orders"
 NSR_e_suppress_the_sufi_orders_desc:0 "The orders are dissolved and their lodges closed. Their members pray in the mosques like any other Muslim."
 NSR_e_zawiyas_under_the_council:0 "Bring the Zawiyas Under the Council"
 NSR_e_zawiyas_under_the_council_desc:0 "The orders may keep their lodges if they close the tombs, drop the innovations and accept the Council's authority."
 NSR_e_lions_of_the_alhambra:0 "The Lions of the Alhambra"
 NSR_e_lions_of_the_alhambra_desc:0 "The Council of the Ulama must rule on the twelve stone lions of the Alhambra's most famous fountain."
 NSR_e_nasrid_tombs:0 "The Nasrid Tombs"
 NSR_e_nasrid_tombs_desc:0 "The royal cemetery of the Nasrids lies within the Alhambra, under carved marble."
 NSR_e_religion_purified:0 "Religion Purified for God"
 NSR_e_religion_purified_desc:0 "The shrines are gone and the orders are silent or reformed. In al-Andalus prayer is directed to God alone."
 NSR_e_hisba_committees:0 "Committees for the Promotion of Virtue"
 NSR_e_hisba_committees_desc:0 "Committees for commanding the right and forbidding the wrong, as in Najd."
 NSR_e_mutawwa_corps:0 "The Mutawwa Corps"
 NSR_e_mutawwa_corps_desc:0 "The religious police of the hijras become a corps of the state, paid, uniformed and answerable to the qadis."
 NSR_e_prayer_in_congregation:0 "Prayer in Congregation"
 NSR_e_prayer_in_congregation_desc:0 "At the call to prayer the shops close and the men go to the mosque."
 NSR_e_close_the_taverns:0 "Close the Taverns"
 NSR_e_close_the_taverns_desc:0 "The taverns of Málaga and Cádiz, which served sailors and Christians, are closed. The wine trade collapses."
 NSR_e_tobacco_ban:0 "The Tobacco Ban"
 NSR_e_tobacco_ban_desc:0 "In Najd the Brethren would not sit with a smoker. In al-Andalus, the tobacco fields of the Vega will be burnt."
 NSR_e_markets_under_hisba:0 "The Markets Under Hisba"
 NSR_e_markets_under_hisba_desc:0 "The muhtasib, the market inspector of the old Islamic cities, returns: honest weights, no usury and no hoarding."
 NSR_e_against_idle_amusements:0 "Against Idle Amusements"
 NSR_e_against_idle_amusements_desc:0 "The cinemas, dance halls and music cafés of the cities are closed."
 NSR_e_public_virtue:0 "Public Virtue"
 NSR_e_public_virtue_desc:0 "The Hisba committees are no longer needed in most towns. Virtue has become habit."
 NSR_e_question_of_innovations:0 "The Question of Innovations"
 NSR_e_question_of_innovations_desc:0 "In 1927 the Brethren called the telegraph and the motor car the work of the devil. The Council of the Ulama must now distinguish innovation in religion from new things in the world."
 NSR_e_voice_in_the_wire:0 "The Voice in the Wire"
 NSR_e_voice_in_the_wire_desc:0 "The Amir will have the Quran recited over the telegraph, as Ibn Saud did."
 NSR_e_printing_the_kitab:0 "Printing the Kitab"
 NSR_e_printing_the_kitab_desc:0 "The printing press of the Nasrid court now prints the books of the Brethren."
 NSR_e_machines_are_not_sorcery:0 "Machines Are Not Sorcery"
 NSR_e_machines_are_not_sorcery_desc:0 "Trucks, tractors and pumps are tools, and tools are lawful."
 NSR_e_radio_al_hijra:0 "Radio al-Hijra"
 NSR_e_radio_al_hijra_desc:0 "A wireless station on the Alhambra hill broadcasts the Quran, the sermons and the news of the Emirate across the Strait."
 NSR_e_knowledge_in_service_of_tawhid:0 "Knowledge in the Service of Tawhid"
 NSR_e_knowledge_in_service_of_tawhid_desc:0 "\"Say: are those who know equal to those who do not know?\" (Quran 39:9)"
 NSR_e_status_of_christians_and_jews:0 "The Status of the Christians and Jews"
 NSR_e_status_of_christians_and_jews_desc:0 "Some two hundred thousand Christians and Jews live in the Emirate. They are People of the Book, but what their dhimma will mean in practice is not yet decided."
 NSR_e_covenant_of_umar:0 "The Covenant of Umar"
 NSR_e_covenant_of_umar_desc:0 "Strict dhimma on the classical terms: the jizya, no new churches or synagogues, no bells and no processions."
 NSR_e_protected_peoples:0 "The Protected Peoples"
 NSR_e_protected_peoples_desc:0 "Dhimma with written guarantees. The jizya is paid, but lives, property, churches and synagogues are under the Amir's own protection."
 NSR_e_jizya_treasury:0 "The Jizya Treasury"
 NSR_e_jizya_treasury_desc:0 "The jizya is paid into a separate treasury and spent on the roads and walls of the Emirate."
 NSR_e_merchant_quarters:0 "The Merchant Quarters"
 NSR_e_merchant_quarters_desc:0 "The Christian and Jewish merchant houses of Málaga are chartered and protected, and trade follows."
 NSR_e_order_of_the_faith:0 "The Order of the Faith"
 NSR_e_order_of_the_faith_desc:0 "Muslims, Christians and Jews each know their rights and duties under the Sharia."
 NSR_e_missionaries_to_the_maghreb:0 "Missionaries to the Maghreb"
 NSR_e_missionaries_to_the_maghreb_desc:0 "Preachers cross the Strait to Tetouan, Tangier and Fez."
 NSR_e_sahel_caravans:0 "The Sahel Caravans"
 NSR_e_sahel_caravans_desc:0 "Books and preachers follow the old caravan routes south to Timbuktu and Kano."
 NSR_e_road_to_mecca:0 "The Road to Mecca"
 NSR_e_road_to_mecca_desc:0 "The Emirate asks Riyadh for an agreement for its pilgrims. Ibn Saud and Faisal al-Dawish have not spoken since Sabilla."
 NSR_e_the_great_hijrah:0 "The Great Hijrah"
 NSR_e_the_great_hijrah_desc:0 "\"Whoever emigrates for the cause of God will find on the earth many places of refuge and abundance\" (Quran 4:100). The Emirate calls every Muslim who wants to live under the Sharia."
 NSR_e_welcome_houses:0 "Welcome Houses at Málaga and Cádiz"
 NSR_e_welcome_houses_desc:0 "Hostels at the ports give every muhajir bread, a bed and a guide for his first week."
 NSR_e_bayt_al_mal_of_the_emirate:0 "The Bayt al-Mal of the Emirate"
 NSR_e_bayt_al_mal_of_the_emirate_desc:0 "The treasury of the Brethren becomes the treasury of the state."
 NSR_e_sharia_courts:0 "Sharia Courts of the Emirate"
 NSR_e_sharia_courts_desc:0 "The Ikhwan qadi courts that once ran in parallel to the Sultan's courts are now the only courts."
 NSR_e_hijras_of_the_vega:0 "Hijras of the Vega"
 NSR_e_hijras_of_the_vega_desc:0 "New settlements on the irrigated plain of Granada."
 NSR_e_hijras_of_the_serrania:0 "Hijras of the Serranía"
 NSR_e_hijras_of_the_serrania_desc:0 "Muhajirun settle the mountain villages of the Serranía de Ronda, left empty by the war."
 NSR_e_zakat_as_law:0 "Zakat as the Law of the Land"
 NSR_e_zakat_as_law_desc:0 "The zakat is collected by the state, from every Muslim, on the terms of the Sharia."
 NSR_e_chief_qadi:0 "The Chief Qadi"
 NSR_e_chief_qadi_desc:0 "A chief qadi in Granada hears appeals from every court of the Emirate."
 NSR_e_hijras_of_the_sierra_morena:0 "Hijras of the Sierra Morena"
 NSR_e_hijras_of_the_sierra_morena_desc:0 "Frontier settlements on the edge of the Emirate. The farmers are also its first line of defence."
 NSR_e_waqf_endowments:0 "Waqf Endowments"
 NSR_e_waqf_endowments_desc:0 "The endowments of the Nasrid mosques and madrasas are restored and placed under the Council of the Ulama."
 NSR_e_relief_from_the_bayt_al_mal:0 "Relief from the Bayt al-Mal"
 NSR_e_relief_from_the_bayt_al_mal_desc:0 "The poor, the widows and the orphans of the war are provided for."
 NSR_e_kuttab_in_every_village:0 "A Kuttab in Every Village"
 NSR_e_kuttab_in_every_village_desc:0 "Every village gets a Quran school where boys learn to read, write and count."
 NSR_e_muhajirun_from_the_maghreb:0 "Muhajirun from the Maghreb"
 NSR_e_muhajirun_from_the_maghreb_desc:0 "Riffians who fought with Abd el-Krim and students from Fez cross the Strait."
 NSR_e_muhajirun_from_egypt:0 "Muhajirun from Egypt and the Sudan"
 NSR_e_muhajirun_from_egypt_desc:0 "Young Azhar graduates come to teach in the new kuttabs."
 NSR_e_wells_and_acequias:0 "Wells and Acequias"
 NSR_e_wells_and_acequias_desc:0 "The old Moorish irrigation channels, the acequias, are cleared and new wells are dug for the hijras."
 NSR_e_madrasa_of_granada:0 "The Madrasa of Granada"
 NSR_e_madrasa_of_granada_desc:0 "The Madrasa Yusufiyya, founded in 1349, reopens as the school of the Emirate's ulama and clerks."
 NSR_e_muhajirun_from_india:0 "Muhajirun from India"
 NSR_e_muhajirun_from_india_desc:0 "Iqbal wrote of the mosque of Córdoba. Now young men from the Punjab come to see al-Andalus for themselves."
 NSR_e_muhajirun_from_najd:0 "Muhajirun from Najd"
 NSR_e_muhajirun_from_najd_desc:0 "Brethren who stayed in Arabia after Sabilla slip away from the King's oases to join their brothers."
 NSR_e_muhajirun_from_the_balkans:0 "Muhajirun from the Balkans"
 NSR_e_muhajirun_from_the_balkans_desc:0 "Bosnian and Albanian Muslims, many of them veterans of the Great War, come west."
 NSR_e_brothers_of_the_land:0 "Brothers of the Land"
 NSR_e_brothers_of_the_land_desc:0 "Muhajirun and Andalusi farmers share the land of the confiscated estates. Each hijra has its own fields."
 NSR_e_clinics_of_the_hijras:0 "Clinics of the Hijras"
 NSR_e_clinics_of_the_hijras_desc:0 "Doctors from Cairo and Istanbul open clinics in the settlements. Fewer children die in their first year."
 NSR_e_hijra_passport:0 "The Hijra Passport"
 NSR_e_hijra_passport_desc:0 "Every muhajir who gives his bay'ah is a subject of the Emirate on arrival."
 NSR_e_bedouin_settled:0 "The Bedouin Settled"
 NSR_e_bedouin_settled_desc:0 "The last Ikhwan families still living in tents move into stone houses. Their horses stay with the cavalry."
 NSR_e_census_of_the_believers:0 "Census of the Believers"
 NSR_e_census_of_the_believers_desc:0 "The first census of the Emirate counts every household."
 NSR_e_dar_al_hijra:0 "Dar al-Hijra"
 NSR_e_dar_al_hijra_desc:0 "The Abode of Emigration. Al-Andalus is where Muslims come to live under the Sharia, from every land."
 NSR_e_treasury_of_the_brethren:0 "The Treasury of the Brethren"
 NSR_e_treasury_of_the_brethren_desc:0 "The estates of the court families who fled with the Sultan are confiscated. Their rents now pay for the Emirate."
 NSR_e_land_to_the_hijras:0 "Land to the Hijras"
 NSR_e_land_to_the_hijras_desc:0 "The confiscated estates are divided among the hijras. Each settlement farms its own land."
 NSR_e_austerity_of_believers:0 "The Austerity of the Believers"
 NSR_e_austerity_of_believers_desc:0 "No luxuries until the Emirate stands on its own feet."
 NSR_e_roads_through_the_sierra:0 "Roads Through the Sierra"
 NSR_e_roads_through_the_sierra_desc:0 "Mule tracks become roads that a truck can drive."
 NSR_e_olive_and_wheat:0 "Olive and Wheat"
 NSR_e_olive_and_wheat_desc:0 "The terraces of the Alpujarras and the plains of the Vega are replanted with the crops that feed people."
 NSR_e_irrigating_the_vega:0 "Irrigating the Vega"
 NSR_e_irrigating_the_vega_desc:0 "The Nasrid acequias are cleared and extended. Water reaches fields that have been dry for a century."
 NSR_e_civilian_industry_1:0 "Civilian Industry I"
 NSR_e_civilian_industry_1_desc:0 "Textile mills, tanneries and flour mills for the Emirate."
 NSR_e_arms_workshops_of_the_hijras:0 "Arms Workshops of the Hijras"
 NSR_e_arms_workshops_of_the_hijras_desc:0 "Every large hijra gets a gunsmith's workshop, and the best of them become a small arsenal in the Vega."
 NSR_e_mines_of_the_alpujarras:0 "The Mines of the Alpujarras"
 NSR_e_mines_of_the_alpujarras_desc:0 "The old lead and iron mines of the Sierra de Gádor are reopened."
 NSR_e_railways_of_the_emirate:0 "Railways of the Emirate"
 NSR_e_railways_of_the_emirate_desc:0 "The line from Granada to Málaga is double-tracked and a new line climbs to the hijras of the Alpujarras."
 NSR_e_from_tobacco_to_wheat:0 "From Tobacco to Wheat"
 NSR_e_from_tobacco_to_wheat_desc:0 "The burnt tobacco fields of the Vega are sown with wheat."
 NSR_e_dams_of_the_sierra_nevada:0 "Dams of the Sierra Nevada"
 NSR_e_dams_of_the_sierra_nevada_desc:0 "Snowmelt from the Sierra Nevada turns turbines as well as mill wheels."
 NSR_e_civilian_industry_2:0 "Civilian Industry II"
 NSR_e_civilian_industry_2_desc:0 "Cement works, a glass factory and a truck assembly shop."
 NSR_e_military_industry_1:0 "Military Industry I"
 NSR_e_military_industry_1_desc:0 "The first real arms factory of the Emirate."
 NSR_e_copper_of_the_sierra:0 "The Copper of the Sierra"
 NSR_e_copper_of_the_sierra_desc:0 "The copper and iron pyrites of Riotinto, in the hills north of Huelva, have been mined since the Phoenicians."
 NSR_e_malaga_yards:0 "The Málaga Yards"
 NSR_e_malaga_yards_desc:0 "The shipyard of Málaga is re-equipped to build and repair steel ships."
 NSR_e_salt_and_tuna_of_cadiz:0 "Salt and Tuna of Cádiz"
 NSR_e_salt_and_tuna_of_cadiz_desc:0 "The salt pans of the bay and the tuna traps of the almadrabas are as old as Gades. Their profits go to the Bayt al-Mal."
 NSR_e_sevilla_workshops:0 "The Sevilla Workshops"
 NSR_e_sevilla_workshops_desc:0 "The Fábrica de Artillería of Sevilla casts guns again."
 NSR_e_military_industry_2:0 "Military Industry II"
 NSR_e_military_industry_2_desc:0 "Machine tools from Italy and Czechoslovakia equip two more arms factories."
 NSR_e_arsenal_of_cadiz:0 "The Arsenal of Cádiz"
 NSR_e_arsenal_of_cadiz_desc:0 "The old naval arsenal of La Carraca builds ships for the Emirate."
 NSR_e_trade_only_with_believers:0 "Trade Only with Believers"
 NSR_e_trade_only_with_believers_desc:0 "The Emirate will depend on no unbeliever for its bread or its rifles."
 NSR_e_merchants_are_permitted:0 "The Merchants Are Permitted"
 NSR_e_merchants_are_permitted_desc:0 "The ulama rule that trade with non-Muslims is lawful, as the Prophet traded with them. The ports open."
 NSR_e_engineers_from_cairo:0 "Engineers from Cairo and Istanbul"
 NSR_e_engineers_from_cairo_desc:0 "Muslim engineers trained in Cairo and Istanbul come to build the Emirate's factories."
 NSR_e_stockpile_of_the_faithful:0 "The Stockpile of the Faithful"
 NSR_e_stockpile_of_the_faithful_desc:0 "Rifles, shells and field kit laid up in the caves of the Alpujarras for the day they are needed."
 NSR_e_muslim_trade_network:0 "A Muslim Trade Network"
 NSR_e_muslim_trade_network_desc:0 "Agents of the Bayt al-Mal in Alexandria, Istanbul, Jeddah and Basra buy what the Emirate needs from Muslim merchants."
 NSR_e_strait_tolls:0 "The Strait Tolls"
 NSR_e_strait_tolls_desc:0 "Every merchant ship that passes between the Pillars of Hercules pays the Emirate for the privilege."
 NSR_e_foreign_concessions:0 "Foreign Concessions"
 NSR_e_foreign_concessions_desc:0 "Foreign companies may mine and build in the Emirate, under its law and paying the Bayt al-Mal."
 NSR_e_technical_school:0 "The Technical School of Granada"
 NSR_e_technical_school_desc:0 "A school of engineering in the Madrasa quarter of Granada."
 NSR_e_military_industry_3:0 "Military Industry III"
 NSR_e_military_industry_3_desc:0 "The arsenal of the Vega builds field guns as well as rifles."
 NSR_e_war_economy:0 "The War Economy of the Emirate"
 NSR_e_war_economy_desc:0 "The Bayt al-Mal buys rifles before roads."
 NSR_e_italian_barter:0 "The Italian Barter"
 NSR_e_italian_barter_desc:0 "Olive oil and cork for Italian coal and machine parts. No gold changes hands."
 NSR_e_industry_of_jihad:0 "The Industry of Jihad"
 NSR_e_industry_of_jihad_desc:0 "\"And prepare against them whatever you are able of power\" (Quran 8:60)."
 NSR_e_ghazu_tradition:0 "The Ghazu Tradition"
 NSR_e_ghazu_tradition_desc:0 "The Brethren learned war in the ghazu, the desert raid. It made them the terror of Arabia, until it met machine guns."
 NSR_e_raiders_to_regiments:0 "From Raiders to Regiments"
 NSR_e_raiders_to_regiments_desc:0 "Tribal war bands become numbered regiments with officers, pay books and drill."
 NSR_e_officer_academy:0 "The Officer Academy of Granada"
 NSR_e_officer_academy_desc:0 "Turkish instructors teach the sons of the sheikhs map reading, gunnery and staff work."
 NSR_e_lessons_of_sabilla:0 "The Lessons of Sabilla"
 NSR_e_lessons_of_sabilla_desc:0 "Machine guns and motorcars beat the Brethren at Sabilla. The Emirate will have them too."
 NSR_e_white_turban_cavalry:0 "White Turban Cavalry"
 NSR_e_white_turban_cavalry_desc:0 "The horsemen of the Brethren, in white turbans, with the green banner."
 NSR_e_horses_of_the_vega:0 "Horses of the Vega"
 NSR_e_horses_of_the_vega_desc:0 "The Nasrid stud farms breed remounts for the cavalry."
 NSR_e_scouts_of_the_sierra:0 "Scouts of the Sierra"
 NSR_e_scouts_of_the_sierra_desc:0 "Mounted scouts who know every path in the mountains."
 NSR_e_ghazu_cavalry_corps:0 "The Ghazu Cavalry Corps"
 NSR_e_ghazu_cavalry_corps_desc:0 "Two brigades of the Brethren's cavalry, trained to raid deep behind the enemy's lines."
 NSR_e_mountain_warriors:0 "Mountain Warriors of the Alpujarras"
 NSR_e_mountain_warriors_desc:0 "The men of the mountain hijras fight best where the ground is steep."
 NSR_e_sierra_doctrine:0 "The Sierra Doctrine"
 NSR_e_sierra_doctrine_desc:0 "Defend the passes, strike from the heights and never fight on the plain if you can avoid it."
 NSR_e_commandos_of_the_sierra:0 "Commandos of the Sierra"
 NSR_e_commandos_of_the_sierra_desc:0 "Hand-picked men for raids behind the lines."
 NSR_e_mule_trains:0 "Mule Trains and Supply"
 NSR_e_mule_trains_desc:0 "Where the trucks stop, the mules go on."
 NSR_e_zeal_of_the_brethren:0 "The Zeal of the Brethren"
 NSR_e_zeal_of_the_brethren_desc:0 "The Brethren do not fear death. The Emirate teaches them to fear disorder."
 NSR_e_infantry_of_the_hijras:0 "Infantry of the Hijras"
 NSR_e_infantry_of_the_hijras_desc:0 "Not every believer can ride. The hijras raise infantry regiments."
 NSR_e_army_muhajirun_battalions:0 "Muhajirun Battalions"
 NSR_e_army_muhajirun_battalions_desc:0 "The muhajirun who came to fight are formed into their own battalions."
 NSR_e_conscription_of_believers:0 "Conscription of the Believers"
 NSR_e_conscription_of_believers_desc:0 "Every Muslim man serves two years."
 NSR_e_veterans_of_sabilla:0 "Veterans of Sabilla"
 NSR_e_veterans_of_sabilla_desc:0 "The survivors of Sabilla train an elite division: horse and foot together, as they should have fought in 1929."
 NSR_e_sheikhs_into_officers:0 "Sheikhs into Officers"
 NSR_e_sheikhs_into_officers_desc:0 "The sheikhs who led their tribes now hold commissions and learn to lead battalions."
 NSR_e_general_staff:0 "The General Staff of the Emirate"
 NSR_e_general_staff_desc:0 "Maps, plans, depots and a chain of command."
 NSR_e_discipline_of_the_brethren:0 "The Discipline of the Brethren"
 NSR_e_discipline_of_the_brethren_desc:0 "At Sabilla the Brethren broke. They will not break again."
 NSR_e_hisba_in_the_ranks:0 "Hisba in the Ranks"
 NSR_e_hisba_in_the_ranks_desc:0 "Military police of the Mutawwa keep order on the march and in the camps."
 NSR_e_machine_guns_of_the_brethren:0 "Machine Guns of the Brethren"
 NSR_e_machine_guns_of_the_brethren_desc:0 "Every company gets its machine gun section."
 NSR_e_motorised_ghazu:0 "The Motorised Ghazu"
 NSR_e_motorised_ghazu_desc:0 "The raid in trucks: Ibn Saud used Fords against the Brethren. Now the Brethren have their own."
 NSR_e_armoured_cars:0 "Armoured Cars of the Emirate"
 NSR_e_armoured_cars_desc:0 "The armoured cars that shot down the Brethren at Sabilla are now built in the Vega."
 NSR_e_iron_camels:0 "Iron Camels"
 NSR_e_iron_camels_desc:0 "A small tank programme. The Brethren call the tanks \"iron camels\"."
 NSR_e_artillery_is_not_bidah:0 "Artillery Is Not Bid'ah"
 NSR_e_artillery_is_not_bidah_desc:0 "The ulama rule that guns, like swords and bows, are tools of jihad."
 NSR_e_anti_tank_companies:0 "Anti-Tank Companies"
 NSR_e_anti_tank_companies_desc:0 "Every regiment gets guns that can stop an armoured car."
 NSR_e_guns_against_the_sky:0 "Guns Against the Sky"
 NSR_e_guns_against_the_sky_desc:0 "Ibn Saud had British aeroplanes. The Emirate will have anti-aircraft guns."
 NSR_e_engineers_of_the_sierra:0 "Engineers of the Sierra"
 NSR_e_engineers_of_the_sierra_desc:0 "Sappers who can bridge a gorge or blow up a pass."
 NSR_e_fortify_the_sierra_morena:0 "Fortify the Sierra Morena"
 NSR_e_fortify_the_sierra_morena_desc:0 "Blockhouses and gun pits on every road into the Emirate."
 NSR_e_coastal_forts:0 "The Coastal Forts"
 NSR_e_coastal_forts_desc:0 "The old Nasrid watchtowers on the coast get modern guns."
 NSR_e_doctrine_of_the_ghazu:0 "The Doctrine of the Ghazu"
 NSR_e_doctrine_of_the_ghazu_desc:0 "Speed and depth: the ghazu fought with motor columns. (Makes the §YMobile Warfare§! grand doctrine cheaper and faster to master.)"
 NSR_e_doctrine_of_the_sierra:0 "The Doctrine of the Sierra"
 NSR_e_doctrine_of_the_sierra_desc:0 "The mountains are the Brethren's fortress. (Makes R56's §YGuerrilla Warfare§! grand doctrine cheaper and faster to master.)"
 NSR_e_doctrine_of_the_believers:0 "The Doctrine of the Believers"
 NSR_e_doctrine_of_the_believers_desc:0 "Numbers and faith. (Makes the §YMass Assault§! grand doctrine cheaper and faster to master.)"
 NSR_e_army_of_al_andalus:0 "The Army of al-Andalus"
 NSR_e_army_of_al_andalus_desc:0 "Bedouin cavalry, Andalusi infantry and muhajirun volunteers: one army."
 NSR_e_we_have_no_sailors:0 "We Have No Sailors"
 NSR_e_we_have_no_sailors_desc:0 "The Brethren are men of the desert, and most of the Sultan's sailors went with the loyalists. The Emirate must build a navy almost from nothing."
 NSR_e_win_over_the_cadiz_crews:0 "Win Over the Cádiz Crews"
 NSR_e_win_over_the_cadiz_crews_desc:0 "The sailors of Cádiz are offered pardon, pay and a place in the Emirate's navy."
 NSR_e_heirs_of_the_corsairs:0 "Heirs of the Corsairs"
 NSR_e_heirs_of_the_corsairs_desc:0 "The corsairs of Salé and Algiers once raided as far as Iceland. The Emirate claims their tradition."
 NSR_e_naval_base_malaga:0 "Naval Base Málaga"
 NSR_e_naval_base_malaga_desc:0 "Málaga's harbour gets new moles, cranes and fuel tanks."
 NSR_e_fishermen_as_reserve:0 "Fishermen as Reserve"
 NSR_e_fishermen_as_reserve_desc:0 "The fishermen of the coast are registered as naval reservists."
 NSR_e_coastal_flotillas:0 "Coastal Flotillas"
 NSR_e_coastal_flotillas_desc:0 "Torpedo boats and gunboats for the coast."
 NSR_e_almeria_anchorage:0 "Almería Anchorage"
 NSR_e_almeria_anchorage_desc:0 "A forward anchorage on the eastern coast, facing Cartagena."
 NSR_e_naval_base_cadiz:0 "Naval Base Cádiz"
 NSR_e_naval_base_cadiz_desc:0 "Cádiz, the finest harbour of the south, becomes the Emirate's main fleet base."
 NSR_e_naval_academy:0 "The Naval Academy"
 NSR_e_naval_academy_desc:0 "Cadets from the fishing villages learn navigation and gunnery."
 NSR_e_mines_in_the_strait:0 "Mines in the Strait"
 NSR_e_mines_in_the_strait_desc:0 "The cheapest navy in the world."
 NSR_e_submarines_of_tariq:0 "The Submarines of Tariq"
 NSR_e_submarines_of_tariq_desc:0 "Tariq ibn Ziyad crossed the Strait in 711. The Emirate's submarines will guard it."
 NSR_e_coastal_artillery:0 "Coastal Artillery"
 NSR_e_coastal_artillery_desc:0 "Heavy guns on the headlands of Cádiz and Málaga."
 NSR_e_marines_of_the_emirate:0 "Marines of the Emirate"
 NSR_e_marines_of_the_emirate_desc:0 "Infantry trained to land from the sea."
 NSR_e_convoy_escorts:0 "Convoy Escorts"
 NSR_e_convoy_escorts_desc:0 "Escorts for the grain ships from the Maghreb."
 NSR_e_destroyer_programme:0 "Destroyer Programme"
 NSR_e_destroyer_programme_desc:0 "The Málaga yards lay down the Emirate's first destroyers."
 NSR_e_raiding_doctrine:0 "The Raiding Doctrine"
 NSR_e_raiding_doctrine_desc:0 "Take the merchantmen, avoid the battleships."
 NSR_e_landing_craft:0 "Landing Craft for the Two Shores"
 NSR_e_landing_craft_desc:0 "Enough boats to put a Liwa ashore across the Strait."
 NSR_e_sonar_and_radar:0 "Sonar and Radar"
 NSR_e_sonar_and_radar_desc:0 "Listening gear and radio-location sets for the fleet."
 NSR_e_light_cruiser:0 "A Light Cruiser"
 NSR_e_light_cruiser_desc:0 "One light cruiser to lead the flotillas."
 NSR_e_eyes_over_the_strait:0 "Eyes over the Strait"
 NSR_e_eyes_over_the_strait_desc:0 "Seaplanes and patrol aircraft watch every ship that enters the Strait."
 NSR_e_close_the_strait:0 "Close the Strait"
 NSR_e_close_the_strait_desc:0 "Guns on both shores, mines in the channel and submarines in the approaches."
 NSR_e_fleet_of_the_strait:0 "The Fleet of the Strait"
 NSR_e_fleet_of_the_strait_desc:0 "A small navy that knows every current between Cádiz and Almería."
 NSR_e_machines_of_the_air:0 "Machines of the Air"
 NSR_e_machines_of_the_air_desc:0 "The old question again: are aeroplanes lawful? If the Council has already ruled that machines are not sorcery, the answer is easy."
 NSR_e_heirs_of_ibn_firnas:0 "Heirs of Ibn Firnas"
 NSR_e_heirs_of_ibn_firnas_desc:0 "Abbas ibn Firnas of Córdoba flew with feathered wings in the ninth century."
 NSR_e_buy_italian_aircraft:0 "Buy Italian Aircraft"
 NSR_e_buy_italian_aircraft_desc:0 "Fiat and Breda sell to anyone who pays in olive oil and pesetas."
 NSR_e_buy_german_aircraft:0 "Buy German Aircraft"
 NSR_e_buy_german_aircraft_desc:0 "Junkers and Heinkel are eager for export orders."
 NSR_e_buy_british_aircraft:0 "Buy British Aircraft"
 NSR_e_buy_british_aircraft_desc:0 "Hawker and Bristol will sell, if London agrees."
 NSR_e_flight_school_of_malaga:0 "The Flight School of Málaga"
 NSR_e_flight_school_of_malaga_desc:0 "Pilots are trained over the sea at Málaga."
 NSR_e_airfields_of_the_vega:0 "Airfields of the Vega"
 NSR_e_airfields_of_the_vega_desc:0 "Grass strips become paved runways."
 NSR_e_pilots_from_egypt_and_turkey:0 "Pilots from Egypt and Turkey"
 NSR_e_pilots_from_egypt_and_turkey_desc:0 "Muslim pilots trained in Cairo and Eskişehir come to fly for the Emirate."
 NSR_e_a_fighter_wing:0 "A Fighter Wing"
 NSR_e_a_fighter_wing_desc:0 "The Emirate's first fighter wing guards Granada."
 NSR_e_aircraft_workshops:0 "Aircraft Workshops"
 NSR_e_aircraft_workshops_desc:0 "A workshop in the Vega assembles and repairs aircraft."
 NSR_e_cas_for_the_sierra:0 "Close Air Support for the Sierra"
 NSR_e_cas_for_the_sierra_desc:0 "Dive bombers that can find a gun pit in a mountain pass."
 NSR_e_air_defence_of_granada:0 "The Air Defence of Granada"
 NSR_e_air_defence_of_granada_desc:0 "Guns and fighters to keep bombers away from the Alhambra."
 NSR_e_naval_bombers_over_the_strait:0 "Naval Bombers over the Strait"
 NSR_e_naval_bombers_over_the_strait_desc:0 "Torpedo bombers to strike at any fleet that enters the Strait."
 NSR_e_a_few_bombers:0 "A Few Bombers"
 NSR_e_a_few_bombers_desc:0 "A handful of twin-engined bombers."
 NSR_e_radar:0 "Radar"
 NSR_e_radar_desc:0 "Radio-location stations on the Sierra Nevada see aircraft long before they reach Granada."
 NSR_e_air_doctrine:0 "Air Doctrine of the Emirate"
 NSR_e_air_doctrine_desc:0 "Support the army first. (Makes the §YBattlefield Support§! air grand doctrine cheaper and faster to master.)"
 NSR_e_wings_of_the_emirate:0 "Wings of the Emirate"
 NSR_e_wings_of_the_emirate_desc:0 "The Emirate has an air force of its own."
 NSR_e_question_of_recognition:0 "The Question of Recognition"
 NSR_e_question_of_recognition_desc:0 "No government has recognised the Emirate. Its envoys must go out."
 NSR_e_envoys_to_the_muslim_world:0 "Envoys to the Muslim World"
 NSR_e_envoys_to_the_muslim_world_desc:0 "Envoys to Cairo, Baghdad, Sanaa, Kabul and Tehran."
 NSR_e_reconcile_with_ibn_saud:0 "Reconcile with Ibn Saud"
 NSR_e_reconcile_with_ibn_saud_desc:0 "Send an envoy to Riyadh: brothers in the religion, with the sea between us. If the King agrees, the extradition feud is over."
 NSR_e_vendetta_against_riyadh:0 "The Vendetta Against Riyadh"
 NSR_e_vendetta_against_riyadh_desc:0 "Ibn Saud had the Brethren shot down at Sabilla and demands the Amir's head to this day. There will be no peace with him."
 NSR_e_cairo_and_al_azhar:0 "Cairo and al-Azhar"
 NSR_e_cairo_and_al_azhar_desc:0 "The sheikhs of al-Azhar have condemned Wahhabism for a century. The Emirate sends its best scholars to debate them rather than insult them."
 NSR_e_hashemite_enemies:0 "The Hashemite Enemies"
 NSR_e_hashemite_enemies_desc:0 "The Ikhwan raided Transjordan and Iraq in the 1920s and drove the Hashemites out of Mecca. Baghdad and Amman have not forgotten, and neither have the Brethren."
 NSR_e_hajj_agreement:0 "The Hajj Agreement"
 NSR_e_hajj_agreement_desc:0 "A treaty with Riyadh for the pilgrims of al-Andalus."
 NSR_e_kuwait_remembers_jahra:0 "Kuwait Remembers Jahra"
 NSR_e_kuwait_remembers_jahra_desc:0 "In 1920 Faisal al-Dawish attacked the Red Fort of Jahra, and failed."
 NSR_e_imam_of_yemen:0 "The Imam of Yemen"
 NSR_e_imam_of_yemen_desc:0 "Imam Yahya of Yemen is a Zaydi, not a Wahhabi, but he fought Ibn Saud in 1934 and understands the Emirate's grievance."
 NSR_e_ankaras_contempt:0 "Ankara's Contempt"
 NSR_e_ankaras_contempt_desc:0 "Atatürk abolished the caliphate and closed the Sufi lodges, and Turkish newspapers call the Emirate a museum of fanatics. The Brethren answer that Turkey has abolished much more than the caliphate."
 NSR_e_second_ikhwan_revolt:0 "The Second Ikhwan Revolt"
 NSR_e_second_ikhwan_revolt_desc:0 "The hijras of Artawiyah and Ghatghat are waiting for a signal."
 NSR_e_kabul_and_tehran:0 "Kabul and Tehran"
 NSR_e_kabul_and_tehran_desc:0 "Afghanistan is Sunni and Persia is Shia. The Emirate needs friends more than it needs agreement."
 NSR_e_caliphate_question:0 "The Caliphate Question"
 NSR_e_caliphate_question_desc:0 "The Ikhwan rejected Sharif Hussein's caliphate in 1924, and they reject the Ottoman claim too."
 NSR_e_muslim_congress_of_granada:0 "The Muslim Congress of Granada"
 NSR_e_muslim_congress_of_granada_desc:0 "A congress of the Muslim world, held in the Alhambra."
 NSR_e_imamate_of_the_believers:0 "The Imamate of the Believers"
 NSR_e_imamate_of_the_believers_desc:0 "Faisal al-Dawish is called Imam of those who make hijrah. Kings in Cairo, Baghdad and Riyadh will not like it."
 NSR_e_the_old_protector:0 "The Old Protector"
 NSR_e_the_old_protector_desc:0 "A quiet understanding with Britain: London leaves the Emirate alone, and the Emirate leaves Gibraltar alone."
 NSR_e_expel_the_infidel_from_the_strait:0 "Expel the Infidel from the Strait"
 NSR_e_expel_the_infidel_from_the_strait_desc:0 "Jabal Tariq, the Mountain of Tariq, is a British fortress. It will not always be."
 NSR_e_italys_offer:0 "Italy's Offer"
 NSR_e_italys_offer_desc:0 "Mussolini calls himself the Protector of Islam. His consul in Málaga has an offer."
 NSR_e_germanys_interest:0 "Germany's Interest"
 NSR_e_germanys_interest_desc:0 "Berlin is interested in anyone who controls a shore of the Strait."
 NSR_e_arms_purchases_abroad:0 "Arms Purchases Abroad"
 NSR_e_arms_purchases_abroad_desc:0 "Rifles from Belgium, machine guns from Czechoslovakia and shells from whoever will sell them."
 NSR_e_join_the_axis:0 "Join the Axis"
 NSR_e_join_the_axis_desc:0 "The Council of the Ulama has ruled that treaties with unbelievers are lawful when they serve the Muslims. Berlin and Rome are the enemies of London and Paris."
 NSR_e_no_alliance_with_infidels:0 "No Alliance with Unbelievers"
 NSR_e_no_alliance_with_infidels_desc:0 "The Emirate will trade with anyone and fight for no one but itself."
 NSR_e_dar_al_islam_pact:0 "The Dar al-Islam Pact"
 NSR_e_dar_al_islam_pact_desc:0 "An alliance of Muslim states, for mutual defence, led from Granada."
 NSR_e_spain_after_the_war:0 "Spain after the War"
 NSR_e_spain_after_the_war_desc:0 "Whoever wins in Spain will look south. The Shura decides how to meet them."
 NSR_e_france_and_the_maghreb:0 "France and the Maghreb"
 NSR_e_france_and_the_maghreb_desc:0 "France rules Algeria, Tunisia and most of Morocco. The Emirate will not pretend otherwise."
 NSR_e_volunteers_for_the_faithful:0 "Volunteers for the Faithful"
 NSR_e_volunteers_for_the_faithful_desc:0 "Wherever Muslims fight, the hijras send volunteers."
 NSR_e_letters_to_fez:0 "Letters to Fez"
 NSR_e_letters_to_fez_desc:0 "Allal al-Fassi and the Salafi nationalists of Fez write to Granada."
 NSR_e_sanusi_exiles:0 "The Sanusi Exiles"
 NSR_e_sanusi_exiles_desc:0 "Sayyid Idris al-Sanusi waits in Egypt for the day Italy leaves Cyrenaica."
 NSR_e_free_abd_el_krim:0 "Free Abd el-Krim"
 NSR_e_free_abd_el_krim_desc:0 "The hero of the Rif war has been a French prisoner on Réunion since 1926."
 NSR_e_voice_of_the_believers:0 "Voice of the Believers"
 NSR_e_voice_of_the_believers_desc:0 "The Emirate speaks for Muslims who have no state of their own."
 NSR_e_jihad_against_the_reconquista:0 "Jihad Against the Reconquista"
 NSR_e_jihad_against_the_reconquista_desc:0 "The Amir proclaims that the Reconquista is over, and that it failed."
 NSR_e_andalusi_levies:0 "The Andalusi Levies"
 NSR_e_andalusi_levies_desc:0 "Every village sends its young men to the frontier regiments."
 NSR_e_cordoba_of_the_caliphs:0 "Córdoba of the Caliphs"
 NSR_e_cordoba_of_the_caliphs_desc:0 "The city of Abd al-Rahman III, once the greatest in Europe, lies one day's march north of Granada."
 NSR_e_murcia_and_cartagena:0 "Murcia and Cartagena"
 NSR_e_murcia_and_cartagena_desc:0 "The naval base of Cartagena and the huerta of Murcia, the old Kingdom of Tudmir."
 NSR_e_frontier_hijras:0 "The Frontier Hijras"
 NSR_e_frontier_hijras_desc:0 "Settlements of muhajirun on the new frontier."
 NSR_e_jabal_tariq:0 "Jabal Tariq"
 NSR_e_jabal_tariq_desc:0 "Tariq ibn Ziyad landed under this rock in 711. The British have held it since 1704."
 NSR_e_tulaytula:0 "Tulaytula"
 NSR_e_tulaytula_desc:0 "Toledo, the first great city of al-Andalus to fall, in 1085."
 NSR_e_balansiya:0 "Balansiya"
 NSR_e_balansiya_desc:0 "Valencia, the city of the Cid, and of the Muslims before him."
 NSR_e_mayurqa:0 "Mayurqa"
 NSR_e_mayurqa_desc:0 "The Balearic Islands were Muslim until 1229."
 NSR_e_al_gharb:0 "Al-Gharb"
 NSR_e_al_gharb_desc:0 "The Algarve, al-Gharb al-Andalus, taken by Portugal in 1249."
 NSR_e_madrid_the_meseta:0 "Madrid and the Meseta"
 NSR_e_madrid_the_meseta_desc:0 "Madrid, which the Muslims founded as the fortress of Mayrit."
 NSR_e_saraqusta:0 "Saraqusta"
 NSR_e_saraqusta_desc:0 "Zaragoza, capital of the Banu Hud, lost in 1118."
 NSR_e_lands_long_lost:0 "Lands Long Lost"
 NSR_e_lands_long_lost_desc:0 "Where the hijras have taken root, the land is al-Andalus again."
 NSR_e_al_ushbuna:0 "Al-Ushbuna"
 NSR_e_al_ushbuna_desc:0 "Lisbon was Muslim until 1147."
 NSR_e_mountains_of_pelayo:0 "The Mountains of Pelayo"
 NSR_e_mountains_of_pelayo_desc:0 "The north has never been Muslim for long. It will resist."
 NSR_e_barcelona_and_the_march:0 "Barcelona and the March"
 NSR_e_barcelona_and_the_march_desc:0 "Barcelona was taken by the Muslims in 717 and lost in 801."
 NSR_e_reconquista_reversed:0 "The Reconquista Reversed"
 NSR_e_reconquista_reversed_desc:0 "Castile never finished what Ferdinand and Isabella began at the gates of Granada. Now Granada rules Madrid."
 NSR_e_al_andalus_restored:0 "Al-Andalus Restored"
 NSR_e_al_andalus_restored_desc:0 "From Tarifa to the Pyrenees, the land is called al-Andalus again."
 NSR_e_rif_remembers:0 "The Rif Remembers"
 NSR_e_rif_remembers_desc:0 "The Rifis beat Spain at Anual in 1921. Many of their sons have made hijrah to al-Andalus."
 NSR_e_moroccan_hijra:0 "The Moroccan Hijra"
 NSR_e_moroccan_hijra_desc:0 "Moroccans cross the Strait to the Emirate in their thousands."
 NSR_e_ceuta_and_melilla:0 "Ceuta and Melilla"
 NSR_e_ceuta_and_melilla_desc:0 "The Spanish presidios on the African shore, Spanish since the fifteenth century."
 NSR_e_tangier_question:0 "The Tangier Question"
 NSR_e_tangier_question_desc:0 "Tangier has been an international zone since 1923."
 NSR_e_maghreb_uprisings:0 "Maghreb Uprisings"
 NSR_e_maghreb_uprisings_desc:0 "Rifles for the tribes, before the invasion comes."
 NSR_e_a_salafi_maghreb:0 "A Salafi Maghreb"
 NSR_e_a_salafi_maghreb_desc:0 "Work with the Salafi reformers of Fez and Algiers, and close the zawiyas."
 NSR_e_a_maghreb_of_the_zawiyas:0 "A Maghreb of the Zawiyas"
 NSR_e_a_maghreb_of_the_zawiyas_desc:0 "Leave the Sufi lodges of the Maghreb open, under the Council of the Ulama."
 NSR_e_fez_and_marrakesh:0 "Fez and Marrakesh"
 NSR_e_fez_and_marrakesh_desc:0 "The old imperial cities of Morocco, under French rule since 1912."
 NSR_e_sidi_ifni_and_the_sahara:0 "Sidi Ifni and the Sahara"
 NSR_e_sidi_ifni_and_the_sahara_desc:0 "The Spanish Sahara and the enclave of Ifni."
 NSR_e_tlemcen_and_oran:0 "Tlemcen and Oran"
 NSR_e_tlemcen_and_oran_desc:0 "Tlemcen, the city of the Zayyanids, and the port of Oran, which Spain held for three centuries."
 NSR_e_algiers:0 "Algiers"
 NSR_e_algiers_desc:0 "Algiers, the old corsair capital, French since 1830."
 NSR_e_constantine:0 "Constantine"
 NSR_e_constantine_desc:0 "The city on the rock, which held out against France until 1837."
 NSR_e_tunis_and_kairouan:0 "Tunis and Kairouan"
 NSR_e_tunis_and_kairouan_desc:0 "Kairouan, the first Muslim city of the Maghreb, founded in 670."
 NSR_e_the_two_shores:0 "The Two Shores"
 NSR_e_the_two_shores_desc:0 "One Muslim state on both shores of the Strait, as under the Almohads."
 NSR_e_sea_road_to_the_east:0 "The Sea Road to the East"
 NSR_e_sea_road_to_the_east_desc:0 "Ships from Málaga to Alexandria and Jeddah carry pilgrims, letters and muhajirun."
 NSR_e_libya_and_the_sanusi:0 "Libya and the Sanusi"
 NSR_e_libya_and_the_sanusi_desc:0 "Italy has ruled Libya with gallows and concentration camps. The Sanusi want it back."
 NSR_e_road_to_najd:0 "The Road to Najd"
 NSR_e_road_to_najd_desc:0 "Letters and silver for the hijras of Najd."
 NSR_e_tribes_of_arabia:0 "The Tribes of Arabia"
 NSR_e_tribes_of_arabia_desc:0 "The Mutayr, the Otaibah and the Ajman have kin all over Arabia."
 NSR_e_nile_question:0 "The Nile Question"
 NSR_e_nile_question_desc:0 "Egypt, the heart of the Arab world, under British occupation. A very hard road."
 NSR_e_volunteers_of_najd:0 "Volunteers of Najd"
 NSR_e_volunteers_of_najd_desc:0 "Najdi muhajirun volunteer to fight for their brothers, or come to al-Andalus if the revolt fails."
 NSR_e_kuwait_frontier:0 "The Kuwait Frontier"
 NSR_e_kuwait_frontier_desc:0 "The frontier that Faisal al-Dawish raided in 1920 and 1928."
 NSR_e_brethren_reunited:0 "The Brethren Reunited"
 NSR_e_brethren_reunited_desc:0 "The Ikhwan of Najd and the exiles of al-Andalus under one banner."
 NSR_e_hashemite_reckoning:0 "The Hashemite Reckoning"
 NSR_e_hashemite_reckoning_desc:0 "Iraq, ruled by the sons of Sharif Hussein, whom the Ikhwan drove out of Mecca."
 NSR_e_al_hasa:0 "Al-Hasa"
 NSR_e_al_hasa_desc:0 "The eastern oasis and the coast of the Gulf, where the Americans have just found oil."
 NSR_e_pilgrim_road:0 "The Pilgrim Road"
 NSR_e_pilgrim_road_desc:0 "The great caravan of the Emirate sets out for Mecca."
 NSR_e_hejaz_and_the_holy_cities:0 "The Hejaz and the Holy Cities"
 NSR_e_hejaz_and_the_holy_cities_desc:0 "Mecca and Medina, which the Ikhwan took in 1924 and 1925 and handed to Ibn Saud."
 NSR_e_from_the_atlantic_to_najd:0 "From the Atlantic to Najd"
 NSR_e_from_the_atlantic_to_najd_desc:0 "The exiles of Sabilla have come home, and they have brought al-Andalus with them."
 NSR_majlis_of_the_sheikhs:0 "The Majlis of the Sheikhs"
 NSR_majlis_of_the_sheikhs_desc:0 "The sheikhs of the Mutayr, the Utaybah and the Ajman sit in the Hall of the Ambassadors, where the Nasrid sultans once received the envoys of Castile."
 NSR_diwan_of_the_amir:0 "The Diwan of the Amir"
 NSR_diwan_of_the_amir_desc:0 "A chancery for a Bedouin prince: scribes, seals and ledgers. The Amir's word now reaches the villages in writing."
 NSR_diwan_that_works:0 "A Diwan That Works"
 NSR_diwan_that_works_desc:0 "Letters are answered, salaries are paid on time and the qadis' rulings are carried out. The Emirate is becoming a state."
 NSR_imarates_of_al_andalus:0 "The Imarates of al-Andalus"
 NSR_imarates_of_al_andalus_desc:0 "Every province has its emir, answerable to the Amir. Most are sheikhs of the Brethren. Some are Andalusi notables who gave their bay'ah early."
 NSR_eyes_of_the_amir:0 "The Eyes of the Amir"
 NSR_eyes_of_the_amir_desc:0 "Nothing is said in the souqs of Granada that the Amir does not hear by evening."
 NSR_voice_of_the_hijras:0 "The Voice of the Hijras"
 NSR_voice_of_the_hijras_desc:0 "Preachers, poets and pamphlets carry the call of the Brethren from the mountain settlements to every town of al-Andalus."
 NSR_revenue_beyond_zakat:0 "Revenue Beyond Zakat"
 NSR_revenue_beyond_zakat_desc:0 "Customs at the ports, rents on the confiscated estates and the fifth of the spoils. The ulama have agreed these are lawful."
 NSR_codified_sharia:0 "The Codified Sharia"
 NSR_codified_sharia_desc:0 "One code, printed and bound, in every court of the Emirate. A qadi in Ronda now rules as a qadi in Granada would."
 NSR_kingdom_among_nations:0 "An Emirate Among the Nations"
 NSR_kingdom_among_nations_desc:0 "The Ikhwani Emirate is firmly established. Its envoys are received, its treaties are kept and its roads are safe. What Ibn Saud built in Najd, the Brethren have built in al-Andalus."
 NSR_hijras_as_barracks:0 "The Hijras as Barracks"
 NSR_hijras_as_barracks_desc:0 "In the settlements every farmer is a soldier. The plough by day and the rifle at dawn, as at al-Artawiyah."
 NSR_ministry_of_war:0 "A Ministry of War"
 NSR_ministry_of_war_desc:0 "For the first time the Brethren have a general staff, with maps, depots and a register of every man who can carry a rifle."
 NSR_mobilisation_of_believers:0 "Mobilisation of the Believers"
 NSR_mobilisation_of_believers_desc:0 "Every Muslim man of fighting age is registered at his mosque. The harvest will be thinner this year."
 NSR_mutawwa_with_the_army:0 "The Mutawwa with the Army"
 NSR_mutawwa_with_the_army_desc:0 "Religious instructors march with every battalion. They lead the prayers, keep the discipline and remind the men why they fight."
 NSR_brotherhood_unbound:0 "The Brotherhood Unbound"
 NSR_brotherhood_unbound_desc:0 "The banner of the Brethren is unfurled. The Shura has decided, the Amir has ordered, and every hijra has sent its sons."
 NSR_one_brotherhood:0 "One Brotherhood, One Banner"
 NSR_one_brotherhood_desc:0 "The Shura weighs Tamkin and Jihad, and each has its season. The Amir consults, he decides, and all obey. The Brethren were never divided in creed, and now they are not divided in purpose."
 NSR_tawhid_established:0 "Tawhid Established"
 NSR_tawhid_established_desc:0 "Worship belongs to God alone. This is the whole of the Brethren's creed, and it is now the creed of the state."
 NSR_religion_purified:0 "Religion Purified for God"
 NSR_religion_purified_desc:0 "\"And they were not commanded except to worship God, sincere to Him in religion\" (Quran 98:5)."
 NSR_tobacco_ban:0 "The Tobacco Ban"
 NSR_tobacco_ban_desc:0 "The Brethren of Najd would not sit with a man who smoked. Now no one smokes in al-Andalus, at least not in public, and the tobacco revenue is gone."
 NSR_public_virtue:0 "Public Virtue"
 NSR_public_virtue_desc:0 "The mosques are full at every prayer. The markets close for the call and the taverns are gone. Foreign visitors say the cities are strangely quiet."
 NSR_covenant_of_umar:0 "The Covenant of Umar"
 NSR_covenant_of_umar_desc:0 "The Christians and Jews of al-Andalus are dhimmis under the strict terms of the Covenant of Umar: they pay the jizya, may not build new churches or synagogues, and keep their worship out of sight. Many are leaving."
 NSR_protected_peoples:0 "The Protected Peoples"
 NSR_protected_peoples_desc:0 "The Christians and Jews are dhimmis, but their lives, property and places of worship are guaranteed by the Amir's own seal. The merchant houses of Málaga stay open."
 NSR_order_of_the_faith:0 "The Order of the Faith"
 NSR_order_of_the_faith_desc:0 "Every community of al-Andalus knows its place, its rights and its duties under the Sharia."
 NSR_bayt_al_mal_state:0 "The Bayt al-Mal of the Emirate"
 NSR_bayt_al_mal_state_desc:0 "The treasury of the Brethren has become the treasury of the state: zakat, the fifth, the jizya and the rents of the waqf."
 NSR_hijra_passport:0 "The Hijra Passport"
 NSR_hijra_passport_desc:0 "Any Muslim who emigrates to al-Andalus and gives his bay'ah to the Amir is a subject of the Emirate on the day he arrives."
 NSR_dar_al_hijra:0 "Dar al-Hijra"
 NSR_dar_al_hijra_desc:0 "The Abode of Emigration. From Tangier to Lahore, Muslims who want to live under the Sharia know where to go."
 NSR_taverns_closed:0 "The Taverns Closed"
 NSR_taverns_closed_desc:0 "The wine of Málaga no longer sells in Málaga. The vineyards are being replanted with almonds and figs, which takes years."
 NSR_shirk_removed:0 "The Brethren destroy the tombs of the saints"
 NSR_lions_removed:0 "The Lions of the Alhambra removed"
 NSR_covenant_of_umar_op:0 "The Covenant of Umar imposed"
 NSR_protected_peoples_op:0 "The Protected Peoples guaranteed"
 NSR_fatwa_on_treaties_op:0 "The Emirate will honour treaties"
 NSR_emirate_envoy:0 "Envoy of the Ikhwani Emirate"
 NSR_hajj_agreement:0 "Hajj agreement"
 NSR_hajj_refused:0 "Refused to talk about the Hajj"
 NSR_hajj_boycott:0 "Hajj boycott"
 NSR_governance_category:0 "Governing the Emirate"
 NSR_governance_category_desc:0 "The Amir governs through the Diwan, the provincial emirs and the Hisba. These are the everyday tools of the Emirate."
 NSR_remove_shirk_category:0 "Removing Shirk"
 NSR_remove_shirk_category_desc:0 "The domed tombs of the saints, the zawiyas of the Sufi orders and the festivals of the Prophet's birthday. To the Brethren all of these give to creatures what belongs to God alone. Buildings are taken down; people are not harmed. Where the Brethren are newcomers, the resentment is real."
 NSR_hijrah_category:0 "The Great Hijrah"
 NSR_hijrah_category_desc:0 "Muslims from across the world are coming to live under the Sharia. Settle them where the Emirate needs them. Where a settlement takes root, the land becomes part of al-Andalus.\n\n§YSettle Muhajirun§!: after §Y180§! days, if the state is still ours and Ikhwan Hold there is at least §Y50§!, it becomes a §Gcore§!."
 NSR_people_of_the_book_category:0 "The People of the Book"
 NSR_people_of_the_book_category_desc:0 "The Christians and Jews of al-Andalus have lived under Muslim rule for eight centuries. The Emirate must decide what dhimma will mean now."
 NSR_tt_hisba_after:0 "After §Y30§! days: Ikhwan Hold in this state §G+10§!. In a non-core state, compliance §G+5§! and resistance §R+3§!."
 NSR_tt_noncore_3_p5:0 "If this is not a core state: resistance §R+3§!, compliance §G+5§!"
 NSR_hisba_campaign:0 "Hisba Campaign in [FROM.GetName]"
 NSR_hisba_campaign_desc:0 "The Mutawwa Corps go from street to street: prayer at its time, the markets closed at the call, the wine poured out. In the old lands this settles the Brethren's authority. In newly conquered lands it is obeyed, and resented."
 NSR_friday_sermon_war:0 "Friday Sermon Directive: Striving"
 NSR_friday_sermon_war_desc:0 "The Dar al-Ifta sends one text to every minbar of the Emirate: a sermon on striving in the path of God."
 NSR_friday_sermon_peace:0 "Friday Sermon Directive: Obedience"
 NSR_friday_sermon_peace_desc:0 "This Friday every preacher reads the same sermon on obedience to those in authority and on patience in hardship."
 NSR_collect_the_zakat_emirate:0 "Collect the Zakat"
 NSR_collect_the_zakat_emirate_desc:0 "The collectors go out after the harvest: a tenth of what the rain waters, a twentieth of what is irrigated, and a fortieth of the herds and the silver."
 NSR_relief_from_bayt_al_mal:0 "Relief from the Bayt al-Mal"
 NSR_relief_from_bayt_al_mal_desc:0 "Grain, blankets and silver for the widows, the orphans and the poor of the Emirate, as the Quran commands."
 NSR_registration_of_the_hijras:0 "Registration of the Hijras"
 NSR_registration_of_the_hijras_desc:0 "The clerks of the census go through the settlements again. Every new household is written down, and every young man."
 NSR_tt_qubba_after:0 "After §Y20§! days: Ikhwan Hold §G+8§!. In a non-core state resistance rises and compliance falls, and the Sufi-minded Muslim countries are angered."
 NSR_tt_noncore_8_m5:0 "If this is not a core state: resistance §R+8§!, compliance §R-5§!"
 NSR_dismantle_the_qubbas:0 "Dismantle the Qubbas of [FROM.GetName]"
 NSR_dismantle_the_qubbas_desc:0 "The domed tombs over the graves of the saints are taken down stone by stone and the graves are levelled, as the Brethren did at al-Baqi in 1925. The workmen are paid and the bones are not disturbed. No one is to be harmed."
 NSR_tt_zawiya_after:0 "After §Y20§! days: Ikhwan Hold §G+5§!, Bayt al-Mal §G+10§!."
 NSR_tt_noncore_5_m3:0 "If this is not a core state: resistance §R+5§!, compliance §R-3§!"
 NSR_close_the_zawiya:0 "Close the Zawiya of [FROM.GetName]"
 NSR_close_the_zawiya_desc:0 "The lodge of the Sufi order is closed and its endowment passes to the Bayt al-Mal. The sheikh of the order may pray in any mosque, as any Muslim may."
 NSR_tt_zawiya_council_after:0 "After §Y20§! days: Ikhwan Hold §G+4§!, stability §G+1%§!."
 NSR_tt_hold_st_p4:0 "Ikhwan Hold in this state: §G+4§!"
 NSR_zawiya_under_the_council:0 "Place the Zawiya of [FROM.GetName] Under the Council"
 NSR_zawiya_under_the_council_desc:0 "The lodge stays open, but its teaching is approved by the Council of the Ulama. The dhikr is kept to what the Sunnah allows and the tomb inside is closed."
 NSR_end_the_mawlid:0 "End the Mawlid Festivals"
 NSR_end_the_mawlid_desc:0 "For centuries Granada lit its lamps on the Prophet's birthday, the mawlid, and the poets of the Alhambra wrote verses for it. The Brethren hold the celebration to be an innovation. This year there will be no lamps."
 NSR_emirate_hijrah_campaign:0 "Call to Hijrah"
 NSR_emirate_hijrah_campaign_desc:0 "Letters, pamphlets and preachers go out to the ports of the Maghreb, the Azhar, the Punjab and Bosnia: \"Is not the earth of God spacious enough for you to emigrate in it?\" (Quran 4:97)"
 NSR_tt_hold_st_p30:0 "Ikhwan Hold in this state: §G+30§!"
 NSR_tt_settle_after:0 "After §Y180§! days: if this state is still ours and Ikhwan Hold here is at least §Y50§!, it becomes a §Gcore§! of the Emirate."
 NSR_tt_settle_failed:0 "The settlement has not taken root. Raise Ikhwan Hold to §Y50§! and try again."
 NSR_settle_muhajirun:0 "Settle Muhajirun in [FROM.GetName]"
 NSR_settle_muhajirun_desc:0 "Three thousand muhajirun families are given land, seed and a mosque in [FROM.GetName]. If the settlement takes root, the land becomes part of al-Andalus."
 NSR_tr_muhajirun_4:0 "Muhajirun (thousands) is at least §Y4§!"
 NSR_tt_muhajirun_m4:0 "Muhajirun (thousands): §R-4§!"
 NSR_tt_muhajirun_div:0 "A division of §YMuhajirun§! infantry forms at the capital."
 NSR_muhajirun_battalions:0 "Muhajirun Battalions"
 NSR_muhajirun_battalions_desc:0 "Young muhajirun who came to fight rather than to farm are formed into battalions under Ikhwan officers."
 NSR_collect_the_jizya:0 "Collect the Jizya"
 NSR_collect_the_jizya_desc:0 "The collectors of the jizya visit the Christian villages of the Vega and the Jewish quarter of Málaga."
 NSR_charter_for_merchant_quarter:0 "Charter for the Merchant Quarter of [FROM.GetName]"
 NSR_charter_for_merchant_quarter_desc:0 "Christian, Jewish and foreign merchants are granted a quarter of their own, with their own warehouses and consuls, under the Amir's protection."
 nsr_emirate.3.t:0 "The Shura Convenes"
 nsr_emirate.3.d:0 "The sheikhs have come from every hijra to the Hall of the Ambassadors. There is no quarrel about the creed; that was settled at al-Artawiyah. The question is what comes first.\n\nDhaydan bin Hithlain speaks for Tamkin: \"A state that cannot feed its people cannot defend them.\" Sultan bin Bajad speaks for Jihad: \"The Spaniards will not wait for our granaries to fill.\" Faisal al-Dawish listens to both, as the Prophet listened to his companions."
 nsr_emirate.3.a:0 "Tamkin first: build the state."
 nsr_emirate.3.b:0 "Jihad first: the frontier will not wait."
 nsr_emirate.3.c:0 "Each has its season. The Amir will decide as the hour requires."
 nsr_emirate.4.t:0 "Heir of the Mutayr"
 nsr_emirate.4.d:0 "Faisal al-Dawish is past sixty and he was wounded at Sabilla. The sheikhs ask, carefully, who will lead the Mutayr, and the Emirate, when God takes him. The Amir answers that the Shura will give its bay'ah to whoever it chooses. But he has an opinion."
 nsr_emirate.4.a:0 "His son Azaiyiz, who rode beside him in Najd."
 nsr_emirate.4.b:0 "Sultan bin Bajad, the hero of the ghazu."
 nsr_emirate.4.c:0 "The Shura will choose when the time comes."
 NSR_tt_hold_all_p10:0 "Ikhwan Hold in every owned state: §G+10§!"
 nsr_emirate.5.t:0 "The Maliki Qadis Submit, or Emigrate"
 nsr_emirate.5.d:0 "For eight centuries the qadis of al-Andalus have judged by the school of Imam Malik. The Brethren hold to the teaching of Ibn Abd al-Wahhab and the Hanbali scholars of Najd. The Dar al-Ifta has asked every qadi to accept its rulings. Most have. Some have packed their books for Fez."
 nsr_emirate.5.a:0 "Those who accept the Dar al-Ifta keep their courts. Malik was an imam of the Sunnah."
 nsr_emirate.5.b:0 "Replace them all with qadis trained by the Brethren."
 NSR_tt_lions_world:0 "The democracies of the world are outraged."
 NSR_tt_lions_kept:0 "In every state that is not a core of the Emirate: Ikhwan Hold §G+5§!. The conquered see that the Brethren are not iconoclasts for the sake of it."
 nsr_emirate.6.t:0 "The Lions of the Alhambra"
 nsr_emirate.6.d:0 "In the Court of the Lions, twelve stone lions have carried a fountain since the days of Muhammad V. The Council of the Ulama has met to rule on them. On the principle there is no disagreement: images are not to be venerated, and no one in the Emirate may make new ones. The question is what to do with figures that no one has ever worshipped."
 nsr_emirate.6.a:0 "Remove them. The Council will not leave room for doubt."
 nsr_emirate.6.b:0 "Leave them. They are a fountain, and no one venerates them."
 nsr_emirate.7.t:0 "The Nasrid Tombs"
 nsr_emirate.7.d:0 "In the Rawda, the royal cemetery beside the Palace of the Lions, the Nasrid sultans lie under marble headstones carved with poetry. Some of the townspeople still leave flowers and ask the dead for their blessing. The Brethren levelled the graves at al-Baqi in 1925."
 nsr_emirate.7.a:0 "Level the graves to the ground, as the Sunnah prescribes."
 nsr_emirate.7.b:0 "Take away the markers but leave the graves untouched. The dead are owed their rest."
 nsr_emirate.8.t:0 "The Shadhili Sheikh Comes to the Alhambra"
 nsr_emirate.8.d:0 "The sheikh of the Shadhiliyya order of Granada has come to the Council of the Ulama with his disciples. He will close the tomb inside his zawiya and teach nothing the Council has not approved, if the lodge may stay open."
 nsr_emirate.8.a:0 "Accept. A Muslim who comes to the truth is our brother."
 nsr_emirate.8.b:0 "He will be watched."
 nsr_emirate.10.t:0 "The Voice in the Wire"
 nsr_emirate.10.d:0 "As Ibn Saud once did in Riyadh, the Amir has had the Quran recited over the telegraph from the Alhambra to Ronda. The sheikhs who called the wire the work of devils heard the Word of God come out of it. The Council of the Ulama has ruled: the telegraph, the telephone and the wireless are tools, and a tool is judged by what it carries."
 nsr_emirate.10.a:0 "The Brethren are reassured. Put the engineers to work."
 nsr_emirate.10.b:0 "Let the tribes hear it for themselves, in every hijra."
 NSR_voice_in_the_wire:0 "The Voice in the Wire"
 nsr_emirate.11.t:0 "The Tobacco Fields Burn"
 nsr_emirate.11.d:0 "In the Vega the tobacco harvest has been piled up and burnt by order of the Hisba. The farmers watched in silence; many of them had no other crop. They ask the Amir what they are to plant now, and how they are to pay the rent."
 nsr_emirate.11.a:0 "Compensate them from the Bayt al-Mal and give them wheat seed."
 nsr_emirate.11.b:0 "God will provide for those who leave the forbidden for His sake."
 nsr_emirate.12.t:0 "The Bishop's Petition"
 nsr_emirate.12.d:0 "The Bishop of Sevilla has sent a petition to the Alhambra, signed by the priests of every parish in the Emirate. He does not ask for privileges, only for what the Nasrid sultans always gave: the bells, the processions, the schools and the right to repair churches."
 nsr_emirate.12.a:0 "The bells stay silent, but the rest is granted."
 nsr_emirate.12.b:0 "The Covenant of Umar is the answer to his petition."
 nsr_emirate.12.c:0 "He will have his answer when the Council has ruled."
 NSR_tt_rabbis_trade:0 "Trade with the merchant houses of Málaga continues."
 nsr_emirate.13.t:0 "The Rabbis of Málaga"
 nsr_emirate.13.d:0 "The Jewish community of Málaga is older than the Nasrids. Its rabbis ask the Amir for a guarantee in writing. Their families have been merchants, physicians and translators to the sultans since the days of Samuel ibn Naghrillah."
 nsr_emirate.13.a:0 "Give it. They are People of the Book, and their trade feeds Málaga."
 nsr_emirate.13.b:0 "They will have the same terms as everyone else."
 nsr_emirate.14.t:0 "The Sons of the Sheikhs Go to School"
 nsr_emirate.14.d:0 "The Amir has ordered the sheikhs to send their sons to the new kuttab of the capital, to learn to read, to write and to count. Some sheikhs grumbled that reading was for townsmen. Faisal al-Dawish answered that the first word revealed to the Prophet was \"Read\"."
 nsr_emirate.14.a:0 "Read, in the name of your Lord."
 NSR_sons_of_the_sheikhs:0 "The Sons of the Sheikhs"
 nsr_emirate.15.t:0 "A Muhajir from Lahore"
 nsr_emirate.15.d:0 "Among the muhajirun who landed at Málaga this week is a young engineer from Lahore, trained in England and educated at the Islamia College. He read the poems of Iqbal on Córdoba and came to see al-Andalus for himself. He offers the Emirate whatever he knows."
 nsr_emirate.15.a:0 "Give him the technical school."
 nsr_emirate.15.b:0 "Send him to preach to the Indian muhajirun."
 NSR_muhajir_from_lahore:0 "A Muhajir from Lahore"
 nsr_emirate.16.t:0 "The Pilgrim Caravan"
 nsr_emirate.16.d:0 "The first pilgrims of the Ikhwani Emirate have sailed from Málaga for Jeddah under an agreement with Riyadh. Faisal al-Dawish watched them go. He cannot go himself: Ibn Saud has not forgotten Sabilla."
 nsr_emirate.16.a:0 "May God accept their Hajj."
 nsr_emirate.17.t:0 "The Ikhwani Emirate Asks for the Hajj"
 nsr_emirate.17.d:0 "The Emirate in al-Andalus, ruled by the same Faisal al-Dawish who rose against the King at Sabilla, asks for an agreement for its pilgrims to reach Mecca through Jeddah. Refusing Muslims the Hajj is a heavy thing. So is opening the road to the Ikhwan."
 nsr_emirate.17.a:0 "The Hajj is for every Muslim. Let them come."
 nsr_emirate.17.b:0 "Not while al-Dawish rules there."
 nsr_emirate.18.t:0 "Riyadh Closes the Road"
 nsr_emirate.18.d:0 "The King has refused the pilgrims of al-Andalus. The Brethren are not surprised. They remember that the King once fought them with British aeroplanes."
 nsr_emirate.18.a:0 "Then our pilgrims will go through Egypt, and we will remember."
 nsr_emirate.18.b:0 "Boycott: no Andalusi silver for the King's treasury."
 nsr_emirate.19.t:0 "Protest at the Shrine"
 nsr_emirate.19.d:0 "When the workmen came to take down the domed tomb in [NSR_qubba_state.GetName], the townspeople were waiting, the old men in front, the women on the rooftops. The workmen laid down their tools. The emir of the province asks what he should do."
 nsr_emirate.19.a:0 "Send qadis to explain, and wait a week."
 nsr_emirate.19.b:0 "The decree stands. Finish the work under guard."
 NSR_tt_bayt_al_mal_p5:0 "Bayt al-Mal of the Brethren: §G+5§!"
 nsr_emirate.20.t:0 "A Car for the Amir"
 nsr_emirate.20.d:0 "A merchant of Tangier has presented the Amir with a motor car, a black Hudson with the Shahada painted on the doors. Old Brethren muttered, as they once muttered against Ibn Saud's cars. The Amir has ridden it through the Vega himself, and the ulama have said nothing against it."
 nsr_emirate.20.a:0 "A machine is not sorcery. Buy trucks for the army."
 nsr_emirate.20.b:0 "Give the car to the Bayt al-Mal and ride a horse."
 nsr_emirate.21.t:0 "Missionaries Report from the Maghreb"
 nsr_emirate.21.d:0 "The preachers sent across the Strait have returned from Tetouan, Fez and the villages of the Rif. The French and Spanish watch them closely. The mosques were full, and the young men asked many questions about the Emirate."
 nsr_emirate.21.a:0 "Send more preachers, and books."
 nsr_emirate.21.b:0 "Enough for now. Let the seed grow."
 nsr_emirate.22.t:0 "Codifying the Sharia"
 nsr_emirate.22.d:0 "The Council of the Ulama is writing the first code of the Emirate, on the model of the Ottoman Majalla. The qadis of Najd want a code drawn from Ahmad ibn Hanbal and Ibn Taymiyyah. The Andalusi ulama ask that it also draw on Malik, whom the people have followed for eight centuries, wherever he agrees with the proof."
 nsr_emirate.22.a:0 "A Hanbali code, as in Najd."
 nsr_emirate.22.b:0 "Follow the proof, from whichever imam it comes."
 nsr_emirate.23.t:0 "Envoys of the Emirate"
 nsr_emirate.23.d:0 "The Emirate's first envoys are ready to sail. Where the first embassy goes will show the world what kind of state the Brethren mean to be."
 nsr_emirate.23.a:0 "To Cairo, the heart of the Muslim world."
 nsr_emirate.23.b:0 "To Ankara. The Turks, too, fought off the Europeans."
 nsr_emirate.23.c:0 "To London. Better to know the lion's mind than to guess it."
 nsr_emirate.24.t:0 "The Census of the Believers"
 nsr_emirate.24.d:0 "For the first time the Emirate knows how many it is: every household in every hijra, town and village, Muslim, Christian and Jew. The clerks have also counted the muhajirun, and there are more of them than anyone thought."
 nsr_emirate.24.a:0 "Register every man who can serve."
 nsr_emirate.24.b:0 "Use it to assess the zakat fairly."
 nsr_emirate.25.t:0 "A Quiet Rabi al-Awwal"
 nsr_emirate.25.d:0 "For the first time in seven hundred years, Granada did not light its lamps for the mawlid. In the Albaicín some families recited the old poems behind closed shutters. The Mutawwa did not knock."
 nsr_emirate.25.a:0 "The Prophet is honoured by following him."
 NSR_austerity_of_believers:0 "The Austerity of the Believers"
 NSR_austerity_of_believers_desc:0 "No silk, no tobacco, no imported luxuries. The Brethren of Najd lived on dates and camel's milk. The Andalusis are learning to live on less."
 NSR_wheat_not_tobacco:0 "Wheat, Not Tobacco"
 NSR_wheat_not_tobacco_desc:0 "The tobacco fields of the Vega are wheat fields now. Bread is cheaper than it has been for a generation."
 NSR_trade_with_believers:0 "Trade Only with Believers"
 NSR_trade_with_believers_desc:0 "The Emirate buys and sells with Muslims first, and with others only when it must."
 NSR_merchants_permitted:0 "The Merchants Are Permitted"
 NSR_merchants_permitted_desc:0 "Foreign merchants may trade in the ports of the Emirate, under its law and paying its customs."
 NSR_italian_barter:0 "The Italian Barter"
 NSR_italian_barter_desc:0 "Olive oil, cork and almonds go to Genoa. Coal, machine parts and fuel come back."
 NSR_technical_school:0 "The Technical School of Granada"
 NSR_technical_school_desc:0 "Surveyors, machinists and electricians, trained in Granada by teachers from Cairo, Istanbul and Lahore."
 NSR_war_economy_emirate:0 "The War Economy of the Emirate"
 NSR_war_economy_emirate_desc:0 "The workshops of the Vega work in two shifts, and the Bayt al-Mal pays for rifles before roads."
 NSR_industry_of_jihad:0 "The Industry of Jihad"
 NSR_industry_of_jihad_desc:0 "The Brethren who once smashed telegraph poles now run arms factories. The ulama call it preparing strength, as the Quran commands (8:60)."
 NSR_lessons_of_sabilla:0 "The Lessons of Sabilla"
 NSR_lessons_of_sabilla_desc:0 "In March 1929 the Brethren charged Ibn Saud's machine guns and armoured cars at Sabilla, and were cut down. The survivors have not forgotten."
 NSR_conscription_of_believers:0 "Conscription of the Believers"
 NSR_conscription_of_believers_desc:0 "Service in the army of the Emirate is a duty for every Muslim man, as the jihad once was for every man of the hijras."
 NSR_commandos_of_the_sierra:0 "Commandos of the Sierra"
 NSR_commandos_of_the_sierra_desc:0 "Small bands of hand-picked men who can cross the Sierra Nevada in winter, at night, in silence."
 NSR_mule_trains_desc:0 "Where trucks cannot go, the mules of the Alpujarras carry the ammunition."
 NSR_discipline_of_the_brethren:0 "The Discipline of the Brethren"
 NSR_discipline_of_the_brethren_desc:0 "The Ikhwan of Najd were brave but unruly. The Emirate's soldiers are brave and obey."
 NSR_zeal_of_the_brethren:0 "The Zeal of the Brethren"
 NSR_zeal_of_the_brethren_desc:0 "They go forward because they do not fear death, and they keep their ranks because the Amir has ordered it."
 NSR_fortified_sierra:0 "The Fortified Sierra"
 NSR_fortified_sierra_desc:0 "Trenches, blockhouses and gun pits in every pass of the Sierra Morena."
 NSR_doctrine_of_the_ghazu:0 "The Doctrine of the Ghazu"
 NSR_doctrine_of_the_ghazu_desc:0 "Speed, surprise and the raid in depth: the old ghazu of the desert, fought with motor columns."
 NSR_doctrine_of_the_believers:0 "The Doctrine of the Believers"
 NSR_doctrine_of_the_believers_desc:0 "\"How many a small company has overcome a large company by permission of God\" (Quran 2:249)."
 NSR_no_sailors:0 "We Have No Sailors"
 NSR_no_sailors_desc:0 "The Bedouin of Najd had never seen the sea before 1930. Most of the Sultan's sailors went over to the loyalists. The Emirate has ships, and almost no one to sail them."
 NSR_naval_academy:0 "The Naval Academy of Cádiz"
 NSR_naval_academy_desc:0 "The old Nasrid naval school reopens. Its cadets are the sons of fishermen, Andalusi and Moroccan."
 NSR_mines_in_the_strait:0 "Mines in the Strait"
 NSR_mines_in_the_strait_desc:0 "The cheapest navy in the world: a minefield between Tarifa and the African shore."
 NSR_raiding_doctrine:0 "The Raiding Doctrine"
 NSR_raiding_doctrine_desc:0 "The corsairs of Salé and Algiers never fought fleets. They took merchantmen. So will the Emirate."
 NSR_landing_craft:0 "Landing Craft for the Two Shores"
 NSR_landing_craft_desc:0 "Fishing boats, lighters and a few purpose-built landing barges: enough to put a Liwa ashore on the other side of the Strait."
 NSR_strait_closed:0 "The Strait Closed"
 NSR_strait_closed_desc:0 "Guns on both shores, mines in the channel and submarines in the approaches. Nothing passes the Pillars of Hercules without the Amir's leave."
 NSR_fleet_of_the_strait:0 "The Fleet of the Strait"
 NSR_fleet_of_the_strait_desc:0 "A small navy, but it knows every current between Cádiz and Almería."
 NSR_flight_school:0 "The Flight School of Málaga"
 NSR_flight_school_desc:0 "Young men of the hijras learn to fly over the sea at Málaga, taught by foreign instructors and a few Egyptian and Turkish pilots."
 NSR_air_doctrine_study:0 "Air Doctrine of the Emirate"
 NSR_air_doctrine_study_desc:0 "The air force exists to help the army win on the ground. Every pilot learns that first."
 NSR_wings_of_the_emirate:0 "Wings of the Emirate"
 NSR_wings_of_the_emirate_desc:0 "Abbas ibn Firnas jumped from a tower in Córdoba in the ninth century. His heirs have an air force."
 NSR_aircraft_customer:0 "Buys our aircraft"
 NSR_concession_holder:0 "Holds a mining concession"
 NSR_trade_partner_op:0 "Muslim trade partner"
 NSR_strait_closed_op:0 "Closed the Strait of Gibraltar"
 NSR_barter_partner:0 "Barter agreement"
 nsr_emirate.26.t:0 "The Lessons of Sabilla"
 nsr_emirate.26.d:0 "Sultan bin Bajad was at Sabilla. He tells the young officers of the Emirate what he saw: the Brethren charging on camels and horses, and the King's machine guns and armoured cars mowing them down in an afternoon. \"We were braver,\" he says. \"They were better armed. God gave victory to the one who prepared.\""
 nsr_emirate.26.a:0 "Machine guns for every company."
 nsr_emirate.26.b:0 "Guns that reach farther than theirs."
 nsr_emirate.27.t:0 "The Cádiz Crews"
 nsr_emirate.27.d:0 "Hundreds of the Sultan's sailors are in the Emirate's hands: prisoners, deserters and men who simply stayed with their ships. They know the sea, and the Brethren do not."
 nsr_emirate.27.a:0 "Pardon every sailor who gives his bay'ah."
 nsr_emirate.27.b:0 "Only Muslims who have learned the creed may serve."
 nsr_emirate.28.t:0 "An Aeroplane over the Alhambra"
 nsr_emirate.28.d:0 "The Emirate's first aeroplane circled the Alhambra this morning and landed in the Vega. An old sheikh of the Mutayr walked around it twice, touched the propeller and said: \"If Abbas ibn Firnas could fly with feathers, the believers can fly with this.\" Then he asked to go up in it."
 nsr_emirate.28.a:0 "Take him up. Let the tribes hear of it."
 nsr_emirate.28.b:0 "The pilots have work to do."
 nsr_emirate.29.t:0 "The Riotinto Company"
 nsr_emirate.29.d:0 "A British mining company offers to reopen the Riotinto mines under a concession: British engineers and capital, Andalusi labour, a share of the profits to the Bayt al-Mal. The ulama have ruled the contract lawful, if the Emirate's law governs it."
 nsr_emirate.29.a:0 "Sign it."
 nsr_emirate.29.b:0 "Only if the Bayt al-Mal holds the majority."
 nsr_emirate.30.t:0 "The Stud Farms of the Vega"
 nsr_emirate.30.d:0 "The Nasrid stud farms still breed the Andalusian horse. The Brethren's horses are Arabians from Najd. The breeders argue over which is the better cavalry horse, and the Amir is asked to decide."
 nsr_emirate.30.a:0 "The Arabian. It carried the Brethren from Najd."
 nsr_emirate.30.b:0 "Cross them. The best of both."
 nsr_emirate.31.t:0 "The Veterans Remember"
 nsr_emirate.31.d:0 "The old men of the Veterans of Sabilla meet each year on the anniversary of the battle. They pray for the dead, and then they drill the recruits until dark."
 nsr_emirate.31.a:0 "They are the memory of the Brethren."
 nsr_emirate.32.t:0 "The Strait Is Closed"
 nsr_emirate.32.d:0 "The guns on both shores are in place and the minefield is laid. The British in Gibraltar have protested in the strongest terms. The Italians and the French are watching the Emirate closely."
 nsr_emirate.32.a:0 "The Strait belongs to those who live on both its shores."
 nsr_emirate.32.b:0 "Let merchant ships pass, for a toll."
 nsr_emirate.33.t:0 "The First Rifle of the Hijras"
 nsr_emirate.33.d:0 "The arms workshop of the Vega has finished its first rifle, a copy of the Mauser with the Shahada engraved on the receiver. Faisal al-Dawish fired it himself."
 nsr_emirate.33.a:0 "May God put strength in it."
 NSR_imamate_of_believers:0 "The Imamate of the Believers"
 NSR_imamate_of_believers_desc:0 "Faisal al-Dawish is called Imam by those who emigrate to him. The title wins hearts in the hijras and enemies in every Muslim capital that has its own king."
 NSR_no_alliance_with_infidels:0 "No Alliance with Unbelievers"
 NSR_no_alliance_with_infidels_desc:0 "The Emirate signs trade treaties, not alliances. It will not fight London's wars, or Rome's, or Berlin's."
 NSR_volunteers_for_faithful:0 "Volunteers for the Faithful"
 NSR_volunteers_for_faithful_desc:0 "Wherever Muslims fight for their land, volunteers from the hijras of al-Andalus go to fight beside them."
 NSR_abd_el_krim_in_granada:0 "Abd el-Krim in Granada"
 NSR_abd_el_krim_in_granada_desc:0 "The hero of Anual lives in exile in Granada. He is no Wahhabi and says so openly, but every Rifi and every Moroccan knows his name."
 NSR_voice_of_the_believers:0 "Voice of the Believers"
 NSR_voice_of_the_believers_desc:0 "From Granada the Emirate speaks for Muslims who have no state of their own, and the world has learned to listen."
 NSR_andalusi_levies:0 "The Andalusi Levies"
 NSR_andalusi_levies_desc:0 "Every village of the Emirate sends its young men to the frontier regiments."
 NSR_frontier_hijras:0 "The Frontier Hijras"
 NSR_frontier_hijras_desc:0 "Every conquered valley gets a settlement of muhajirun, with a mosque, a well and a watchtower."
 NSR_friday_in_the_mezquita:0 "Friday in the Mezquita"
 NSR_friday_in_the_mezquita_desc:0 "For the first time since 1236, the call to Friday prayer sounds in the Great Mosque of Córdoba."
 NSR_north_garrisoned:0 "The North Garrisoned"
 NSR_north_garrisoned_desc:0 "Blockhouses in every valley of the Cantabrian mountains. The north is held, but it takes many men to hold it."
 NSR_fueros_of_the_north:0 "The Fueros of the North"
 NSR_fueros_of_the_north_desc:0 "The northern valleys keep their old laws, their priests and their councils, and pay the jizya to the Emirate."
 NSR_salafi_maghreb:0 "A Salafi Maghreb"
 NSR_salafi_maghreb_desc:0 "In the Maghreb the Emirate works with the Salafi reformers of Fez and Algiers and closes the zawiyas. The brotherhoods resent it deeply."
 NSR_maghreb_of_zawiyas:0 "A Maghreb of the Zawiyas"
 NSR_maghreb_of_zawiyas_desc:0 "The Sufi lodges of the Maghreb keep their doors open, under the supervision of the Council of the Ulama. The Brethren at home grumble."
 NSR_al_andalus_restored:0 "Al-Andalus Restored"
 NSR_al_andalus_restored_desc:0 "From the Pyrenees to Tarifa the land is called al-Andalus again."
 NSR_two_shores:0 "The Two Shores"
 NSR_two_shores_desc:0 "The Strait no longer divides the Muslims of the West. Tariq's road runs both ways."
 NSR_atlantic_to_najd:0 "From the Atlantic to Najd"
 NSR_atlantic_to_najd_desc:0 "The exiles of Sabilla have come home, and they have brought al-Andalus with them."
 NSR_najd_ikhwan_zeal:0 "The Brethren Rise Again"
 NSR_najd_ikhwan_zeal_desc:0 "The Ikhwan of Najd, kin of the exiles of al-Andalus, have taken up the banner their fathers lowered at Sabilla."
 NSR_reconciled_op:0 "Reconciled with the Brethren"
 NSR_vendetta_op:0 "The vendetta of Sabilla"
 NSR_hashemite_enmity:0 "The raids of the 1920s remembered"
 NSR_ankara_contempt:0 "Contempt for secular Turkey"
 NSR_border_ghazu:0 "Border Ghazu Against [FROM.GetName]"
 NSR_tangier_claim:0 "Claims Tangier"
 NSR_old_protector_op:0 "The old understanding"
 NSR_expel_infidel_op:0 "Wants us out of the Strait"
 NSR_congress_op:0 "Muslim Congress of Granada"
 NSR_imamate_rival:0 "Claims the Imamate of the Believers"
 NSR_courting_moroccans:0 "Courts the Moroccan nationalists"
 NSR_good_neighbour:0 "A quiet neighbour"
 NSR_arms_customer:0 "Buys our weapons"
 NSR_abd_el_krim_op:0 "Freed Abd el-Krim"
 NSR_brother_in_faith:0 "Brothers in faith"
 NSR_najd_meddling:0 "Arms the Ikhwan of Najd"
 NSR_ghazu_category:0 "The Ghazu Beyond the Frontier"
 NSR_ghazu_category_desc:0 "Raids across the border and rifles for the tribes of the Maghreb: the old ways of the desert, used against new enemies."
 NSR_najd_category:0 "The Road to Najd"
 NSR_najd_category_desc:0 "Faisal al-Dawish left kinsmen in Najd, and Ibn Saud never forgave them. Letters, money and rifles can raise the Brethren of Najd again.\n\nIkhwan cells in Najd: §Y[?NSR_najd_cells]§! (the revolt needs at least §Y3§!; more cells mean a bigger revolt)."
 NSR_border_ghazu_desc:0 "Ikhwan horsemen cross the frontier by night, drive off herds, burn a customs post and are gone by morning. It keeps the young men sharp and the enemy nervous. It also makes the world think the Emirate is dangerous."
 NSR_threat_border_ghazu:0 "Ikhwan border raids"
 NSR_tt_tribes_armed:0 "The tribes of this state are armed. If we go to war with its owner, we can raise them."
 NSR_tt_tribes_hold:0 "Ikhwan Hold in this state: §G+10§!"
 NSR_arm_the_tribes:0 "Arm the Tribes of [FROM.GetName]"
 NSR_arm_the_tribes_desc:0 "Rifles smuggled in fishing boats and on the backs of mules, for the tribesmen who remember Abd el-Krim, and for those who remember nothing but the French and Spanish tax collectors."
 NSR_tt_tribal_levies:0 "Two divisions of §YTribal Levies§! join us at the capital (tribesmen, not Ikhwan: they do not count as Ikhwan divisions)."
 NSR_tt_tribes_hurt_owner:0 "The owner of the state: war support §R-2%§!, §R300§! infantry equipment lost to the uprising."
 NSR_raise_the_tribes:0 "Raise the Tribes of [FROM.GetName]"
 NSR_raise_the_tribes_desc:0 "The signal fires are lit. The armed tribes of [FROM.GetName] rise against their colonial masters and send their best riders to join the Emirate."
 NSR_tr_cells_lt5:0 "Fewer than §Y5§! Ikhwan cells in Najd"
 NSR_fund_najd_cells:0 "Fund Ikhwan Cells in Najd"
 NSR_fund_najd_cells_desc:0 "Silver from the Bayt al-Mal, carried by pilgrims and merchants, for the hijras of Najd that Ibn Saud disarmed after Sabilla."
 NSR_tr_cells_ge3:0 "At least §Y3§! Ikhwan cells in Najd"
 NSR_tt_najd_revolt:0 "The §YIkhwan of Najd§! rise against Ibn Saud: Saudi Arabia falls into §Rcivil war§!. The more cells we funded, the bigger the revolt (§Y3§!: small, §Y4§!: medium, §Y5§!: large)."
 NSR_second_ikhwan_revolt_dec:0 "The Second Ikhwan Revolt"
 NSR_second_ikhwan_revolt_dec_desc:0 "Send the word to Artawiyah and Ghatghat: the Brethren of Najd rise again. What happens after that is in the hands of God, and of the rifles we have sent."
 NSR_tt_najd_volunteers:0 "The Ikhwan of Najd receive §Y1000§! infantry equipment and §Y3000§! men."
 NSR_send_volunteers_to_najd:0 "Send Volunteers to Najd"
 NSR_send_volunteers_to_najd_desc:0 "Muhajirun from Najd who settled in the Alpujarras volunteer to go home and fight. The Emirate sends them with rifles."
 NSR_najd_ikhwan:0 "Ikhwan of Najd"
 NSR_najd_ikhwan_DEF:0 "the Ikhwan of Najd"
 NSR_najd_ikhwan_ADJ:0 "Najdi Ikhwan"
 NSR_najd_ikhwan_fascism:0 "Ikhwan of Najd"
 NSR_najd_ikhwan_fascism_DEF:0 "the Ikhwan of Najd"
 NSR_najd_ikhwan_fascism_ADJ:0 "Najdi Ikhwan"
 NSR_najd_ikhwan_party:0 "Ikhwan"
 NSR_najd_ikhwan_party_long:0 "Ikhwan man Ta'a Allah (the Brethren of Those Who Obey God)"
 NSR_ikhwani_restored:0 "Emirate of al-Andalus"
 NSR_ikhwani_restored_DEF:0 "the Emirate of al-Andalus"
 NSR_ikhwani_restored_ADJ:0 "Andalusi"
 NSR_ikhwani_restored_fascism:0 "Emirate of al-Andalus"
 NSR_ikhwani_restored_fascism_DEF:0 "the Emirate of al-Andalus"
 NSR_ikhwani_restored_fascism_ADJ:0 "Andalusi"
 NSR_ikhwani_restored_neutrality:0 "Emirate of al-Andalus"
 NSR_ikhwani_restored_neutrality_DEF:0 "the Emirate of al-Andalus"
 NSR_ikhwani_restored_neutrality_ADJ:0 "Andalusi"
 NSR_dar_al_islam_faction:0 "The Dar al-Islam Pact"
 NSR_tt_recog_muslim:0 "Egypt, Turkey, Afghanistan, Persia, Yemen and Iraq: opinion §G+20§!"
 NSR_tt_recog_powers:0 "Britain, Italy and France: opinion §G+20§!"
 nsr_emirate.34.t:0 "The Question of Recognition"
 nsr_emirate.34.d:0 "No government in the world has yet recognised the Ikhwani Emirate. The Council of the Ulama rules that sending envoys to unbelievers is lawful, as the Prophet received and sent envoys. The Diwan asks where the first envoys should go."
 nsr_emirate.34.a:0 "To the Muslim capitals first."
 nsr_emirate.34.b:0 "To London, Rome and Paris. They decide what happens in the Strait."
 nsr_emirate.35.t:0 "An Envoy from Granada"
 nsr_emirate.35.d:0 "An envoy of Faisal al-Dawish has arrived in Riyadh with a letter for the King. The man who led the revolt of 1929 asks for reconciliation, \"as brothers in the religion, with the sea between us\". The King's counsellors are divided."
 nsr_emirate.35.a:0 "Peace with the Brethren beyond the sea."
 nsr_emirate.35.b:0 "Faisal al-Dawish is a rebel. There is nothing to discuss."
 nsr_emirate.36.t:0 "Riyadh's Answer"
 nsr_emirate.36.d:0 "The King has accepted. There will be peace between Riyadh and Granada, and neither will shelter the other's enemies. Old men in the hijras weep; some for joy, some for Sabilla."
 nsr_emirate.36.a:0 "Praise be to God, who reconciles hearts."
 nsr_emirate.37.t:0 "Riyadh's Answer"
 nsr_emirate.37.d:0 "The King has sent the envoy back without a letter. In Riyadh, the court says Faisal al-Dawish should have been handed over in 1930 and still should be."
 nsr_emirate.37.a:0 "Then there is nothing more between us."
 nsr_emirate.38.t:0 "Kuwait Remembers Jahra"
 nsr_emirate.38.d:0 "In October 1920 Faisal al-Dawish led the Ikhwan against the Red Fort of Jahra, and the Kuwaitis held. Kuwaiti newspapers have remembered the battle, and the Amir, now in Granada, has been asked what he remembers."
 nsr_emirate.38.a:0 "Kuwait owes the Brethren a debt of blood."
 nsr_emirate.38.b:0 "Old quarrels. Let them rest."
 NSR_tt_tangier_op:0 "Britain, France and Spain: opinion §R-10§!"
 nsr_emirate.39.t:0 "The Tangier Question"
 nsr_emirate.39.d:0 "Tangier has been an international zone since 1923, run by Britain, France and Spain. The Emirate says the city belongs to the Muslims of Morocco. The consuls of Tangier are not amused."
 nsr_emirate.39.a:0 "Tangier is a Muslim city."
 nsr_emirate.40.t:0 "Italy's Offer"
 nsr_emirate.40.d:0 "In March 1937 Mussolini had himself presented with the \"Sword of Islam\" in Libya. Now his consul in Málaga offers the Emirate rifles, guns and instructors. The Brethren remember that Italy hanged Omar al-Mukhtar in 1931."
 nsr_emirate.40.a:0 "Accept the rifles. We need them."
 nsr_emirate.40.b:0 "From the hangman of Omar al-Mukhtar? Never."
 nsr_emirate.41.t:0 "A German Delegation"
 nsr_emirate.41.d:0 "A German delegation, led by an Orientalist of the Foreign Office, has come to Granada. Berlin offers engineers, credit and machine tools, and asks nothing in return, for now."
 nsr_emirate.41.a:0 "Take the engineers."
 nsr_emirate.41.b:0 "The Emirate needs no new masters."
 NSR_german_delegation:0 "A German Delegation"
 nsr_emirate.42.t:0 "London's Warning"
 nsr_emirate.42.d:0 "The British ambassador has delivered a note: any threat to Gibraltar will be treated as a threat to the British Empire. Faisal al-Dawish has met British officers before, in 1930, when they put him on a ship."
 nsr_emirate.42.a:0 "The Strait belongs to the believers."
 nsr_emirate.42.b:0 "Words, for now. Let them talk."
 nsr_emirate.43.t:0 "The Old Protector"
 nsr_emirate.43.d:0 "The British consul proposes an understanding: Britain will not interfere in the Emirate, and the Emirate will leave Gibraltar alone. It is the same kind of bargain Ibn Saud made with London in 1927."
 nsr_emirate.43.a:0 "A pragmatic peace."
 NSR_tt_krim_odds:0 "§Y55%§! chance that the rescue succeeds."
 nsr_emirate.44.t:0 "A Ship off Réunion"
 nsr_emirate.44.d:0 "Abd el-Krim, the hero of the Rif war, has lived in exile on the French island of Réunion since 1926. A Moroccan merchant captain offers to take him off the island, if the Emirate pays and the French do not notice."
 nsr_emirate.44.a:0 "Send the ship."
 nsr_emirate.44.b:0 "Too dangerous. Not now."
 NSR_tt_krim_hold:0 "Ikhwan Hold in Spanish Africa and Casablanca: §G+15§!"
 nsr_emirate.45.t:0 "Abd el-Krim Freed"
 nsr_emirate.45.d:0 "Abd el-Krim has landed at Almería. The Amir met him at the harbour. He is no Wahhabi and says so openly, but he hates the French more than he distrusts the Brethren. The Rif is already singing about his return."
 nsr_emirate.45.a:0 "Welcome, Amir of the Rif."
 nsr_emirate.46.t:0 "The Plot Discovered"
 nsr_emirate.46.d:0 "The French police on Réunion have arrested the captain and his crew. Paris knows who paid them."
 nsr_emirate.46.a:0 "God willed otherwise."
 nsr_emirate.47.t:0 "The Sanusi Envoy"
 nsr_emirate.47.d:0 "An envoy of Sayyid Idris al-Sanusi, in exile in Egypt since 1922, has come to Granada. He proposes an alliance against Italy for the freedom of Cyrenaica. The Sanusiyya is a Sufi order, and the Brethren do not hide what they think of Sufi orders."
 nsr_emirate.47.a:0 "Against Italy, our differences can wait."
 nsr_emirate.47.b:0 "The Sanusiyya is a Sufi order. We cannot."
 NSR_tt_fez_hold:0 "Ikhwan Hold in Casablanca and Marrakech: §G+10§!"
 nsr_emirate.48.t:0 "Letters from Fez"
 nsr_emirate.48.d:0 "Allal al-Fassi and the young Salafi nationalists of Fez write to the Amir. They want a Morocco free of France and Spain, ruled by the Sharia, but they want a sultan in Rabat, not an amir in Granada."
 nsr_emirate.48.a:0 "Send them money and books."
 nsr_emirate.48.b:0 "They are nationalists, not Brethren."
 NSR_tt_congress_all:0 "Muslim states: opinion §G+15§!"
 NSR_tt_congress_few:0 "Saudi Arabia, Yemen and Afghanistan: opinion §G+15§!"
 nsr_emirate.49.t:0 "The Muslim Congress of Granada"
 nsr_emirate.49.d:0 "Delegates are arriving in Granada for a Muslim congress, as Ibn Saud once gathered one in Mecca in 1926 and the Mufti of Jerusalem did in 1931. The ulama of the Emirate ask who should be admitted."
 nsr_emirate.49.a:0 "Every Muslim land may send delegates."
 nsr_emirate.49.b:0 "Only those who accept tawhid."
 nsr_emirate.50.t:0 "The Caliphate Question"
 nsr_emirate.50.d:0 "In 1924 Sharif Hussein proclaimed himself caliph; months later the Ikhwan took Mecca. Now a Turkish newspaper asks whether Faisal al-Dawish will call himself caliph too. The Amir answers the question himself."
 nsr_emirate.50.a:0 "There is no caliph today. There is the Book."
 nsr_emirate.50.b:0 "He is Imam of those who emigrate to him. That is enough."
 nsr_emirate.51.t:0 "The Fall of Córdoba"
 nsr_emirate.51.d:0 "The Brethren are in Córdoba, capital of the caliphs. Its Great Mosque has been a cathedral since 1236, with a Renaissance choir built into its heart. The Council of the Ulama asks what should become of it."
 nsr_emirate.51.a:0 "Open the Mezquita for Friday prayer."
 nsr_emirate.51.b:0 "Leave the cathedral to its priests. Build a new mosque beside it."
 NSR_threat_mezquita:0 "The Mezquita of Córdoba"
 nsr_emirate.52.t:0 "Friday in the Mezquita"
 nsr_emirate.52.d:0 "The Christian altars and chapels have been closed and covered, and their clergy moved to the parish churches of the city. On Friday Faisal al-Dawish led the prayer beneath the arches of Abd al-Rahman I. It is the first Friday prayer in the Mezquita for seven hundred years."
 nsr_emirate.52.a:0 "God is greatest."
 nsr_emirate.53.t:0 "The Mountains of Pelayo"
 nsr_emirate.53.d:0 "In 722 Pelayo held the mountains of Asturias against the Muslims, and the Reconquista began there. The valleys of the north still do not accept the Emirate. How should they be ruled?"
 nsr_emirate.53.a:0 "Garrison every valley."
 nsr_emirate.53.b:0 "Let them keep their fueros and pay the jizya."
 nsr_emirate.54.t:0 "The Brethren Reunited"
 nsr_emirate.54.d:0 "The Amir of al-Andalus proposes that the Ikhwan of Najd accept him as their protector, \"as the brothers of the hijras once followed one banner\"."
 nsr_emirate.54.a:0 "Accept the protection of the Amir."
 nsr_emirate.54.b:0 "Najd needs no amir from across the sea."
 nsr_emirate.55.t:0 "The Brethren Accept"
 nsr_emirate.55.d:0 "The sheikhs of Najd have given their bay'ah to Faisal al-Dawish. The exiles of Sabilla and the brothers they left behind are under one banner again."
 nsr_emirate.55.a:0 "The Brethren are one again."
 nsr_emirate.56.t:0 "The Brethren Refuse"
 nsr_emirate.56.d:0 "The sheikhs of Najd thank the Amir for his help, but they will rule themselves."
 nsr_emirate.56.a:0 "Brothers still, if not subjects."
 nsr_emirate.57.t:0 "The Pilgrim Caravan"
 nsr_emirate.57.d:0 "The great caravan of the Emirate sets out for Mecca: ships from Málaga to Alexandria, then the Red Sea to Jeddah. It is the largest pilgrimage from the West since the fall of Granada."
 nsr_emirate.57.a:0 "May God accept their pilgrimage."
 nsr_emirate.58.t:0 "The Najd Revolt Triumphs"
 nsr_emirate.58.d:0 "Riyadh has fallen to the Ikhwan of Najd. The kinsmen of the exiles of Sabilla rule the heart of Arabia."
 nsr_emirate.58.a:0 "Praise be to God."
 nsr_emirate.59.t:0 "Riyadh Crushes the Revolt"
 nsr_emirate.59.d:0 "The King's armoured cars and machine guns have done in Najd what they did at Sabilla. Survivors of the revolt are escaping to the coast, and many of them will come to al-Andalus."
 nsr_emirate.59.a:0 "They will be welcome here."
 nsr_emirate.60.t:0 "An Invitation to the Dar al-Islam Pact"
 nsr_emirate.60.d:0 "The Ikhwani Emirate invites us into its Dar al-Islam Pact, an alliance of Muslim states for mutual defence."
 nsr_emirate.60.a:0 "Join the pact."
 nsr_emirate.60.b:0 "We will stay outside."
 nsr_emirate.61.t:0 "The Emirate Asks to Join"
 nsr_emirate.61.d:0 "The Ikhwani Emirate of al-Andalus asks to join our alliance. It controls the northern shore of the Strait of Gibraltar."
 nsr_emirate.61.a:0 "Welcome them."
 nsr_emirate.61.b:0 "Of no use to us."
 nsr_news.13.t:0 "Friday Prayer in the Mezquita of Córdoba"
 nsr_news.13.d:0 "For the first time since 1236, Muslims have prayed the Friday prayer in the Great Mosque of Córdoba. The Amir Faisal al-Dawish led the prayer. The Holy See has protested, and there are demonstrations in Madrid, Lisbon and Paris."
 nsr_news.13.a:0 "God is greatest."
 nsr_news.13.b:0 "The world watches Córdoba."
 nsr_news.14.t:0 "The Second Ikhwan Revolt"
 nsr_news.14.d:0 "The Ikhwan have risen again in Najd. The hijras of Artawiyah and Ghatghat have declared that King Abdulaziz has betrayed the religion, as they did in 1927. Everyone knows where their money and rifles came from."
 nsr_news.14.a:0 "The Brethren rise again."
 nsr_news.14.b:0 "Arabia burns again."
 nsr_news.15.t:0 "The Two Shores United"
 nsr_news.15.d:0 "For the first time since the Almohads, one Muslim state rules both shores of the Strait of Gibraltar, from Córdoba to Tunis."
 nsr_news.15.a:0 "Tariq's road runs both ways."
 nsr_news.15.b:0 "The Strait has a new master."
 nsr_news.16.t:0 "The Reconquista Reversed"
 nsr_news.16.d:0 "Madrid has fallen to the Ikhwani Emirate. For five hundred years Castile waited to finish what Ferdinand and Isabella began at the gates of Granada. It never did, and now Granada has taken Madrid."
 nsr_news.16.a:0 "The Reconquista failed."
 nsr_news.16.b:0 "History runs backwards."
 NSR_yahya_al_rundi_political_advisor:0 "Qadi Yahya ibn Abd al-Wahid al-Rundi"
 NSR_yahya_al_rundi_political_advisor_desc:0 "A Maliki qadi of Ronda who sat on the Sultan's bench for twenty years before he walked out of it to judge in the Brethren's courts. He knows the old Andalusi law books by heart and argues from Sahnun and Ibn Rushd al-Jadd as readily as from the Najdi scholars, and so the Andalusis trust him when they trust no one from the desert. Head of the sharia courts, later Chief Qadi. §g(Fictional character, AI-painted portrait.)§!"
 NSR_yahya_al_rundi:0 "Qadi Yahya ibn Abd al-Wahid al-Rundi"
 NSR_yahya_al_rundi_desc:0 "A Maliki qadi of Ronda who sat on the Sultan's bench for twenty years before he walked out of it to judge in the Brethren's courts. He knows the old Andalusi law books by heart and argues from Sahnun and Ibn Rushd al-Jadd as readily as from the Najdi scholars, and so the Andalusis trust him when they trust no one from the desert. Head of the sharia courts, later Chief Qadi. §g(Fictional character, AI-painted portrait.)§!"
 NSR_ahmad_al_susi_political_advisor:0 "Shaykh Ahmad al-Susi"
 NSR_ahmad_al_susi_political_advisor_desc:0 "A preacher from the Sous who crossed the Strait with the first Moroccan muhajirun and never stopped talking about the ones still left behind. His sermons are printed in Tangier and read aloud in the markets of Fez and Marrakesh. He leads the Call to Hijrah across the Maghreb. §g(Fictional character, AI-painted portrait.)§!"

 NSR_sulayman_al_basri_political_advisor:0 "Sulayman al-Basri"
 NSR_sulayman_al_basri_political_advisor_desc:0 "A date and wool merchant of Basra whose caravans once supplied the Ikhwan camps at Artawiya. He followed his debtors into exile and ended up keeping their accounts. As treasurer of the Bayt al-Mal he is feared by every tax farmer in the Vega. §g(Fictional character, AI-painted portrait.)§!"

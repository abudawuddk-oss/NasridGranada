 NSR_ilyas_bensaid_air_chief:0 "Ilyas Bensaid"
 NSR_ilyas_bensaid_air_chief_desc:0 "Born in Tlemcen and trained as a mechanic and then a pilot at the French schools in Algeria, he was never allowed to wear an officer's stripes. He answered the Call to Hijrah with nothing but his logbook, and he now runs the Emirate's small air arm from the fields of the Vega. §g(Fictional character, AI-painted portrait.)§!"

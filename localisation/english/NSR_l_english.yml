 NSR_abd_al_aziz_al_mutawwa_political_advisor:0 "Abd al-Aziz al-Mutawwa"
 NSR_abd_al_aziz_al_mutawwa_political_advisor_desc:0 "A Najdi scholar who taught in the hijar before the exile and who now commands the Mutawwa Corps: the men who close the shops at prayer time, carry the lists of the absent, and walk the markets of Granada with their staffs. §g(Fictional character, AI-painted portrait.)§!"
